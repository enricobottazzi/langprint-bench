          "maxOccupiedPages": 2.0,
          "text": "February 14, 2007 Spain — Telefónica's Employee Pension Plan ended 2006 with a return of 5.5%. This plan has approximately 50% of its assets invested in the stock market, according to its annual report. Other Spanish pension plans with a similar investment profile achieved returns in 2006 that were double that of this plan.\n\nThe Spanish stock market rose by an average of 32% last year, and most international markets rose between 15% and 20%.\n\nTelefónica, the General Union of Workers (UGT), and the Workers' Commissions (CCOO) are the only members of the Pension Plan's Oversight Committee. This committee is responsible for monitoring the investments made by the management company (Fonditel), which is owned by Telefónica (70%), CCOO (15%), and UGT (15%). This Commission has not issued a statement regarding the results obtained in the pension plan.\n\nThus, UGT and CCOO obtained a profit of 4.5 million euros in 2005 from their 30% stake in Fonditel, of which the remaining 70% belongs to Telefónica. According to its latest published results, available on its website, Fonditel Memorias, this company obtained an annual profit of 15.025 billion euros and annual expenses of 6.010 billion euros, of which 3.6 million euros correspond to the salaries of 29 employees, or an average of 124,000 euros per year per employee. This company collects commissions of more than 18 million euros, giving Telefónica, CCOO, and UGT a return of 39% on equity.\n\nIt so happens that the elections to the Pension Plan Control Commission were abolished in February 2005. This Commission is the body that should safeguard the interests of the workers in the plan; its election was replaced by the direct appointment of the Telefónica Inter-Center Committee, thus excluding all early retirees from being able to decide on their own money and preventing direct election by active workers.",

          "title": "How Many Species Are There on Earth and in the Ocean?",
          "maxOccupiedPages": 3.380952380952381,
          "text": "Robert May [1] recently noted that if aliens visited our planet, one of their first questions would be, “How many distinct life forms—species—does your planet have?” He also pointed out that we would be “embarrassed” by the uncertainty in our answer. This narrative illustrates the fundamental nature of knowing how many species there are on Earth, and our limited progress with this research topic thus far [1]–[4]. Unfortunately, limited sampling of the world's biodiversity to date has prevented a direct quantification of the number of species on Earth, while indirect estimates remain uncertain due to the use of controversial approaches (see detailed review of available methods, estimates, and limitations in Table 1). Globally, our best approximation to the total number of species is based on the opinion of taxonomic experts, whose estimates range between 3 and 100 million species [1]; although these estimations likely represent the outer bounds of the total number of species, expert-opinion approaches have been questioned due to their limited empirical basis [5] and subjectivity [5]–[6] (Table 1). Other studies have used macroecological patterns and biodiversity ratios in novel ways to improve estimates of the total number of species (Table 1), but several of the underlying assumptions in these approaches have been the topic of sometimes heated controversy ([3]–[17], Table 1); moreover their overall predictions concern only specific groups, such as insects [9],[18]–[19], deep sea invertebrates [13], large organisms [6]–[7],[10], animals [7], fungi [20], or plants [21]. With the exception of a few extensively studied taxa (e.g., birds [22], fishes [23]), we are still remarkably uncertain as to how many species exist, highlighting a significant gap in our basic knowledge of life on Earth. Here we present a quantitative method to estimate the global number of species in all domains of life. We report that the number of higher taxa, which is much more completely known than the total number of species [24], is strongly correlated to taxonomic rank [25] and that such a pattern allows the extrapolation of the global number of species for any kingdom of life (Figures 1 and 2).\n\nHigher taxonomy data have been previously used to quantify species richness within specific areas by relating the number of species to the number of genera or families at well-sampled locations, and then using the resulting regression model to estimate the number of species at other locations for which the number of families or genera are better known than species richness (reviewed by Gaston & Williams [24]). This method, however, relies on extrapolation of patterns from relatively small areas to estimate the number of species in other locations (i.e., alpha diversity). Matching the spatial scale of this method to quantify the Earth's total number of species would require knowing the richness of replicated planets; not an option as far as we know, although May's aliens may disagree. Here we analyze higher taxonomic data using a different approach by assessing patterns across all taxonomic levels of major taxonomic groups. The existence of predictable patterns in the higher taxonomic classification of species allows prediction of the total number of species within taxonomic groups and may help to better constrain our estimates of global species richness.",

          "title": "Widespread Forest Vertebrate Extinctions Induced by a Mega Hydroelectric Dam in Lowland Amazonia",
          "maxOccupiedPages": 3.0,
          "text": "Hydroelectric dams are rapidly emerging as the new villain in the myriad of anthropogenic threats to tropical forest biotas. Dams displace indigenous communities [1], disrupt the natural flow of rivers [2], critically affect fish populations [3], release vast amounts of greenhouse gases [4], and promote wholesale deforestation and fragmentation of pristine forests [5]. From China to Brazil, hydroelectric dams have been built at an unprecedented scale to supply burgeoning energy demands [6]. More than 945,000 dams higher than 15 m have been built worldwide, altering >50% of all major rivers [7]. In South America alone, some 2,215 new hydroelectric dams are expected to be erected within the next few years [8]. Assessing the true impacts of hydropower infrastructure on natural ecosystems has therefore become an urgent priority for the environmental policy agenda of emergent economies.\n\nIn Brazilian Amazonia, over 10 million ha of forests are expected to become permanently inundated following the planned construction of new dams [9], potentially leading to a colossal impact on both terrestrial and aquatic biotas at regional scales. Hydroelectric dams in lowland forests typically resort to low-declivity river basins, submerging vast upstream areas per unit of megawatt output generated, thereby often creating vast archipelagos of forest isolates. Land-bridge islands formed by these artificial lakes may experience stronger isolation effects than forest remnants embedded within a terrestrial landscape, largely because the open-water matrix is invariably less permeable to terrestrial organisms than pastures and second-growth vegetation (e.g. [10–12]). However, despite an embryonic set of studies investigating the long-term impacts of major dams on biodiversity worldwide [13–15], the extinction dynamics of archipelagic landscapes created by hydroelectric reservoirs remains poorly understood in tropical forest regions, specially for Amazonian reservoirs (but see [16–17]).\n\nTerrestrial vertebrates are pivotal components of tropical forest dynamics through their ecological roles as hyper-consumers, large predators, frugivores, seed dispersers, and structural habitat modification [18–19]. They are also widely hailed as pinnacle conservation icons, contributing much public charisma for tropical forest conservation. In Amazonia, hunting pressure is the strongest driver of local extinctions of medium and large mammals stranded in fragmented landscapes [20–21]. With the exception of primates [16], no study has assessed the long-term impacts of a hydroelectric reservoir on medium and large-bodied vertebrates at the community level in Amazonian land-bridge islands. Yet this is required to both elucidate the positive or negative effects of existing dams on biodiversity, and refine environmental impact assessments of future dams.",

          "idx": 143,
          "title": "The Egyptian Initiative for Personal Rights Comments on Amendments to the Environmental Law's Executive Regulations: Further Concessions on Coal Use",
          "maxOccupiedPages": 3.9047619047619047,
          "text": "Last March, the Prime Minister issued Decree No. 618 of 2017, amending the executive regulations of the Environmental Law. Most of the amendments focused on the standards and conditions for coal use outlined in Appendix No. 12 of the previous executive regulations. These amendments, with their exceptions, omissions of controls, and vague wording, indicate a clear trend toward weakening and dismantling the application of environmental and health protection standards against the harmful effects of coal.\n\nThe previous executive regulations were issued by Prime Ministerial Decree No. 964 of 2015, following the decision to include coal in the energy mix, in order to establish rules governing its use in Egypt. It is worth noting that several environmental organizations objected at the time to some of the provisions of those regulations, arguing that the environmental standards and conditions they contained did not provide sufficient protection for the environment and public health.\n\nDr. Environmental researcher Rajia Al-Jarzawi stated, \"The inclusion of coal in the energy mix, which faced widespread opposition due to its harmful effects on health and the environment, was accompanied by assurances from government authorities that coal use would adhere to strict standards comparable to the latest international standards. While this argument is weak in the face of numerous scientific proofs confirming the harmful effects of coal even when international standards are met, and while the environmental standards in the previous regulations did not truly meet the latest international standards, the recent amendments threaten even greater environmental and health risks.\"\n\nThe recent amendments introduced further exceptions to compliance with environmental conditions and standards. The most egregious of these exceptions appeared in Article 4 (amending clause (1) in Section 2, \"Requirements and Standards for Intermediate Storage Stations Outside Ports\"), which allowed coal storage stations to be exempted from the requirement to be located 3 kilometers away from residential areas, citing \"necessity\" as the reason, according to the regulations. It is worth noting that the previous regulations themselves had already included an exception allowing the burning of coal as fuel in residential areas \"for reasons of necessity and the public interest.\" These new amendments, however, have added an exception regarding storage, further exacerbating the anticipated harm. While this is not the first time the administration has attempted to justify this retreat from environmental protection by citing \"necessity and the public interest,\" it fails to define the nature of these \"necessities\" or how they might serve the public interest rather than the private interests of companies, making this justification difficult to accept.\n\nThe amendments also resorted to eliminating many of the details of the conditions and standards explicitly stated in the previous regulations. They delegated the task of defining these details and granting approvals to the Ministry of Environment, its agency, or its coal committee, without establishing specific controls and rules for the conditions or approvals. This could open the door to evading strict environmental standards. While the omission of details might be justifiable in legislation, it is not so in regulations. Laws are not easily changed, while regulations are easily amended and even necessary to keep pace with changes and developments. The executive regulations for the environment themselves have been amended twice in the past two years. The benefit of including details in the regulations lies in their clear and public disclosure of what is permitted and prohibited, ensuring that everyone is aware of it and that those affected can appeal to the courts. Details drafted internally within ministries and government departments, however, may lack this clarity.",

          "idx": 144,
          "title": "Did You Enjoy the Taste of Plastic Today?",
          "maxOccupiedPages": 3.380952380952381,
          "text": "The world first learned to manufacture plastic from petroleum in the early 20th century, and its use expanded significantly in the 1950s, with production reaching two million tons in 1950. Since then, plastic production has increased exponentially, reaching 381 million tons in 2015. Plastic is truly a unique material: versatile, inexpensive, easily molded, and durable. It is used in the manufacture of almost all products, including cars, airplanes, weapons, electrical and electronic devices, medical equipment, building materials, clothing, furniture, packaging, and much more.\n\nHumans have produced and consumed enormous quantities of plastic without giving much thought to what to do with its waste after use. Most plastic products are not suitable for recycling, and even those that can be recycled are of lower quality and cannot be recycled more than once or twice. Furthermore, plastic is not biodegradable; it only breaks down very slowly into microscopic particles (microplastics) through ultraviolet radiation. These particles do not appear to decompose completely but accumulate in marine and terrestrial environments and enter the food chain.\n\nThe excessive use of plastics, particularly in single-use and disposable applications, has exacerbated the situation. Packaging accounts for 47% of plastic use; one million plastic water bottles are purchased every minute, and the world produces 500 billion plastic bags every year. A single water bottle could take five centuries, and a plastic bag about 30 years, to disappear, leaving behind an environmental legacy that may last forever.\n\nThe world has produced 9 billion tons of plastic throughout history. Only 9% has been recycled, and about 15% has been incinerated. Approximately 6 billion tons of plastic waste are with us and are constantly increasing. Every year, 300 million tons of plastic waste are added to the world's plastic reserves—a figure equivalent to the average weight of the entire human population.\n\nWhere does all this waste go?\n\nIt's simply all around us, inside us, and everywhere.\n\nEvery year, about 13 million tons of plastic end up in the oceans—roughly the equivalent of a truckload of waste being unloaded every minute. This debris accumulates due to ocean currents in five major eddies in the ocean, the combined area of which is equal to the size of Europe. The largest of these is located in the South Pacific and covers an area three times the size of Spain. It is estimated that by 2050, the weight of plastic in the oceans will exceed the weight of all the fish in the world.\n\nPlastic waste reaches the oceans either through direct dumping into waterways, or through dispersal by wind, rain, and tides from its sources or from open landfills. Before that, plastic waste, especially lightweight plastics, may be found in streets, farms, and everywhere else. It may be ingested by animals and livestock, or it may clog canals and drains. People may burn it, releasing toxic substances into the air, or it may decompose on-site, releasing these toxins into the soil and groundwater.\n\nBirds, land and sea animals, and fish swallow plastic bags and small pieces, causing them to choke, become ill, have their intestines ruptured, or die of starvation. It has been found that more than 260 marine species have swallowed plastic, including 15% of endangered species. 70% of sea turtles in the Red Sea have died due to ingesting plastic. By 2050, 99% of seabirds will have swallowed plastic.",

          "idx": 145,
          "title": "A Preliminary Assessment of the Protection Network for Taiwan's Forest Wetlands",
          "maxOccupiedPages": 2.6666666666666665,
          "text": "According to the results of the \"Pilot Project for the Survey of Forest-Type Wetland Resources in Taiwan,\" commissioned by the Forestry Bureau and conducted by research teams from Chinese Culture University and Ilan University, Taiwan has 276 forest wetlands, a considerable number. Theoretically, including all these wetlands in protected areas would be a foolproof approach. However, this idea faces substantial difficulties in implementation. Therefore, the biggest challenge in forest wetland conservation currently lies in determining which wetlands should be included in the conservation scope. To differentiate the conservation value of wetlands, conservation grading is an effective approach. Grading wetlands not only helps understand their conservation value but also serves as a basis for determining the conservation network. The concept of a conservation network is particularly important in wetlands because wetland organisms often cannot rely on a single wetland for survival. The Ramsar Convention emphasizes international cooperation, with the ultimate goal of establishing an international wetland conservation network. Taiwan's forest wetland conservation should adopt this approach, which not only aligns with the spirit of the Wetland Conservation Act but also provides a more comprehensive protection for wetland ecosystems. Assessment is a crucial means of determining conservation. Currently, the assessment of the importance of wetland conservation in Taiwan is conducted through the \"National Important Wetland Selection and Survey Mechanism\" proposed by the Construction and Planning Agency. However, this mechanism passively selects wetlands for evaluation (e.g., through group recommendations) and relies primarily on expert discussions. Therefore, it depends heavily on the subjective opinions of those involved in the selection process and lacks objective evaluation indicators. To avoid the dilemma of subjective judgment regarding wetland conservation value, using objective evaluation indicators is a feasible approach. Objective indicators refer to the inherent characteristics of wetlands. A review of previously published research reveals that characteristics such as biodiversity, rarity, naturalness, area, representativeness, threat of human disturbance, scientific value, and ecological vulnerability are frequently used. Data for each of these indicators must be collected through on-site surveys.",

          "title": "The Sustainable Use of Biodiversity and the Satoyama Initiative",
          "maxOccupiedPages": 1.8095238095238095,
          "text": "What exactly does the Satoyama Initiative advocate? Simply put, it promotes the maintenance, restoration, or reconstruction of \"Socio-ecological Production Landscapes\" (SEPLs) worldwide to improve human well-being and achieve the three goals of the Convention on Biological Diversity. A landscape refers to a heterogeneous region composed of various distinct patches arranged in a mosaic pattern. Landscape ecologists call these patches landscape elements; for example, agricultural landscapes include farmland, grasslands, streams, forests, and villages. These elements (patches) are interwoven like patches of varying sizes, colors, and patterns. An agricultural landscape is also a production landscape because it is primarily used for producing crops (such as rice and forests) or harvesting livestock and fish. A healthy productive landscape not only produces goods such as food and timber, but also provides services beyond those goods, such as nutrient cycling, soil conditioning, flood control, water and air purification, and spiritual inspiration. However, many productive landscapes overuse fertilizers, pesticides, and herbicides to increase yields; and they switch from multi-crop to single-crop farming to improve efficiency. These agricultural practices reduce the naturalness of the landscape, making it difficult to sustain its ecological functions or provide complete ecosystem services. Over time, this inevitably leads to environmental problems and may even cause a gradual decline in crop yields or quality. Therefore, the European Union has recently begun subsidizing farmers to encourage them to improve unsustainable production methods in order to maintain ecologically sound productive landscapes.",

          "idx": 147,
          "title": "Quaternary Climate Fluctuations: Estimating Temperature Fluctuations in Greenland through High-Resolution Isotope Measurements of Air Preserved in Ice",
          "maxOccupiedPages": 1.9047619047619047,
          "text": "Ice core measurements can yield a wealth of information, much of which is relevant to questions about climate change, as ice archives the climate history of hundreds of thousands of years. Therefore, such measurements allow us to retrospectively explore the Earth system: Why did ice ages occur, why did they end, and what caused this? Why was the climate so unstable during the ice ages? How large were the temperature variations between ice ages and interglacial periods, or between warm and cold phases during the last ice age? These are questions that can be investigated using ice cores, sometimes in combination with other climate archives (marine sediments, lake sediments, tree rings, and others).\n\nHowever, ice cores offer far more than the extremely useful concentration measurements mentioned above. Physical parameters of the ice, such as electrical conductivity, dust content, and others, allow for the creation of a preliminary timescale through comparison with other measured ice cores, which is then refined through subsequent analyses. These follow-up analyses include the determination of chemical traces in the ice, which provide information about the emission intensity, emission locations, and atmospheric circulation of chemical substances, and can also suggest chemical reactions.\n\nThis article, however, will focus specifically on the analysis of stable isotopes in ice cores. Within an element, there are usually several isotopes (nuclides with different numbers of neutrons), which are either stable or radioactive. Both types are of great importance in research, including ice core analysis. Here, however, only stable isotopes are considered. The aim is to investigate the extent of temperature fluctuations during the last ice age in Greenland.",
          "occupiedPages": 1.4285714285714286,
          "originalEnglish": false

          "idx": 148,
          "title": "People, Environment, Climate: Perspectives on Quaternary Research in Switzerland — Introduction to the Special Issue",
          "maxOccupiedPages": 2.4285714285714284,
          "text": "The Quaternary (Ice Age), the most recent period in Earth's history, spans the last 2.6 million years and continues to the present day. This epoch is characterized by significant climate fluctuations, which are documented in geological deposits on the continents and in the oceans, as well as in polar ice cores. The image of a nearly completely glaciated Switzerland over 20,000 years ago contrasts sharply with the current climate scenario of a potentially soon completely ice-free Alpine region.\n\nHumans first appeared in Europe during the Quaternary. Since around 5,500 years ago, the beginning of settled life, modern humans (Homo sapiens) have become a significant factor in the environmental system. They are primarily responsible for the transformation of the former natural landscape into the cultural landscape of today. During the warm and cold phases of the Ice Age, specific plant and animal communities developed, and their remains provide important insights into the natural environment and the lifestyles and economic practices of people in earlier times. The aspect of climate and climate change on a wide range of spatial and temporal scales is always and inextricably linked to Quaternary research. Given the current accelerated development in the \"greenhouse Earth,\" deciphering climate history has become one of the most important sectors of Quaternary \"research into the past.\"\n\nSince the time of Louis Agassiz, one of the main founders of the Ice Age theory at the beginning of the 19th century, Switzerland, repeatedly shaped by Ice Age glaciers, can undoubtedly be called the \"cradle of Quaternary research.\" It continues to offer an extraordinary wealth of formations and archaeological sites for deciphering environmental and human history, addressing a wide variety of questions in the geosciences and human sciences. A whole range of scientific disciplines are currently concerned with the Quaternary period and the development of early humans. Communication, exchange, and networking between the often independent and isolated researchers—individuals or groups from universities, institutes, government agencies, or even practically oriented companies (e.g., geological surveying firms)—have become central and indispensable concerns of modern Quaternary research.",
          "occupiedPages": 1.9047619047619047,
          "originalEnglish": false
        },

ction that often pollute land and water, to the destruction of renewable resources, the difficulty in switching to renewable energy, and so on, we have plundered a planet that is responding with new climate cycles that will increasingly disrupt \"our beautiful garden.\"",

          "maxOccupiedPages": 3.7142857142857144,
          "text": "The Ministry of Education, Culture, Sports, Science and Technology (MEXT) is working on developing sensors and unmanned submersible technologies to investigate untapped marine mineral resources, including seafloor hydrothermal deposits, utilizing technologies from universities and the Japan Agency for Marine-Earth Science and Technology (JAMSTEC), as well as conducting research aimed at elucidating the origins of marine resources. In September 2011, the Marine Development Subcommittee of the Council for Science and Technology compiled the \"Marine Resource Exploration Technology Demonstration Plan,\" a medium- to long-term technology demonstration plan of approximately five years, outlining the specific content and schedule of research and development. Furthermore, in light of the growing public interest in and need for the sustainable use of marine biological resources and the conservation of marine biodiversity, MEXT began research and development in FY2011 as part of the \"Marine Resource Utilization Promotion Technology Development Program: Advanced Technology for Securing Marine Biological Resources,\" which aims to elucidate the physiological functions of marine organisms and lead to innovative production, as well as research and development to comprehensively elucidate ecosystems with the aim of accurately predicting fluctuations in the amount of biological resources. At the same time, the Marine Development Subcommittee of the Council for Science and Technology considered \"the ideal way of conducting research on marine biological resources,\" and compiled a report in September 2011. The Japan Agency for Marine-Earth Science and Technology (JAMSTEC) conducts observations of the ocean, land surface, and atmosphere in the Asia-Pacific region and the Arctic region, using research vessels, marine environment observation buoys, and land-based observation equipment, with the aim of elucidating global environmental changes such as global warming.           "maxOccupiedPages": 2.4285714285714284,
          "text": "The issue of invasive species is one of the important challenges for the conservation of biodiversity in Japan (Somiya 2016). In 2015, the Ministry of the Environment presented the \"Action Plan for Preventing Damage from Invasive Species,\" outlining its approach to \"mainstreaming\" invasive species countermeasures into social activities (Somiya 2016). At the same time, the \"List of Invasive Species That May Cause Damage to Ecosystems in Japan\" was also published, indicating a direction to further promote invasive species countermeasures, building upon the Invasive Alien Species Act enacted in 2005 (Somiya 2016). The number of confirmed and certified control measures based on the Invasive Alien Species Act has exceeded 1,000 nationwide (Ministry of the Environment https://www.env.go.jp/nature/intro/3control/kakunin.html Last accessed February 8, 2020), and it can be said that invasive species countermeasures are steadily being incorporated into social activities. While activities related to countermeasures against invasive species are expanding, it has also become widely recognized that eradicating invasive species once they have invaded and established themselves is extremely difficult (Akasaka and Goka 2012; Osawa and Ohmae 2016). In fact, reports of successful eradication of invasive species or minimization of population size in Japan are still few, although there are a few examples such as the Argentine ant Linepithema humile in Tokyo (Sakamoto et al. 2017), the mongoose Herpestes auropunctatus in Amami (Wataru 2019), and the Canada goose Branta canadensis around Mt. Fuji (Kato 2016). In addition, eradication activities for invasive species are almost always long-term, and those working on the front lines towards eradication often become exhausted by the continued effort with no end in sight (Osawa and Ohmae 2016). For this reason, the idea of setting realistic goals such as containment rather than eradication as the goal of management is           "title": "Biodiversity in Forest Ecosystems: Why and How to Assess It",
          "maxOccupiedPages": 2.6666666666666665,
          "text": "Biodiversity is currently a popular concept not only in specialized scientific literature but also in the international and public environmental movement. It should be noted that in the latter context—that is, in speeches by politicians, city administration representatives, the environmentally minded public, and the like—the term is particularly frequently and, unfortunately, in an amateurish manner (which, incidentally, also applies to the interpretation of the word \"ecology\"...). Because of this, the modern interpretation of biodiversity is ambiguous, leading to much debate and disagreement even among environmental specialists. Therefore, it is first necessary to understand the meaning of biodiversity. As a term in specialized literature, biodiversity has been used since 1894 to describe the number, variety, and variability of living organisms. As experience in bioecological research has accumulated, the concept of biodiversity has evolved and expanded its meaning. The first scientifically formulated concept of biodiversity as a phenomenon emerged from the research of population geneticists between 1908 and 1953. In the population genetic understanding, biological diversity is created by three independently acting processes: spontaneously arising genetic variations, the action of natural selection in mixed populations, and isolation—geographical and reproductive [4]. On this basis, as a result of natural selection over billions of years, two processes—speciation and extinction—have created the planet's most valuable resource—biodiversity. This gives rise to two levels of biodiversity: genetic—the diversity of genetic properties among individuals of a single species, and species—the diversity of species within a community of organisms. This led to the interpretation of biodiversity as a valuable natural resource, serving as a source of biological evolution and the basis for genetic engineering. Since the mid-1950s, two processes—a growing awareness of the dangers of increasing negative consequences of anthropogenic impacts on the biosphere and the development of the natural sciences—have led ecology to emerge from the realm of biology as an independent, interdisciplinary, and complex field, exploring the interactions of organisms with their environment and providing the scientific basis for rational nature management. At the same time, the concept of \"biodiversity\" has also been given a greening treatment. It has become clear that humans can be just as much a factor in the extinction of biological species as natural phenomena—climate change, volcanic eruptions, etc.—with one crucial difference: anthropogenic impact can contribute to the premature extinction of species, which cannot be compensated for by speciation: the development of a new species requires between 2,000 and 100,000 generations [5].",
          "occupiedPages": 2.2857142857142856,
          "originalEnglish": false
        },

          "text": "The spontaneous development of primary forests also occurred through the periodic formation of windfall clearings or \"windows\" of varying sizes (from a few square meters to several thousand hectares). This process is typical in landscapes with spruce stands. Regardless of the terrain, soil cover, and other conditions, individual spruce trees, groups of spruce trees, or entire sections of spruce stands fall. The reasons for this pattern are quite obvious and simple. Spruce, with its dense, low-hanging crown and shallow root system, is highly susceptible to wind damage. It can be argued that dark coniferous taiga is a windfall in various stages of recovery. In landscapes with pine stands, such phenomena typically do not occur. Pine, with its open, high crown and powerful taproot system, can easily withstand even strong winds. Its resilience is evidenced by the frequently observed \"wind-blown\" pines or even groups of them. In other words, wind can break a pine trunk, but it cannot topple it. Thus, forests in different landscape types have varying degrees of wind resistance and, accordingly, develop different \"wind-driven\" successional systems.",

          "text": "This article also emphasizes the responsibility of everyone to cooperate with government departments and other people in protecting and preserving the environment and ensuring ecological development and resource utilization.\n\nThese recommendations will only be meaningful and useful to the average citizen if their translation is provided in an African language that can give him a complete picture of what is being discussed. This is because environmental issues are often explained in foreign languages, especially English, through the use of complex scientific terms that are difficult to decipher for people who do not have a high level of knowledge of these issues.\n\nThe Swahili language can be a strong tool for educating the public about the importance of preserving the environment, the benefits we get from it and the losses resulting from environmental degradation. If this is fully implemented, the situation of ignorance such as that which arose regarding the invasion of various forests in this country may not occur again. The efforts of environmentalists such as the late Wangari Maathai can be more successful if methods such as those we have discussed regarding cultural preservation are used to spread the message regarding environmental conservation.\n\nAdvertisements on various environmental issues can also be made in Kiswahili through writings and drawings on clothing such as handkerchiefs, scarves, shirts, sheets and even blankets. Book publishers can also be encouraged to put such messages on the covers of books used at various levels to emphasize this issue. In addition, translations of various environmental works written in foreign languages can be done in Kiswahili and contribute significantly to environmental conservation efforts. This will ensure that Kenyans have a better chance of being educated about the environment and thus avoid the damage caused by ignorance.\n\nThis language will also sensitize citizens on their rights regarding the use of environmental resources as enshrined in Article 70 of Chapter Five.",

          "title": "Attention and Augmented Recurrent Neural Networks",
          "maxOccupiedPages": 1.2380952380952381,
          "text": "When I’m translating a sentence, I pay special attention to the word I’m presently translating. When I’m transcribing an audio recording, I listen carefully to the segment I’m actively writing down. And if you ask me to describe the room I’m sitting in, I’ll glance around at the objects I’m describing as I do so.\n\nNeural networks can achieve this same behavior using attention, focusing on part of a subset of the information they’re given. For example, an RNN can attend over the output of another RNN. At every time step, it focuses on different positions in the other RNN.\n\nWe’d like attention to be differentiable, so that we can learn where to focus. To do this, we use the same trick Neural Turing Machines use: we focus everywhere, just to different extents.\n\nThe attention distribution is usually generated with content-based attention. The attending RNN generates a query describing what it wants to focus on. Each item is dot-producted with the query to produce a score, describing how well it matches the query. The scores are fed into a softmax to create the attention distribution.",

          "title": "How to Use t-SNE Effectively",
          "maxOccupiedPages": 1.1428571428571428,
          "text": "A popular method for exploring high-dimensional data is something called t-SNE, introduced by van der Maaten and Hinton in 2008 . The technique has become widespread in the field of machine learning, since it has an almost magical ability to create compelling two-dimensonal “maps” from data with hundreds or even thousands of dimensions. Although impressive, these images can be tempting to misread. The purpose of this note is to prevent some common misreadings.\n\nWe’ll walk through a series of simple examples to illustrate what t-SNE diagrams can and cannot show. The t-SNE technique really is useful—but only if you know how to interpret it.\n\nBefore diving in: if you haven’t encountered t-SNE before, here’s what you need to know about the math behind it. The goal is to take a set of points in a high-dimensional space and find a faithful representation of those points in a lower-dimensional space, typically the 2D plane. The algorithm is non-linear and adapts to the underlying data, performing different transformations on different regions. Those differences can be a major source of confusion.",

          "idx": 163,
          "title": "Should We Trust Telecommunications and Internet Companies?",
          "maxOccupiedPages": 2.2857142857142856,
          "text": "The relationship between a citizen and a service provider—whether a telecommunications company, government agency, grocery store, or hospital—often begins with a set of personal questions posed by the provider before addressing the service itself. These questions typically include the individual's name, address, phone number, and possibly a copy of their national ID card with all its data. Before proceeding with the service, the provider may ask you to sign a document to initiate the process. In the technology and internet sectors, this document often takes the form of a form with a \"yes\" box at the end.\n\nWe use search engines daily to explore topics of interest, whether sports, arts, religion, politics, or health, all contributing to our general knowledge and our ability to think critically and make decisions. We also communicate daily through various communication tools and methods for social and professional purposes. We regularly watch entertaining and educational videos. Furthermore, most of us jot down notes and ideas in drafts, emails, computer files, or notebooks.\n\nA few years ago, I was deeply shocked to discover that a record of all my search queries on Google over the years was accessible. Part of the shock came from seeing the evolution of my interests, my reading, and my thoughts over time. A greater shock, however, was the very existence of this record, which revealed so much about me. I decided to investigate other records I was unaware of, which were held by other companies. I discovered a record of all the videos I had watched on YouTube over the years and another containing every search term I had typed on Facebook. I felt a surge of anger and a profound sense of the collapse of the privacy I had assumed existed—a truly disturbing reality.\n\nI realized that internet and telecommunications companies possess an almost unbridled ability to deduce our behaviors, preferences, and social networks, sometimes even better than our closest confidants or ourselves. Meanwhile, companies within our own countries either shirk their responsibility to hand over our personal data to those in power, citing \"binding orders,\" or actively facilitate public surveillance based on \"mutual interests\" with those in power.",

          "idx": 164,
          "title": "Opposition to Technology",
          "maxOccupiedPages": 4.571428571428571,
          "text": "The issue of internet regulation worldwide raises primarily procedural questions. As a global and self-regulating medium, the internet poses several regulatory questions, chief among them the question of geographical jurisdiction: where are cybercrimes committed? The nature of the internet often allows for the perpetrator to be in one country and the victim in another, or for both to be in the same location while the crime is committed on an information system in a different country. This is often what is known as publishing offenses, as in Egypt, for example, where most websites operate through information systems located in other countries. Another question, which has become increasingly important after the discovery of the extent of surveillance carried out by governments and other entities against internet users, is the question of judicial warrants for surveillance. Mass internet surveillance requires authorities to intercept and examine all communications to find the message they seek. This renders a specific, limited judicial search warrant entirely incompatible with this type of internet surveillance. Such practices violate the Egyptian Constitution and Egyptian legislation, including the International Covenant on Civil and Political Rights, which is part of national law and applicable according to Article 93 of the Constitution, and the Criminal Procedure Code No. 150 of 1950.\n\nThe draft \"Combating Cybercrime\" law is not intended to address this type of question, which has arisen as a result of the internet's widespread adoption as the primary communication medium, the largest source of information, and the most important arena for organization and assembly, particularly in countries lacking freedom of expression, association, and peaceful assembly. The legislature has not attempted to address the problems of jurisdiction and territorial authority. Judges issue convictions in most cases involving information technology, particularly in publishing cases, exceeding their territorial jurisdiction. Individuals are punished for actions that occurred on computer systems outside the court's territorial jurisdiction, perhaps due to a lack of knowledge of information technology. To date, the authors of this report have not encountered any Egyptian court rulings that address the jurisdiction and territorial authority of these courts, nor any requests for legal opinions from the Supreme Court on these matters.\n\nInstead of attempting to address these procedural dilemmas, most of the law's provisions are penal, punishing crimes described in the explanatory memorandum to the government's 2015 draft law as \"a new type of crime previously unknown.\" This is the primary focus of this policy analysis.\n\nThe draft cybercrime law creates a new situation in Egyptian criminal law, establishing new penalties based on the method of committing the crimes, rather than the crimes themselves. For example, impersonation or incitement to commit violent crimes will be punished differently if committed online than if the same crimes, causing the same level of harm to the same people, were committed by other means. This is akin to attempting to legislate a different punishment for murder committed with a firearm than for murder committed with a sword, claiming that technological advancements, such as the invention of gunpowder, led to the creation of new crimes. However, the crime remains the same: the violation of the right to life through murder, regardless of the method used.\n\nThe proposed law and its supporting propaganda attempt to argue that \"electronic forgery\" differs from forgery, and that \"cyber hacking\"—that is, unauthorized access to information systems—differs from property infringement, whether through unauthorized entry, damage, or theft, and so on for other types of crimes. This undermines the principle of justice and equality before the law and increases the likelihood of the law being deemed unconstitutional.\n\nIssuing penal provisions specific to the digital domain with harsher penalties results in the law moving from punishing attacks on the rights and freedoms of others and causing harm to themselves or their property to punishing the use of specific tools in committing criminal acts. This negates the principle of equality before the law and transforms the law from punishing acts to punishing people for using information technologies.",

          "maxOccupiedPages": 2.4761904761904763,
          "text": "Even today, we cannot be certain that semiconductor materials are free of impurities, let alone 30 years ago. Therefore, when scientists discover such precise integers, they have most likely struck gold.\n\nThe story unfolding within the material can be imagined as follows: First, when the initial velocity of a charge is perpendicular to the magnetic field and there is no electric field, its motion is a circular motion. We can further imagine a flat plate of material with a magnetic field applied perpendicularly; the charges within it begin to rotate. At the quantum mechanical level, the entire material seems like an apartment building, with each circle representing a room inhabited by a charge. Nowadays, no apartment building has only one floor, and the same applies to materials in a magnetic field. L. D. Landau points out that these apartments also have many floors, called Landau levels. Charges on the same floor have the same energy; the higher the floor, the higher the energy (rent). The integers in the Hall measurement correspond to the number of Landau levels that are fully occupied.\n\nAt the level of abstract mathematics, the number of occupied Landau levels corresponds to the so-called \"Chern Number.\" The numbers I mentioned at the beginning of the article are Chern numbers for a certain model. (This is why I felt relieved and went to sleep after seeing -1.000000000.) Although the origin of Chern numbers is not a simple mathematical concept, there is a simple image to understand why it is an integer: Imagine a fountain with a radius of 1 meter in the center of a courtyard. A passerby, let's call him Person A, starts from a certain point in the fountain, walks around the fountain an unknown number of times, and returns to the same point. He wants to know:\n\nHow many times did he walk around the fountain in total? This question obviously has many ways to answer (for example, by replaying the process on a monitor). One rather roundabout way is to have someone calculate the path Person A walked and then divide it by 2π. To the person being asked to calculate this, it's a complex integral calculation, but we, the observers, know it has a clear meaning: the answer is the number of laps, an integer! Chern numbers can be understood as a \"number of laps\" calculated in a relatively abstract space. This analogy also helps us understand that Chen Shu is a number related to \"topology,\" which is absolutely related to whether there is a fountain in your yard, but has little to do with the details of your movements.",

          "maxOccupiedPages": 2.8095238095238093,
          "text": "We now know this is because silver sulfide is a semiconductor, and a characteristic of semiconductors is that their resistance decreases as temperature increases.\n\nBefore World War II, research into semiconductors had begun, but a breakthrough in semiconductor technology didn't occur until 1948 when three scientists at Bell Labs—William Shockley (1910-1989), John Bardeen (1908-1991), and Walter Houser Brattain (1902-1987)—invented the bipolar transistor. The semiconductor industry then began to flourish, and the three scientists were awarded the 1956 Nobel Prize in Physics. Today, semiconductors are found in home appliances, consumer electronics, automobiles, and electrical appliances.\n\nIn solid-state physics, a hole refers to the phenomenon where an electron loses an electron from a covalent bond, leaving a vacancy. Figure (a) above shows a silicon crystal structure doped with boron. We know that silicon is tetravalent, while boron is trivalent. Originally, all atoms are electrically neutral. Due to the small band gap in semiconductors, the energy required for electrons to be excited from the valence band to the conduction band is not high. When an electron is excited to the conduction band, it leaves a hole in the valence band. We can consider the movement of this hole as the movement of a positively charged particle. We call this type of semiconductor a p-type semiconductor, and the carrier (i.e., a freely moving charged particle) is called a hole.\n\nConversely, we can also dope silicon with pentavalent atoms, such as phosphorus. Since phosphorus has one more electron than electrically neutral silicon, the carrier is a negatively charged electron.\n\nThe simplest semiconductor application is the diode, which consists of an n-type semiconductor and a p-type semiconductor joined together. Because the n-type semiconductor has more electrons, some electrons at the junction migrate to fill holes in the p-type semiconductor, becoming positively charged at the n-type junction and negatively charged at the p-type junction (this can also be explained by diffusion: the n-type semiconductor has more electrons, and the p-type semiconductor has more holes, thus diffusing in opposite directions), as shown in the diagram below.\n\nDue to this factor, according to Gauss's law (i.e., the net electric flux through any closed surface is equal to the net charge within that closed surface divided by the permittivity), an electric field is generated at this junction. This causes only immobile charged ions to remain near the pn junction, losing their electrical neutrality and becoming charged, forming a depletion layer. The depletion region has a built-in potential of approximately 0.7 V.",

          "text": "Tübingen (Germany), November 28, 2007 – On Tuesday, November 26, 2007, the University of Tübingen was awarded this year's IBM Shared University Research Grant in a ceremony, having been selected from among 50 research institutions worldwide.\n\nJulian Würtenberger, Ministerial Director at the Ministry of Science, Research and the Arts, expressed his delight and pride on behalf of the state of Baden-Württemberg, noting that it demonstrated the excellence of research in Tübingen, as these so-called SUR grants had been awarded in the state before, but never at the level now granted to Tübingen. However, he stated that he was unable to provide a comparable state subsidy, which is not uncommon when acquiring third-party funding.\n\nMartin Jetter, Chairman of the Management Board of IBM Germany GmbH, specifically recognized the Chair of Computer Engineering, headed by Professor Wolfgang Rosenstiel (pictured left), for its research on automated workload management. The Wilhelm Schickard Institute at the University of Tübingen received a new z9 series mainframe computer, costing nearly two million euros. The \"z\" stands for \"zero downtime,\" ensuring continuous availability.\n\nHerbert Kircher, Managing Director of IBM Germany Development GmbH and Head of the IBM Research Laboratory in Böblingen, then addressed the future of computing, explaining that the once-presumed-dead mainframes are experiencing a renaissance. This is due, in part, to savings of 80 to 90 percent in both space and energy consumption compared to the clusters of smaller computers that were considered the only viable option just ten years ago. He stated that 3,900 conventional servers could now be replaced by just 30 z-series computers. Given the high energy and maintenance costs, acquisition costs are now a secondary consideration when demand is high. Rosenstiel, who plans to establish a mainframe competence center with this new computer, was very impressed. “The mainframe computer donated by IBM not only creates ideal conditions for conducting hardware-related research in conjunction with System z systems, but also enables us to provide students with practical, application-oriented training on leading IBM mainframe technology,” said Professor Rosenstiel.\n\nKircher brought along another example of the development of computer technology: Just thirty years ago, the Cray-1, a so-called supercomputer, was the fastest and most powerful computer in the world – costing around $8.8 million at the time and requiring a large amount of space. Today's PlayStation 3 from Sony, with the Cell chip developed by IBM, has more than 10,000 times the performance for only about €500. How these small devices and processors can support the large computers in demanding tasks, such as controlling virtual worlds like Second Life, where, according to Kircher, everyone interested in computers should be represented, is currently being investigated – the future belongs to the combination of both, the “gameframe.”",

          "maxOccupiedPages": 1.4285714285714286,
          "text": "Linux is the most successful and popular open-source software. It is GPL-based and derived from Unix. Unix was developed in the 1960s by AT&T's Bell Labs. At that time, AT&T was a regulated monopoly, so it could not sell computer software. It gave it, along with the source code, unconditionally to governments and universities, allowing them to modify it if they wished. By the 1980s, Unix had become the most popular, powerful, and stable operating system, although by then many variations had already been produced.\n\nOne drawback of Unix was that it was difficult to understand and operate. Andy Tanenbaum, a professor of computer science at Amsterdam, wrote a program called Minix to support it. This also had some drawbacks. Linus Torvalds was a computer science student at the University of Helsinki, Finland. To overcome the shortcomings of Minix, he wrote a program that later became known as \"Linus's Unix,\" or Linux for short. He posted its first kernel on the Internet in 1991. By then, Richard Stallman's GNU project had already begun. Linus Torvalds incorporated many of its programs into his Linux. Therefore, Richard Stallman suggested calling it GNU-Linux. However, this name, perhaps due to its length, failed to catch on. However, this does not mean that the GNU project did not play a role in Linux's success. Linux would not have been possible without the GNU project.",

          "text": "Today, Loiano celebrates the thirtieth anniversary of the \"G.D. Cassini\" telescope, installed in 1975 at the university's astronomical observatory in the Apennine town. This telescope has a 152-cm diameter mirror.\n\nThe celebrations are part of the Cassinian Year celebrations, dedicated to the 17th-century astronomer Giovanni Domenico Cassini, after whom the Loiano telescope is named. In 2005, three events were linked to Cassini: the 350th anniversary of the San Petronio sundial he built, the 30th anniversary of the telescope named after him, and the Cassini-Huygens space mission.\n\nItalian astronaut Umberto Guidoni, now a Member of the European Parliament, was invited as guest of honor. It was a welcome return, since, as he himself recounted, Guidoni spent a period of observations at the Loiano facility in 1978 while preparing his thesis. From there, his scientific and professional career began, leading him, in 1996, to participate in the Shuttle space mission. The title of the event, \"From Loiano to Space Observations,\" was therefore apt.\n\nTogether with Flavio Fusi Pecci, director of the Bologna Astronomical Observatory, Guidoni gave a two-hour lecture to a young audience of several hundred middle and high school students, gathered in the Loiano sports hall. He showed and commented on the video of the mission, then answered numerous questions from the students, who were also interested in learning about the less scientific aspects of the mission, such as how astronauts wash themselves or what happens if the station toilet clogs.\n\nMayor Giovanni Maestrami presented Guidoni with a plaque commemorating today's event and Loiano's \"observations under the stars\" nearly thirty years ago. The celebrations continued with refreshments to toast the telescope's \"first light.\" This afternoon and this evening, the facility will be open to the public for tours and astronomical observations.",

          "title": "A Multidimensional Analysis of Italian Research in Digital Humanities and Computational Linguistics",
          "maxOccupiedPages": 3.4285714285714284,
          "text": "Digital Humanities and Computational Linguistics have common sources. We prefer to speak of sources rather than roots, because the multiple relationships these disciplines have woven over time are more reminiscent of a karst river than a tree. Indeed, there appears to have been no initial division into areas of expertise and subsequent branching into specific fields. Rather, like a karst river, the lines of inquiry have diverged several times and reconverged several times, perhaps after following underground paths based on humble laboratory work toward pilot projects or simple private communication around sketchy ideas, before regaining visibility in large-scale funded projects or in authoritative journals and conferences. If we accept Gibbon's framework, Computer Science and Humanities form the basis of Computational Linguistics, which over the years has been subdivided into Mathematical Computational Linguistics, Natural Language Processing (NLP), and Computational Corpus Linguistics (CL), and, once again hybridizing with traditional Humanities, into Humanities Computing (HC). According to this framework, Digital Humanities (DH) would arise from the confluence of some NLP and CL fields with HC. But, beyond the birth certificates of monographs, journals, and international conferences that have established one or the other title, there is no doubt that topics in computational linguistics and topics in digital humanities have been addressed by the same authors, through the same publications, and at the same conferences since their inception. It is in this context that the idea arose to compare the performance of the annual conferences of the Association of Humanities and Digital Cultures (AIUCD) and the Italian Association of Computational Linguistics (AILC, which organizes the Italian Conference on Computational Linguistics, CLiC-it), over the four years (2014-2017) of their coexistence, for which contributions are available. Both are young associations, born at a time when Italian scholars with hybrid expertise in the humanities and sciences felt the need to assert their identity and disciplinary autonomy and to actively participate in their respective scientific communities, not only through their regular academic teaching and publishing activities, but also through organizing community events and participating in groups that find expression on social media. We believe this comparative study, which begins monitoring the conferences, can be useful for highlighting resources and practices shared by the two associations, thus strengthening synergy and resource sharing between the two communities or identifying discrepancies that could be addressed. After an overview of the state of the art in analyzing scientific communities from various perspectives, the methods and tools adopted to compare the information from the two four-yearly conference series are illustrated. The analyses conducted are then described in detail: these analyses focus on the communities (authors, genre, affiliation, joint participation in both conferences), the textual content of the articles (diachronic terminology extraction), and the citation entries (measurement of document categories, census of associations involved in the publication). The conclusions then formulate interpretative hypotheses that leave room for future research.",

          "text": "The majority of the diverse data generated in medical settings (hereinafter referred to as medical data) is in natural language, and this situation is unlikely to change anytime soon. While the utilization of medical data can be applied to clinical practice or to academic research and policy, the latter—secondary use—is currently receiving much attention (Japan Science and Technology Agency Research and Development Strategy Center, 2017). Examples of medical data expected to be used for secondary purposes include health checkup data and medical fee data. Health checkup data is created during health examinations and consists of test names and test values. Because health checkup data involves a large number of participants and is collected centrally by organizations, it is often used as large-scale medical data. On the other hand, medical fee data is used to calculate medical expenses and is a coded representation of medical procedures. Because this data is collected and managed by the Ministry of Health, Labour and Welfare, it is also often used as large-scale medical data. Both types of data are structured data composed of numbers and codes, making them easy to handle by computers, but the lack of detailed information has limited their analysis. Therefore, attention is being drawn to the use of text-based medical data such as medical records, discharge summaries, and case reports, which contain more detailed information. Medical records are text documents written in hospitals when patients visit or during rounds upon admission, and they contain detailed patient information. Discharge summaries are information written at the time of discharge and are a summary of the medical records during hospitalization. Case reports are also summaries of admission, similar to discharge summaries, but are reported to academic societies. In addition, there is other text-based medical data within hospitals, and in this article, all of this text-based medical data will be referred to as electronic medical records.",

          "maxOccupiedPages": 2.2857142857142856,
          "text": "We think that standards and standardization have always existed. However, this is not the case. The history of this phenomenon is quite recent. In fact, organized standardization is just over 100 years old. In fact, the oldest institution of this kind in the world is the British Standards Institution (BSI), founded in 1901. However, the first national standard appeared at BSI only in 1903, or more accurately, was officially published [1]. The birth of a global standardization system is quite recent history – in 1946, the International Organization for Standardization, or ISO, was created. International technology committees such as IEEE are even younger. However, despite their relative youth, today standards and the standardization process itself have become one of the main factors contributing to global development and the globalization of markets and industries, largely determining the success of various endeavors in business and even politics. Much can be said about standards themselves, but we will try to limit ourselves to brief conceptual questions. What is standardized is what will be applied on a mass and collective basis, so that all participants in the process have the same concepts and values for characteristics on a given subject. How did this typically happen in the past? Initially, company or association standards emerged; then, with overwhelming commercial success, they became national standards, and then, with the participation of representatives from various countries participating in international standardization organizations, they became international standards. Of course, there are other ways to disseminate standards—for example, localizing one country's standards for another or including one country in another country's roadmap for developing these documents. And in the 21st century, when the need to adopt new technical regulations or standards often determines the success of certain economic decisions, such alternative methods of standard adoption are increasingly being used. Typically, in both cases, the success of a given standard's application or its \"popularity\" determines everything. Adopted international standards are then localized in each country, referencing international numbering. This, in principle, facilitates the transfer of proven solutions and creates the conditions for an international division of labor.",

          "text": "Lack of teaching aids and materials for learning and teaching ICT is another obstacle. Lack of laboratories and equipment such as computers is a chronic problem that plagues many primary schools in Africa, especially in rural areas. This situation hinders the practical teaching of the subject. Teachers end up giving long, boring explanations and using incomprehensible drawings on the board. However, in order to teach ICT effectively, there is a need to fully involve students in various practical training using computers installed with appropriate software in the Kiswahili language. This will only be possible when deliberate steps are taken to build computer laboratories in all schools in the country.\n\nLack of textbooks and supplementary books written in Kiswahili is another obstacle to the use of Kiswahili for teaching. Although the books available in schools are few or non-existent, these books do not meet the needs of the subject of ICT. In general, many science and technology books are written in foreign languages that are not familiar to many people, especially those specializing in information and communication technology. In addition, there are few articles, blogs and websites written in Swahili. In this situation, many students and people who want to learn computers in Swahili are denied this opportunity.\n\nDespite the importance of the subject of ICT in today’s world, many teachers in rural areas find it difficult to teach ICT subjects such as computers due to the fact that teachers themselves have either never used computers or have very limited knowledge. In the summary of the subject of ICT for grade seven, topics such as ‘computer local area network’, ‘internet network’, ‘using websites’ and ‘meaning of e-mail’ are listed (Ministry of Education and Vocational Training, 2005). Many teachers in rural areas do not understand e-mail, they only hear about it in the media. Expecting such teachers to teach ICT to students is unrealistic.",

          "title": "Progress in Play: Board Games and the Meaning of History",
          "maxOccupiedPages": 1.5714285714285714,
          "text": "Ten thousand years ago, in the Neolithic period, before human beings began making pottery, we were playing games on flat stone boards drilled with two or more rows of holes. By the Early Dynastic Period in Ancient Egypt, three millennia later, board games were already represented in hieroglyphs. And on the wall of Nefertari’s tomb, built in the twelfth or thirteenth century BCE, someone painted the queen playing Senet, one of three Ancient Egyptian board games whose pieces have come down to us, along with Mehen and Hounds and Jackals.\n\nThe ancient Greeks, for their part, had Tabula, an ancestor of backgammon; the Romans added Latrones, an ancestor of chess. All across the ancient Near East, people played the Game of Twenty Squares, while in ancient China they played Liubo and in ancient India Moksha Patam, which was rechristened Snakes and Ladders when colonials imported it to Britain in the Victorian era. Wherever there has been civilization, strange to say, there have been games played on boards.\n\nUntil about the seventeenth century, these games tended to be traditional folk inventions that could not be traced back to a maker. Their boards were also relatively abstract, consisting of squares, triangles, spirals, or holes. With the advent of the Enlightenment and the rise of capitalism, however, the board games of Europe — like so much else on the continent — began to change. By the end of the eighteenth century, games were being produced for the marketplace promoting everything from ferry rides to colonial conquest. To appeal to consumers (a category of persons that had not previously existed), these games were made to be played on boards printed with pictures that represented specific places, people, and things.",

          "idx": 182,
          "title": "Music Manuscripts from the 17th and 18th Centuries in the British Library",
          "maxOccupiedPages": 1.8571428571428572,
          "text": "Ever since the earliest methods of notating music were devised, composers and scribes have written out music by hand — on vellum in the medieval period and subsequently on paper. (Only now is this beginning to change, with the advent of computer programs for music notation.) Even after the perfecting of music printing techniques in the 16th century, when music was printed using moveable type and later by engraving, and the burgeoning of a trade in music publishing, much music continued to be written out by hand and circulated in manuscript. Printing music was expensive, time-consuming and complex; copying out music by hand could be done relatively cheaply and quickly, especially when a few copies only of a particular composition were needed.\n\nIn the 17th and 18th centuries, music was written out in manuscript for several purposes. These included the creation of ‘master copies’ from which further handwritten copies could be made when required, the provision of musicians’ parts for use in performance and the commercial and non-commercial dissemination of musical works. Many publishers of printed music also sold manuscript music. With musical genres for which the market in scores was likely to be small (opera, for example), producing manuscripts in small quantities was more cost-effective than setting up a print run.\n\nThe British Library holds one of the finest collections of printed and manuscript music in the world. It encompasses music dating from the middle ages to the present and includes a large number of autograph music manuscripts (scores written out by the composers themselves). Among the autographs are scores of the great composers of the 17th to the 19th centuries, from Purcell, Bach and Handel to Beethoven and Schubert, and large collections of scores and other documents of 20th-century British composers, including Elgar, Delius, Britten, Tippett and Maxwell Davies.",

          "title": "Transformations of Dramatic Structure in Iraqi Feature Films",
          "maxOccupiedPages": 4.0,
          "text": "One of the characteristics of drama is that the dramatic action takes its reasonable course to be fully understood by the audience. The teacher is quite hesitant to accept her visitors and was embarrassed by the presence of the American refugees in her home. Here, the rejection loses its meaning. Furthermore, the ambiguous relationship between the young man, Yasser, and the teacher unfolds with clear inconsistency. At times, he is religious and rejects being with a strange woman, and at others, he is a musician playing Chopin and impressing the teacher in a scene devoid of any emotional depth.\n\nThe dramatic action seems to be floundering between preconceived notions in the filmmaker's mind and the visuals presented on screen. In this way, the dramatic action becomes a hypothetical intention unsupported by the flow of images, which undermines our empathy with what is happening on screen, as if we are witnessing a barrage of images not crafted with full awareness and understanding. Perhaps the inclusion of the American patrol with its armored vehicles and aircraft in a search for a person of no consequence in confronting the Americans, to the point that the character himself believed he was a resistance fighter, and his ludicrous surrender to the American patrol, failed to capture the viewer's attention, even though capturing attention is one of the essential characteristics of drama.\n\nThe film lost its way in presenting the main female character. Faten is the only one who engages in resistance against the occupation, but in a comical way. Perhaps her numbering of the lampposts on Rashid Street as a symbol of documenting what will be stolen from Iraq is the most striking form of comedy in this supposedly tragic film. Even more absurd is when two people on Rashid Street notice what Faten is doing to the lampposts and consider reporting her. The question here is, who would they report? The Americans are in control of the situation, which implies that the idea of resistance is Faten's personal concept.\n\nThe film had an opportunity to focus on the deep rift that the occupation created in the fabric of Iraqi society, causing social and cultural fragmentation. Focusing on isolated incidents does not provide a comprehensive picture of a society with a rich history spanning seven thousand years.\n\nThe film was preemptive, portraying Umm Yasser, a devout Muslim woman, as a Christian without fully developing her Christian identity through dramatic action. We are then surprised to find Faten is a Mandaean midway through the film, without any foreshadowing, as she suddenly takes Yasser to a Mandaean temple—a scene reminiscent of a tourist attraction. This scene has a significant impact on the character of one of the film's protagonists. The researcher argues that the film failed to give either of the two leading ladies a cinematic edge, which distracted the viewer and led to expectations that were not there.\n\nWe didn't see the location that should be central to such a film—the very essence of the work, the focal point that attracts all the attention, the place that should never be absent, especially given the awareness that such films are defined by their specific setting, without which the film cannot reach its full potential. Instead, we found a location that could have been created in any media production city.\n\nThe film failed to present the Baghdad we know, nor its people. All the important dramatic moments were merely reported in a factual manner. The grandfather, with his nationalist leanings, was the subject of much discussion, and Yasser's interest in music—we don't know why—led him to go to the mosque. Similarly, the references to conflict zones lacked credibility and reinforced a regionalist bias towards one segment of the Iraqi population, nothing more.\n\nThe film's narrative expanded on numerous points, weighing down the plot without contributing anything to the overall cinematic structure. Scenes at the Khidr Elias shrine, scenes involving the Mandaeans, scenes of the explosion, and scenes of the American patrol all featured the same actors.",

          "title": "Art and Garbage: A Structural Transformation in Aesthetic Taste",
          "maxOccupiedPages": 2.2857142857142856,
          "text": "A young Iraqi artist, Abdul Qader Al-Naib, has made a name for himself by transforming waste into works of art. This has led many commercial establishments and public markets to collaborate with him on creating sculptures from Iraqi waste.\n\nSimilarly, several works have appeared in various locations in Baghdad. Among the most notable is a large, eight-meter-tall sculpture made of scrap metal and iron in the Iraqi Businessmen's Center (Al-Mahatta) by the artist Amer Laibi, who has become a prominent figure in this art form. He borrowed a well-known cartoon character for the piece. This trend has since spread to public parks and squares.\n\nInside Al-Qishla Park on Al-Mutanabbi Street, there is a collection of sculptures constructed from discarded iron. Artists Hassan Al-Abadi, Amir Hannoun, and Wissam Al-Furati collaborated on this project.\n\nHassan Al-Abadi also created an artwork in the gardens of the Iraqi Artists Association. Its themes are closely related to his observations of everyday life in Iraq, using iron remnants from the war. It is based on a profound visual and sensory understanding of the material.\n\nI refer to the technique and composition employed by the sculptor Hassan Al-Abadi. The iron faces are sculptural works in every sense, adhering to the principles of three-dimensional form. Regarding the review of his works, his ability to refine and connect them with elements of a striking, unusual form is noteworthy. The artist's experience can be categorized into two types: first, the familiar form of sculpture, and second, the structural composition of elements and their strangeness, coupled with the expertise that leads to the formal and technical organization of visuals. This has made these works a phenomenon in Iraqi art, transforming the aesthetics of representation from a transient world into a new existence of aesthetic appreciation. He sees that Iraqi garbage differs from that in other cities, within an anthropological and cultural context, and has a specific system within society. Therefore, some Iraqi remnants have emerged with strange cultural characteristics. Until recently, our lives retained a dual identity: remnants filtered from needs that were used for religious and ideological purposes, serving as vessels for our survival.",
