          "title": "Dashi and Umami: A Conversation with Kimio Nonaga of Nihonbashi Yukari",
          "maxOccupiedPages": 1.3333333333333333,
          "text": "It's important to remember that the umami in dashi (Japanese broth) is enhanced by the synergistic effect of glutamic acid and inosinic acid, as seen in kelp and bonito flakes, and guanylic acid in dried shiitake mushrooms. This applies to other ingredients and seasonings as well; for example, the tomato and miso sauce I call \"Tomomiso,\" and Parmesan cheese in miso soup, both go very well together. Japanese cuisine needs to evolve with the times, too (laughs). Also, remember that the umami in each ingredient increases as it matures.\n\nHowever, and this may sound contradictory, dashi-infused miso and dashi packets are certainly suitable for times when cooking time is limited. Even granulated dashi is fine. Adding a little chicken stock powder to it will deepen the flavor. The important thing is to use slightly less than the recipe calls for. The ingredients themselves release umami, so there's plenty of flavor.\n\n\nMaking dashi by simply soaking kombu seaweed in water the night before is also a good option. Even at room temperature, the kombu will slowly open up over time, releasing its umami flavor slowly, resulting in a mild taste. You can then bring it to a boil in the morning and use it to make miso soup. You don't need to make dashi every day; it's convenient to make enough for about three days at once and store it in the refrigerator or freezer for later use.",

          "maxOccupiedPages": 3.4285714285714284,
          "text": "To address the changing environment surrounding children's eating habits in recent years, it is crucial to establish a guidance system in schools and to provide systematic and continuous guidance on food within the overall school educational activities. For this reason, the placement of nutrition teachers began in each prefecture in April 2005, and as of April 2011, a total of 3,853 nutrition teachers have been assigned to all prefectures. Additionally, 66 nutrition teachers are assigned to affiliated schools of national universities. The Ministry of Education, Culture, Sports, Science and Technology (MEXT) has included \"promotion of food education in schools\" in the general provisions of the new curriculum guidelines, which will be fully implemented in elementary schools from April 2011 and in junior high schools from April 2012, and has also enhanced the descriptions from a food education perspective in related subjects. Furthermore, the curriculum guidelines for high schools and kindergartens have also been enhanced with descriptions from a food education perspective. In June 2008, the School Lunch Act was amended, clearly defining \"promoting food education in schools\" as one of the law's objectives. It also stipulated that nutrition teachers should provide practical guidance on food using school lunches, and that school principals should create an overall plan for food education. Based on these changes, in March 2010, the \"Guidelines for Food Education\" were revised to outline the necessity of food education in schools, the goals of food education, the overall plan for food education to be created primarily by nutrition teachers, and the basic concepts and methods of food education in subjects and during lunchtime. Furthermore, since 2009, the \"Food Education Promotion Project Centered on Nutrition Teachers\" has been implemented, supporting initiatives in each region to address challenges in promoting food education by having nutrition teachers at the core, in cooperation with families, producers, PTAs, and other local organizations, under the guidance of the board of education. Furthermore, in fiscal year 2009, we produced educational materials (DVDs) to deepen parents' and others' understanding of the importance of promoting food education in schools and school lunches. Since fiscal year 2010, we have also been implementing a program to dispatch experienced retired nutrition teachers and school nutrition staff to less experienced nutrition teachers. School lunches not only aim to maintain and improve children's health by providing them with nutritionally balanced and nutritious meals, but they also have great educational significance as they can be used as \"living teaching materials\" not only during lunchtime but also in various subjects, special activities, and integrated learning time to effectively promote guidance on food. As of May 2009, 21,713 elementary schools (99.2 percent of all elementary schools) and 9,235 junior high schools (85.5 percent of all junior high schools) were implementing school lunches, for a total of approximately 32,400 schools. In recent years, schools have been working to diversify their school lunches. For example, they are using locally produced ingredients in school lunches and incorporating local regional dishes and traditional cuisine into their menus.",

          "title": "Roskachestvo Explains What Ideal Pelmeni Should Be Like and How to Eat Them Without Gaining Weight",
          "maxOccupiedPages": 2.0952380952380953,
          "text": "Roskachestvo will host a tasting of pelmeni sold in Russian stores and, as is its tradition, rank the best brands. Meanwhile, experts have shared tips on choosing the popular convenience food, storing it, and eating it properly without harming your figure. Recommendations are published on the organization's website.\n\nAccording to experts, ideal pelmeni should contain only seven ingredients: ground meat, onions, salt, pepper, flour, water, and eggs. However, the wording for \"spices\" in the ingredients is very vague, and flavor enhancers and flavorings may be added under the guise of \"spices.\"\n\nExperts recommend choosing a product whose labeling clearly lists all the spices used. Experts also recommend that neither the ground meat nor the dough should contain fiber or starch, otherwise it's a form of consumer deception. Pelmeni should also be crumbly in the package, as sticky products may indicate improper storage. The maximum shelf life of pelmeni should be six months, stored at a temperature no higher than -10 degrees Celsius.\n\n\"For those watching their weight, a serving of pelmeni should not exceed 10 pieces—150 grams, or approximately 300 kilocalories,\" noted Roskachestvo. Additives such as mayonnaise, butter, and heavy cream should be avoided. If the pelmeni significantly increase in size during cooking, this may indicate soy in the recipe.\n\nRoskachestvo intends to check the quality of pelmeni produced in Moscow, the Novgorod, Chelyabinsk, Tver, Leningrad, and Samara regions, the Krasnodar Territory, St. Petersburg, the Vladimir, Belgorod, and Oryol regions, the Republic of Mordovia, the Nizhny Novgorod, Novosibirsk, and Tomsk regions, the Republic of Bashkortostan, the Krasnoyarsk, Altai, and Perm territories, as well as the Saratov and Ryazan regions. Experts will examine the meat filling, check the dough for flaky texture, evaluate the taste of the dumplings, and determine if they contain antibiotics, colorings, or flavorings. About 50 packs will be purchased, including \"children's\" varieties and the popular \"bulmeni\" dumplings. The products will be tested for over 50 quality and safety parameters.",

          "idx": 56,
          "title": "Ahead of Summer, Roskachestvo Lists the Signs of Ideal Ice Cream and Ingredients You Need Not Worry About",
          "maxOccupiedPages": 1.5238095238095237,
          "text": "With summer approaching, Roskachestvo (the Federal Agency for Quality Assurance) has issued a reminder on how to choose the right ice cream and whether stabilizers and E-additives should be a concern. Expert recommendations are published on the agency's website.\n\nAccording to GOST, ice cream is made from milk or cream, natural flavors and stabilizers, butter, and eggs. The milk content in such products must be over 40%. If palm oil is listed as an ingredient, it is considered a milk-containing product and should be priced lower than ice cream.\n\nFat content affects the appearance of ice cream: in milk ice cream, it is no more than 7.5%, making it a treat even for those watching their weight. Cream ice cream has 8 to 11.5% fat, while plombir ice cream has 12 to 20%. Ideally, ice cream should be uniform in color. Inconsistency indicates that the mixture was not properly mixed with the natural additive or coloring during production. The higher the fat content, the yellower the treat.\n\nIf the ice cream is misshapen, it's either improperly stored or nearing its expiration date. A white coating on the chocolate coating also indicates improper storage or an ambiguous composition. The coating itself should be evenly distributed and not fall off. Ice crystals on the surface indicate that the ice cream has been re-frozen, meaning its flavor has already been spoiled. However, if the ice cream is chipping, it's a good sign: hardened frozen mass always has a dense consistency.",

          "title": "Is It Mahonesa Sauce, or Perhaps Mayonesa?",
          "maxOccupiedPages": 1.5714285714285714,
          "text": "The spell checker accepts both spellings, although the Royal Spanish Academy (RAE) and this writer prefer to spell it with an \"h\". Making mayonnaise is simple: garlic clove + egg + vinegar + a pinch of salt. Whisk, gradually adding sunflower oil. Some might add, \"Start praying it doesn't curdle,\" but simply don't move the whisk until it begins to thicken.\n\nIt's related to other sauces like aioli, but mayonnaise is prohibited in food establishments, as it's made with raw egg. The mayonnaise found in many restaurants is either jarred or made with pasteurized eggs; with the latter, curdling is virtually impossible.\n\nIts origins, though disputed, begin on April 18, 1756, when Marshal Richelieu attacked Fort San Felipe in Mahón and invaded the island. The troops then tasted the sauce known as \"all-i-oli.\" They copied the recipe and took it to France to share it with their French friends.\n\nIt was in France that they changed the original olive oil for a milder one, omitted the garlic, and named the resulting sauce 'Sauce Mahonnaise' (after Mahon). Louis François Armand du Plessis's cook claimed to have created it to celebrate Duke Richelieu's victory over the British at the port of Mahón, in Menorca, and that it was named in honor of that town.\n\nThe debate surrounding its origin centers on whether the sauce the French took with them predated this version or if it was a cook's improvisation during battle. A poem by a Frenchman named Lancelot, written in 1625, long before the Battle of Mahón, appeared in France as a recipe for mayonnaise.",

          "idx": 58,
          "title": "The Star: Spanish Potato Omelette",
          "maxOccupiedPages": 1.5238095238095237,
          "text": "It is believed that the potato omelet began to spread, and most theories revolve around the Carlist Wars.\n\nIt is said that a housewife living in one of the many houses in the Navarrese mountains invented it and offered it to General Tomás de Zumalacárregui (the military leader of the Carlist army). He asked her for something to eat. She went to the kitchen and saw that she only had a few potatoes and onions and a couple of eggs. Not wanting to disappoint him, she fried the chopped potatoes and onions, and when they were cooked, she mixed them with beaten eggs.\n\nShe put the mixture in a pan and let it simmer. The general liked the dish and used the recipe to feed his troops.\n\nThe CSIC (Spanish National Research Council) contributes its research on the origin of this dish in Europe. Researchers refer to Joseph de Tena Godoy y Malfeyto, Marquis of Robledo, who was searching for a nutritious and inexpensive food to combat the famines that plagued late 18th-century Europe. It appears they invented a type of pancake that wasn't baked but rather cooked in a pan.\n\nThe study places the origin of the Spanish omelet in the Extremaduran town of Villanueva de la Serena.\n\nIt may also have origins in Seville, as the hospital run by the Brotherhood of Charity in Seville was experiencing financial difficulties. On the advice of some of the repatriated emigrants from the Americas, the brothers used potatoes grown in some fields to feed the patients, and they were well-received. This all occurred in 1575.",

          "title": "MIVARF Spurs Tanzania's Industrial Development",
          "maxOccupiedPages": 2.9523809523809526,
          "text": "The Government through the Marketing, Value Addition and Rural Financial Services (MIVARF) Program has been able to improve the lives of rural people in Meru and Mbulu Districts in Arusha Region by adding value to milk and garlic farming.\n\nSpeaking to experts from MIVARF, The Grand Demam Dairy Factory Manager Deo Temba said, we used to process 300 liters of milk per day which was a small amount of milk according to the needs of the people, but now we can process 2500 liters of milk per day after receiving assistance from MIVARF by building a Cold Room for us.\n\n“Since the construction of the cold room, we have been able to increase milk products through 15 groups where in those groups there are 120-150 people which reaches the number of people who bring milk to the factory”, Temba noted.\n\nThe Grand Demam.co.Ltd factory has been able to connect farmers with the factory as the factory provides them with education on how to milk milk productively so that they can get a lot of quality milk along with good husbandry by having few livestock and producing a lot of milk and providing them with medical services for their livestock.\n\nA farmer from Meru District Hilda Mroso explained that, previously, she used to milk a lot of milk but sent 300 liters of milk to The Grand Demam Factory due to lack of storage space, currently she is able to send 800 liters of milk to the Factory due to increasing the storage space for the milk.\n\nIn addition, the MIVARF Program has also enabled the Bashay Vegetable Processing Factory in Meru District by providing them with an onion drying machine where previously they were drying onions using the sun or Solar Drier which used to take them one to six weeks to dry the onions.\n\nOnion farmer Boniface John explained that before the MIVARF program was implemented, the Bashay Onion Processing Factory was processing with great difficulty and for a long time and processed very few onions.\n\n“The availability of this onion drying machine has enabled our factory to improve processing services as the machine is capable of drying one to two tons of garlic in eight hours, equivalent to 20 sacks, so we can dry it quickly, and it has helped us increase customers as we are completing our orders on time. This is a great development in our Bashay Village, said the farmer. ”\n\nThe factory is now able to sell value-added products by selling crushed garlic, namely garlic powder and garlic paste, which has helped them sell easily and increase their income.\n\nMIVARF; is a Rural Markets and Financial Services Infrastructure Programme developed by the Government of Tanzania in collaboration with the International Fund for Agricultural Development (IFAD) and the African Development Bank (ADB). The main objective of this Programme is to achieve the Government's objective of reducing poverty and accelerating sustainable economic growth by enabling rural households to increase their income and food security.",

          "title": "TADB Supports the National Milk-Drinking Campaign",
          "maxOccupiedPages": 3.0952380952380953,
          "text": "In ensuring that many Tanzanians increase their enthusiasm for drinking milk, the Tanzania Agricultural Development Bank (TADB) has supported the efforts of the Government and the Tanzania Dairy Board (TDB) in the country by providing equipment to be used in the National Milk Drinking Campaign expected to be held nationwide in Kagera region from May 28 - June 1 this year.\n\nSpeaking during the handover of the equipment held at the TADB Offices in Dar es Salaam, the Acting Managing Director of TADB, Mr. Francis Assenga said that the Agricultural Development Bank has supported the Campaign by recognizing the importance of promoting milk drinking in the country as recommended by the World Health Organization (WHO).\n\n“Recognizing the importance of this Campaign, TADB in collaboration with TDB and many stakeholders are determined to promote milk drinking to reach international standards of milk consumption which is estimated to reach at least 200 liters per year from the current 47,” he said.\n\nHe added that recognizing the importance of dairy farming, TADB included the value chain of beef and dairy farming as one of the first chains to receive loans for livestock value addition in the country.\n\nHe stressed that his Bank is committed to developing the value addition of Beef and Dairy Farming to support various Government efforts in the development of the dairy sector in the country.\n\n“The Bank provides loans and supports investments for the construction, purchase of machinery and installation of cattle handling equipment including dips and watering ponds as well as milk processing to add value to milk,” said Mr. Assenga.\n\nFor his part, the Acting Registrar of TDB, Dr. Mayasa Simba said that the national campaign with the theme ‘Save the Ship, Build Health, Build the Economy through Milk’ aims to shape the Dairy Board’s commitment to managing, coordinating and providing quality advisory services to stakeholders to promote and develop a sustainable and competitive dairy industry in the country.\n\n“The aim of this campaign is to promote milk consumption to ensure that more Tanzanians reach international standards and also to achieve the Board’s goal of ensuring a well-managed and coordinated, competitive dairy sector with the aim of improving the lives of Tanzanians and increasing the contribution of the dairy sector to the national economy,” he said.\n\nThe Dairy Board was established by the Dairy Sector Act, Chapter (262) which is under the Ministry of Agriculture, Livestock and Fisheries with the responsibility to manage, coordinate and develop the sector. The Board has the responsibility to encourage and empower stakeholders in the activities of production, milk collection, processing, improving marketing and consumption of milk and its products.",

          "title": "Feeling Stressed?",
          "maxOccupiedPages": 2.0476190476190474,
          "text": "It’s not clear why some people can sidestep or recover more quickly from stress than others. These resilient people seem to “bounce back” more easily after stressful situations. Recent studies of animals suggest that resiliency may depend at least in part on our genes. But learning healthy ways to cope with stress can also boost your resilience.\n\n“There are many different ways to cope with stress. We know from a lot of different studies that having close personal relationships—people with whom you can talk, with whom you can share your feelings—can be helpful,” says Kiecolt-Glaser. “So spending time with family and friends in order to maintain those relationships is perhaps one of the most crucial things you can do as a stress reducer.”\n\nUnfortunately, Kiecolt-Glaser adds, “when we’re stressed, we tend to do the worst things that are not at all helpful to our health.”\n\nFor instance, stressed out people may tend to isolate themselves and not seek social support. “Exercise is a great stress reducer. But when people are stressed, exercise becomes less common and less appealing,” Kiecolt-Glaser says. “Instead of maintaining a healthy diet—also important to reducing stress—some people who are stressed tend to eat more donuts than vegetables.”\n\nYou may think that the agitation brought on by stress might help to burn calories. But evidence hints that the opposite is more likely. Kiecolt-Glaser and colleagues found that, compared to nonstressed people, those who were stressed burned fewer calories after high-fat meals and they produced more of the hormone insulin, which enhances fat storage. “So stress may contribute to weight gain and obesity through these biological routes,” Kiecolt-Glaser adds.",
          "occupiedPages": 1.4761904761904763,
          "originalEnglish": true
        },

          "idx": 62,
          "title": "Struggling to Sleep?",
          "maxOccupiedPages": 1.0,
          "text": "Most people who have sleep apnea don’t realize it. That’s because this disorder only occurs during sleep.\n\nSleep apnea is when you have pauses in breathing while you’re asleep. These pauses can last from seconds to minutes. You may have difficulty breathing a few times or dozens of times an hour.\n\nThese breathing pauses can be dangerous if they cause the oxygen level in your body to drop or disturb your sleep. When oxygen drops, your brain does whatever it can to get you to resume breathing. And then you may snore, gasp, snort loudly, or make a choking sound. A family member or bed partner might be the first to notice these disruptions in your sleep.\n\nSleep apnea is a common disorder. Anyone can develop it. “Sleep apnea can occur in both genders, in all races and ethnicities, and in people of all sizes and shapes,” says Dr. Michael Twery, a sleep expert at NIH.",

          "idx": 63,
          "title": "The Egyptian Initiative for Personal Rights Comments on the Clinical Trials Law: Welcome Amendments That Reflect Civil Society Proposals",
          "maxOccupiedPages": 2.9523809523809526,
          "text": "On August 24, 2020, the Egyptian Parliament approved the amended version of the Clinical Medical Research Regulation Law, incorporating several modifications in response to recommendations submitted by the Presidency in October 2018. The Egyptian Initiative for Personal Rights (EIPR) considers the amendments to the law regulating clinical trials to be positive and consistent with the recommendations it presented during a hearing with members of Parliament in 2018, as well as its commentary submitted after Parliament passed the law in May 2018. These recommendations aim to address the fundamental shortcomings in conducting clinical research in Egypt.\n\nEIPR also views the passage of the Clinical Trials Law as a clear and effective example of the role that civil society and human rights organizations can play when given the opportunity to collaborate and partner with executive and legislative bodies, both globally and locally. In April 2018, EIPR was invited to participate in a hearing held by the Parliament’s Health Committee to gather the views of various stakeholders on the draft Clinical Medical Research Regulation Law.\n\nIn 2016, the Egyptian Initiative for Personal Rights, in collaboration with several local and international research organizations, published its report, \"Ethical Questions about Drug Clinical Trials in Egypt: Local Challenges and Funding from Manufacturers.\"\n\nThis report generated widespread public and media attention both locally and internationally. While the report affirmed the legality of the practices of international companies funding clinical trials in Egypt, in accordance with Egyptian legislation, it also found these laws insufficient to protect Egyptian patients and riddled with flaws that are inconsistent with similar laws in other countries.\n\nIt is worth noting that Egypt ranks second only to South Africa in the number of African countries hosting clinical trials for drugs sponsored by multinational pharmaceutical companies. This is attributed to the availability of infrastructure, researchers, and physicians who are attractive to researchers. Furthermore, Egypt's demographics, patient profile, and the relatively low cost of conducting these trials are key incentives for doing so. However, the downside is that the Egyptian healthcare system does not provide some patients with access to basic treatment, potentially forcing them to participate in these trials despite the risk of exploitation in order to obtain free treatment, even if the outcome is unknown. This general climate facilitates the exploitation of the most vulnerable and needy citizens. Therefore, the Egyptian Initiative report presented a set of proposals to the Egyptian authorities and decision-makers, including several recommendations for the new law.",
          "occupiedPages": 2.3333333333333335,
          "originalEnglish": false
        },
        {
          "idx": 64,
          "title": "Marking Universal Health Coverage Day, the Egyptian Initiative for Personal Rights Publishes Its Report on the Pilot of Comprehensive Health Insurance in Port Said: A Community Assessment of the Phase and Necessary Reforms",
          "maxOccupiedPages": 4.0476190476190474,
          "text": "The report presents a model for activating the role of community accountability as a guarantee for the sustainability of various reform efforts, enabling society to systematically monitor the development process. This stems from the initiative's belief that enjoying the highest attainable standard of health is a fundamental human right, as enshrined in the World Health Organization Constitution and the Egyptian Constitution. The right to health includes access to acceptable, affordable, and appropriately sized healthcare at the right time.\n\nCommunity participation and dialogue formed the foundation of the new Comprehensive Health Insurance Law and its executive regulations. This law is the product of ongoing work involving experts, government officials, and civil society representatives. Numerous hearings were held to design a system that ensures accessibility, availability, acceptability, and quality of services and healthcare protection, without discrimination and regardless of income level.\n\nThe Egyptian Initiative for Personal Rights (EIPR) participated in the drafting of this law through advocacy and strategic litigation when proposed legislation conflicted with the fundamental right to health without discrimination. EIPR also contributed proposals as a member of the drafting committee, aiming to ensure a comprehensive legal framework for the healthcare system—a plan for its complete and sustainable overhaul. It is worth noting that EIPR participated in Universal Health Coverage Day 2018 by publishing the compiled results of a community-based assessment of hospitals and health services in Port Said prior to the implementation of the Comprehensive Social Health Insurance System.\n\nThe Comprehensive Health Insurance System was launched in Port Said Governorate last July, with implementation to follow in the other governorates of the Suez Canal and Sinai. The government has already announced the collection of the various financial resources stipulated by the law for this purpose. Furthermore, various international funding bodies have provided additional resources and technical support for the necessary reforms to implement this law in Port Said.\n\nThe field research team observes that \"in general, there has been a noticeable improvement in the services provided by the new insurance system, reflecting a degree of seriousness in its implementation. This is primarily reflected in the visible buildings, equipment, and infrastructure. However, several shortcomings are evident, most notably the absence of a clear and separate master plan encompassing procedures, management and monitoring frameworks, information systems, education, accountability mechanisms, and community participation in monitoring services and educating citizens about their operation. These problems represent fundamental obstacles that increasingly affect citizen satisfaction and, if they persist, pose the greatest threat to public trust in this system. This, in turn, could impact beneficiary acceptance and reduce usage rates, particularly regarding the retroactive collection of contributions.\"\n\nToday, we present a phased assessment of the implementation steps of this law, in recognition of and to complement the role of civil society in community monitoring and oversight. This effort primarily aims to offer a scientific and community-based perspective on the implementation challenges, how to overcome them, and to propose clear suggestions that will ensure the law achieves its objectives.\n\nThe report also raises some important questions about the mechanisms for implementing the law, mainly pointing to the importance of providing information and full transparency regarding the implementation process so that society can interact positively in this project, and achieve full community oversight of the implementation process in a way that reduces the waste of resources and ensures that the voice of those concerned and the beneficiaries of the system is continuously conveyed.",

          "idx": 65,
          "title": "The Last-Line Antibiotic: Vancomycin",
          "maxOccupiedPages": 3.7142857142857144,
          "text": "In 1928, Fleming discovered that Penicillium mold had the ability to inhibit bacterial growth in his unwashed petri dishes. However, because he was unable to isolate the antibacterial components, it did not receive much attention. It wasn't until the 1940s that two other scientists, Florey and Chain, first isolated penicillin from Penicillium mold cultures and confirmed its bactericidal effect in mouse experiments. Subsequently, due to the need for treating wounded soldiers during World War II, penicillin was mass-produced and applied. Fleming, Florey, and Chain were awarded the 1945 Nobel Prize in Medicine for this achievement.\n\nSince penicillin, many microbiologists have devoted themselves to the search for and isolation of antibiotics. Following penicillin, streptomycin, chloramphenicol, oxytetracycline, tetracycline, and others were successively isolated and applied for various bactericidal purposes. Humanity has achieved considerable success in this period of combating bacteria. However, bacteria are living organisms; in other words, bacteria evolve. Although bacteria do not reproduce sexually, they can still undergo genetic recombination through processes such as conjugation and transformation. Mutated bacteria that develop drug resistance can then transfer this resistance to other bacteria through various genetic recombination mechanisms.\n\nVancomycin is currently known as a last-line antibiotic, commonly referred to as the \"silver bullet.\" Unlike most antibiotics that can be taken orally, vancomycin must be administered by injection over several weeks, making it expensive. Furthermore, due to its high toxicity and potential kidney damage, it is mostly considered by doctors only when commonly used antibiotics have failed.\n\nCommon antibiotics work by acting on the bacterial cell wall. The bacterial cell wall is composed of peptidoglycan, and the synthesis of this cell wall requires the catalysis of various enzymes to form a strong network structure. Penicillin, for example, has a structure similar to that of the bacterial cell wall, thus competitively inhibiting cell wall synthesis enzymes, thereby inhibiting cell wall synthesis and killing the bacteria. Vancomycin's bactericidal mechanism is similar to penicillin's; both inhibit bacterial cell wall synthesis. However, vancomycin's cup-shaped structure allows it to bind to the terminal segments of the cell wall's sugar chains via hydrogen bonds, preventing enzymatic activity from extending the original chain structure and thus disrupting the cell wall's structure.\n\nDrug-resistant bacteria counteract this mechanism. For example, penicillin-resistant bacteria produce an additional enzyme that destroys the portion of penicillin's structure that resembles the bacterial cell wall, preventing penicillin from binding to cell wall synthesis enzymes and thus losing its bactericidal effect. Although vancomycin is a last-line antibiotic, some resistant strains have been discovered. Vancomycin-resistant enterococci, for instance, have altered the terminal structure of their cell wall chains, significantly reducing vancomycin's affinity for the cell wall and thus losing its ability to inhibit cell wall synthesis enzymes. These drug-resistant strains often transfer their resistant plastids to other non-resistant strains through conjugation. This transfer can even occur between different species. In recent years, some vancomycin-resistant Staphylococcus aureus strains have proliferated rapidly, which is due to this.",

          "text": "Depression is among the most common mental disorders and is associated with a high individual and societal burden of disease [1–3]. In Germany, social security institutions have also documented a significant increase in the importance of depression in healthcare provision in recent years, accompanied by growing public awareness [4–6].\n\nDepression encompasses a heterogeneous spectrum of depressive disorders, which differ, among other things, in the severity and course of depressive symptoms [7]. For a diagnosis to be made, specific diagnostic inclusion and exclusion criteria must be met in addition to the presence of depressive symptoms—for example, the presence of certain key symptoms is required. Depressive symptoms, such as low mood and loss of energy, can also occur without a clinical diagnosis of depression—for example, as a subthreshold form of depression when the diagnostic criteria are not fully met, as well as in the context of other mental disorders and physical illnesses. This also includes depressive symptoms resulting from stressful life events, as well as in the course of substance-related disorders (e.g., alcohol and drugs), in chronic physical illnesses, or as a side effect of medication. Regardless of its diagnostic classification, depressive symptoms lead to subjective impairments in general health and health-related quality of life [8, 9] and are associated with increased morbidity and mortality [10, 11]. Furthermore, the presence of depressive symptoms is associated with increased outpatient physician visits and sick leave [12]. Increased utilization of health and long-term care services is particularly evident in older age [13].\n\nEpidemiological estimates of the prevalence and distribution of depressive symptoms in the population are therefore highly relevant public health information and provide an important basis for planning prevention and healthcare. Prevalence data for the adult population in Germany are already availa           "text": "Influenza is an infectious disease caused by the influenza virus and is classified into three types: \"Type A,\" \"Type B,\" and \"Type C\" *1. Type A, to which the \"novel influenza (A/H1N1)\" that spread from 2009 to 2010 belongs, is classified into many \"subtypes\" based on the properties of the proteins on the surface of the virus. Type A is originally an avian virus, and theoretically there are 16 x 9 subtypes, and it is known that some infect not only humans but also birds, horses, pigs, etc. For example, the influenza virus called \"A Hong Kong type,\" which had been spreading every year until then, is \"A/H3N2,\" and the \"A Soviet type\" is \"A/H1N1.\" In addition, \"avian influenza,\" which has occurred in large numbers in various Asian countries since 2003 and caused significant damage to the poultry industry in Japan, is \"H5N1.\" Influenza viruses can mutate while multiplying within a host or hybridize with the genes of other influenza viruses, resulting in the formation of viruses with new characteristics. Influenza strains such as \"A Hong Kong type\" and \"A Soviet type\" mutate slightly each year, changing their properties (antigenic changes), and have been prevalent almost every year from winter to early spring; they are also called \"seasonal influenza.\" However, the current novel influenza (A/H1N1) is a different type from the seasonal influenza that has been prevalent in the past (its genetic structure is different). The symptoms of this novel influenza (A/H1N1) are largely similar to those of seasonal influenza, and the number of severe cases and deaths has not been reported as high as initially feared. However, it is quite possible that another \"novel influenza\" will emerge in the future, requiring an even stronger response than this time. Furthermore, there remains the possibility that avian influenza (H5N1) could become easily transmitted from person to person in the future, leading to a global pandemic. The Ministry of Health, Labour and Welfare is working closely with the World Health Organization (WHO) and various governments to gather information and promptly and clearly disclose the information obtained to the public, while taking necessary measures in a timely and appropriate manner. We would also appreciate it if the public would accurately grasp the information regarding the epidemic situation and take appropriate measures according to their individual circumstances, such as in their local area, workplace, school, and other family and social life. Symptoms of the novel influenza that has spread this time include sudden high fever, cough, sore throat, fatigue, as well as runny nose/nasal congestion and headache. Most people who are infected and develop symptoms recover with mild symptoms, but some people with underlying medical conditions are at high risk of developing severe symptoms*2. In particular, people with underlying medical conditions as shown in Figure 1-1-2 need to take precautions to avoid infection during the epidemic, such as frequent handwashing and avoiding crowded places, and those around them also need to take precautions to prevent infection.",

          "text": "Cancer has been the leading cause of death in Japan since 1981, and currently, more than 300,000 people die from it annually. It is also estimated that one in two men and one in three women will develop cancer in their lifetime. Furthermore, the number of deaths from cancer is expected to continue to increase in line with the aging population. For this reason, the government has implemented research-focused initiatives since 1984 with the \"Comprehensive 10-Year Strategy Against Cancer,\" followed by the \"New 10-Year Strategy to Overcome Cancer\" in 1994, and the \"Third Comprehensive 10-Year Strategy Against Cancer\" in 2004, resulting in advancements in cancer diagnosis and treatment technologies. Furthermore, based on the \"Basic Act on Cancer Control\" enacted through a legislative initiative by Diet members in June 2006, the \"Basic Plan for Promoting Cancer Control\" (hereinafter referred to as the \"Basic Plan\") was approved by the Cabinet in June 2007, and cancer control measures are being promoted comprehensively and systematically. Regarding radiotherapy and chemotherapy, which are part of cancer treatment in Japan, there have been criticisms that the provision system for these is insufficient. Therefore, the Basic Plan positions \"promotion of radiotherapy and chemotherapy\" as one of the issues that should be addressed as a priority, and sets goals such as establishing a system to implement radiotherapy and outpatient chemotherapy at all \"cancer treatment collaboration base hospitals\" (medical institutions designated by the Minister of Health, Labour and Welfare to provide high-quality cancer treatment anywhere in the country. These hospitals provide specialized cancer treatment, build collaborative systems for regional cancer treatment, and provide consultation support and information to cancer patients) by fiscal year 2011. For this reason, in March 2008, the Ministry of Health, Labour and Welfare revised the \"Guidelines for the Development of Cancer Treatment Collaboration Hub Hospitals\" (hereinafter referred to as the \"Guidelines\") and implemented training for physicians and other personnel involved in radiation therapy and chemotherapy in order to improve the quality of radiation therapy and chemotherapy. Since many cancer patients suffer physical and psychological pain from the time they are diagnosed with cancer, and their families also suffer various kinds of pain, the basic plan positions \"implementation of palliative care from the early stages of treatment\" as one of the issues that should be addressed with priority, and sets a goal that all physicians involved in cancer treatment will acquire basic knowledge of palliative care through training, etc., within 10 years. Therefore, in order to achieve this goal by fiscal year 2011, the Ministry of Health, Labour and Welfare established model programs for training content in April 2008 as \"Guidelines for Holding Palliative Care Training Sessions for Physicians Involved in Cancer Treatment.\" These guidelines include: ① conducting training for physicians who are primarily responsible for providing palliative care at \"cancer treatment collaboration base hospitals,\" etc., so that they can guide palliative care training in each region; and ② conducting palliative care training for physicians involved in cancer treatment in each region, conducted by these physicians. Furthermore, the Ministry is working to establish a system that can provide appropriate palliative care, including ③ developing palliative care teams composed of physicians and nurses with specialized knowledge and skills in palliative care, and ④ developing a system that can provide palliative care in outpatient settings. In addition, the Ministry is working to promote the appropriate use of medical narcotics necessary for palliative care by promoting awareness of palliative care among the general public and by holding workshops for medical professionals.",

          "text": "The results regarding age and sex coincide, according to both national and international authors, with those reported by the National Health and Nutrition Examination Survey (NHANES), which recorded a clear increase in the disease among women. This finding aligns with the theory that hypertension is more frequent in women after age 50, due to the combination of weight gain and age-related hormonal changes.\n\nIn São Paulo, Cervato et al. found in their series that most patients suffered from stage I hypertension, which allows physicians to implement preventative health measures and, therefore, reduces the risk of progressing to stages II or III. This result is consistent with the findings in this case study. According to other opinions on the matter, it is possible to work towards achieving better control and appropriate rehabilitation for those classified in advanced stages of the disease, with a view to preventing serious complications and even death or disability.\n\nIt is worth noting that in this study population, patients in stage I hypertension predominated, since these are the patients with whom the family doctor can manage in their office. This is not the case with those categorized in the more advanced stage, who require care at the secondary level and, sometimes, hospitalization.\n\nIt was very encouraging that 93.8% of hypertensive patients gained a better understanding of the symptoms and signs of their disease, considering that they had to live with them. The percentage of those who continued to have inadequate knowledge, and consequently, those who required more intensive medical intervention to ensure they acquired the necessary information, was practically negligible. In fact, efforts to achieve this began immediately.\n\nRegarding pharmacological treatment, the results coincide with those obtained in educational interventions carried out in other regions, where a significant variation in the use and abuse of sedatives was also found.\n\nA decisive factor in reducing sedative use was the application of Cattell's IPATT (Individualized Attention to Tranquilizers), as it demonstrated to patients that many of them were resorting to these tranquilizers unnecessarily, since there was no justification for their use, given that the anxiety they experienced was normal in their case.\n\nIt is important to highlight that in the study, at the beginning and end of each session, the blood pressure of each participant was taken to evaluate the variation in blood pressure readings after the application of the corresponding techniques. This allowed for the discontinuation of unnecessary medications or the readjustment of the dosage.\n\nThe information provided in the sessions ensured a positive change in the group's knowledge, making this teaching-learning method effective and very well received by the participants in the health field.",

          "text": "Doctors, Midwives and Citizens of the Coast Region have commended the Fifth Phase Government for the steps it is taking to improve health services by providing funds for the expansion of health centers and the construction of District hospitals in the region.\n\nThe commendations were given by the health stakeholders earlier this week, while commending President Magufuli for the great efforts he is making.\n\nThe Acting Medical Officer of the Lugoba Health Center, Chalinze Council, Dr. Maganga Kazuri said they have received shillings. 400 million from the central government where the funds have been used to build five new buildings at the center, which are a laboratory building, surgery, mother and child, morgue and the house of the medical officer in charge of the center.\n\nHe said these improvements directly affect them as service providers as well as citizens who are currently receiving good and modern services.\n\n\"We were forced to refer patients to Tumbi or Bagamoyo hospitals due to the lack of surgical services at the facility, but due to these improvements, the service is provided here at the facility,\" said Dr. Maganga.\n\nFor his part, the Medical Officer of Kerege Health Center, Bagamoyo District Council, Dr. Nyangasi Gideon has commended President Magufuli for the efforts he is making in improving health services which has given them the morale to work and provide better services to the citizens.\n\n\"We officially started the construction of the Kerege center in October, 2017 which was completed in March, 2018 and officially started providing services to the citizens of Mapinga, Kerege and Kiromo wards, where after the improvements 360 mothers have given birth,\" said Dr. Nyangasi.\n\nHe said, before the facility was renovated, it was receiving two to ten mothers every day.\n\nHe also said, mil. 500 provided by the Government have built a laboratory, a mother and child building, a surgery building and a doctor's house. The remaining funds were used to build a morgue and a laundry building.\n\nMeanwhile, the Regional Health Centre Nurse, Kibaha Town Council, Immaculate Sangu said the improvements made at the centre will relieve the congestion of patients where it receives 350 to 400 patients per month.",

          "maxOccupiedPages": 1.3333333333333333,
          "text": "Purdy (2011) says that condoms are the second method of protection against sexually transmitted diseases and family planning. Companies and governments around the world have started advertising on social media to sensitize members of society about this method. By simply clicking on the topic of sex on social media, the results are many, for example; videos, images, texts that can be viewed and read by anyone as long as they are connected to the network. The texts of safe sex advertisements on social media emphasize content that shows sexual pleasure. This study examined the content that is dominant in Durex advertisements.\n\nSome countries have enacted laws that regulate advertisements related to sex. The Kenya Films and Classification Board (KFCB) in 2015 opposed the airing of safe sex advertisements on television and radio from 5 am to 10 pm (Standard Media Group, 2015). The KFCB claimed that such advertisements encourage society, especially children, to participate in sex. Safe sex advertisements were moved to social media because they were not properly regulated by law. This study examined in depth the content emphasized in Durex advertisements based on the theory of critical discourse analysis to uncover hidden themes that emerge from the advertisements.",

          "title": "York",
          "maxOccupiedPages": 2.142857142857143,
          "text": "Although only the sixth-largest city in Yorkshire and having no official status, York is regarded as the county's capital, and is also positioned just east of its geographic centre. For 1800 years, it was the largest and most important city in northern England, though today has a rather modest population just shy of 200,000 people. Despite its size, York packs in more history and culture than many much larger places, and is a fascinating and beautiful destination any time of year.\n\nYork city centre is a compact and dense warren of mostly pedestrianised streets lined with centuries-old buildings in a mix of architectural styles, from timber frame medieval structures, to much grander stone and brick edifices from later periods. The centre straddles both banks of two rivers - the Ouse (pronounced ooze) and the Foss - which merge just south of the castle. At the city's heart stands the imposing York Minster, one of the largest Gothic cathedrals in the world, and the mother church for northern England's Anglican community. The Archbishop of York (Stephen Cottrell, as of 2020) holds the third-highest office in the Church of England, after the Archbishop of Canterbury and the Queen. York's old town is completely encircled by a series of defensive medieval walls. At just over 2 miles (3.2 km) long, 13 feet (4 m) high, and 6 feet (1.8 m) thick, they are the UK's most extensive and best-preserved city walls.\n\nMost visitor attractions are within or just outside these walls, so you will seldom find yourself venturing into York's outer neighbourhoods. However, if you do, you will find them pleasant and residential, mostly containing red brick houses from the 19th and 20th centuries. There is a modern university campus around Heslington in the south-eastern suburbs, a large racecourse called the Knavesmire in the south-west, and extensive parks along the Ouse's journey through the northern and southern suburbs. This urban sprawl is bounded by a modern day city wall of sorts: the ring road separates York from its rural surroundings, the well-endowed farmlands and villages of the Vale of York.",

          "idx": 82,
          "title": "Edinburgh",
          "maxOccupiedPages": 2.0,
          "text": "This was an exciting place to be 300-350 million years ago, as volcanoes raged and flared across the region. The biggest was what we now call Arthur's Seat, with smaller cones at Castle Rock, Calton Hill, and elsewhere. Then they fizzled out and started to be buried by other rock layers. Much later came the Ice Ages, the last some 20,000 years ago. Vast glaciers from the west scoured away the surface, but where they hit Castle Rock they had to divide and flow around. They left the Rock intact with a scooped-out hollow to its north, west and south, and a tail of stone debris dumped in its lee to the east. This created an obvious defensible spot for early settlement. By the 12th century Edinburgh was the chief city of Scotland; the Old Town grew up with the Castle at its head, the Royal Mile stretching down the debris tail, and Holyrood Palace at its foot.\n\nAnd up and up it grew: space was limited, so buildings became taller, ten or more storeys high even in medieval times. But no lifts or pumped water of course, and sanitation was taken care of by opening a window, shouting \"Gardyloo!\" and letting gravity do the rest. Every medieval city stank, but Edinburgh became known as \"Auld Reekie\" from the distinctive stench of sewage mingled with smoke from coal, mined and burned here from early times.\n\nEdinburgh lost some of its importance after 1707, when Scotland united with England and political power ebbed away to London. But in the mid-18th century it revived, when it broke out of the confines of the Old Town, by creating a graceful New Town to the north. The intervening midden, the \"Nor Loch\", was drained, bridged, and an earth mound pushed across. There was similar expansion on the south side. Victorian times saw an industrial boom fuelled by the coal deposits nearby to the east, and by shale oil produced to the west. Canals and then railways brought in materials and a labour force.",

          "idx": 83,
          "title": "From Damascus's Rawda to Berlin's Einstein: A Heartbeat",
          "maxOccupiedPages": 4.857142857142857,
          "text": "Once, a friend arranged to meet me at a café called Al-Rawda on Al-Abed Street in Damascus, a place I hadn't known before. As soon as I entered, I was overcome with a sudden joy. I felt my body blossom like a rose on a summer night, floating on clouds like a Sufi, my heart floating on waters of spirit like a prophet after receiving a divine revelation. It was the same feeling I had when I found \"my seat\" at the Einstein Café in Berlin, where I'm writing now (although today, June 10, 2019, I'm writing from a different seat because someone has taken mine, and I'm waiting for them to leave).\n\nAmidst this spiritual surge, I also encountered the poet Muzaffar al-Nawab at the café/Al-Rawda, which I had just discovered. I greeted him and went to my friend's table. From then on, this café became my familiar place, my home in Damascus, and, as I would gradually discover, the home of Damascus's intellectuals and artists.\n\nMy favorite chair, when I was alone without friends, was the one overlooking Al-Abed Street, right by the glass. As soon as I sat down, the hookah and freshly brewed tea would be brought to me in a small cup. I would spend pleasant moments there, my eyes flitting between the book and the life unfolding before me like a television series, the thousandth episode of which I'm watching in Berlin today. In Damascus, the waiter knew my secret to the chair, without even asking or saying a word. As soon as he saw me sit in another chair, he would come over and say, \"When the customer leaves, I'll reserve the table for you, don't worry.\" And indeed, he would delay the hookah until the chair was free, unless the customer had just sat down and was going to be staying a long time.\n\nEinstein's Café in Berlin bears no resemblance to Al-Rawda Café in Damascus, except perhaps for the spiritual connection my imagination has forged between them. Al-Rawda Café in Damascus, established in 1938, embodies the history of Damascus itself. It's rare to find an intellectual, artist, or politician who hasn't frequented this café, located just meters from the Syrian Parliament. It possesses the very essence and spirit of Damascus, a haven of heaven within the earthly realm (the café spans 750 square meters, accommodating approximately 600 chairs and 150 tables). Those who haven't entered the café wouldn't expect to find within it multiple cafés, each with its own clientele, tables, and chairs, and each chair with its own devotee, and each devotee with their own story. There's the section overlooking the street, the open-air section frequented by Damascus's intellectuals, and the interior section, popular with Damascus's artists (actors). Sometimes, the sections and their patrons blend together.\n\nIn the morning, you'll always find the café's regulars: retired writers, politicians who've faded from the political scene, political prisoners no one recognizes anymore, political refugees, and former officers released after years of detention simply for contemplating a military coup. Around midday, intellectuals and the unemployed flock there to play chess or backgammon, joined by former employees who've lost their jobs. In the evening and well into the night, you'll rarely find a seat; you feel like you're surrounded by a familiar, yet endearing, bustle—a city within a city.\n\nThere are multiple forms of intimacy within this chaotic yet organized space, governed by rules well-known to its patrons. There's an intimacy that connects the café's regulars with its staff, an intimacy between young men and women seeking love or a fleeting night out, and an intimacy among the patrons themselves, where anyone can suddenly sit at your table and strike up a conversation. Friendships are forged here, only to end as soon as you leave the café or due to the ceaseless gossip. This is precisely what's lacking in Einstein's café. There's no connection between the patrons and the café; a fleeting encounter dictated by the fast-paced rhythms of life and capitalism. There's no intimacy between the patrons and the waiters, no regular customers, no conversations between one customer and another. At Einstein's café, the individual is a transient customer, rarely returning or developing a close relationship. In contrast, at Rawda's café, the individual is a seeker, a lover, searching for a moment of longing. This is facilitated by the café's geography and its atmosphere, resembling a Damascene house escaping the confines of modernity.\n\nWhen I look at the faces of the workers at Einstein Café, I feel that the only similarity to Rawda Café lies here. Their faces suggest they are immigrants or the children of immigrants, university students searching for a source of income to help them withstand life's hardships and complete their studies. They are poor in a way, much like the poor people of Rawda Café in Damascus, most of whom (Arabs, Kurds, and other groups) worked from morning till night to ward off the specter of poverty.\n\nEinstein Café, in both form and spirit, is closer to my café in Beirut, even though all three share the same impoverished workers.",
          "occupiedPages": 4.190476190476191,
          "originalEnglish": false

          "idx": 84,
          "title": "A Journey of Olive Oil and Winter",
          "maxOccupiedPages": 1.619047619047619,
          "text": "Every olive harvest season, Afrin attracted hundreds of workers from outside the region, sometimes reaching thousands in bountiful seasons, to work in harvesting the crop. The sheer number of olive trees in Afrin was disproportionate to the population, necessitating assistance from neighboring and distant rural areas. The southern Aleppo countryside provided the largest share of this labor force. Other reasons for the lack of employment among Afrin residents included education, which kept the majority away from agricultural work.\n\nThose who traveled were entire families, young and old, men and women. They left their homes locked behind and went to camp in the olive groves of Afrin. Each family typically made an agreement with a specific landowner, returning annually to his olive groves to harvest the olives.\n\nThese families, known locally as \"Zayata,\" were transported by hop-on hop-off buses in a festive procession, complete with the distinctive sound of the bus horns and the loads of olives they carried. Some of these buses would return laden with their cargo a few days later, or even on the same day, due to a family dispute. This was considered a disgrace in the village.\n\nWhat made this journey so deeply affect me, and what I could express in this text, might be that families took all their children, even those still in school. Their words still echo in my ears:\n\n-Where's so-and-so?\n\n-He went with the olive harvesters.\n\nThe olive harvesters would camp in the vineyards for about a month, harvesting thousands of trees.",

          "idx": 85,
          "title": "An Excellent Gateway to Forest Ecotourism: The Forestry Bureau's Taiwan Forest Recreation Website",
          "maxOccupiedPages": 4.523809523809524,
          "text": "Since the beginning of the 21st century, the preservation and sustainable management of forest diversity has become a global trend, with countries worldwide adopting \"environmentally conscious policies\" to safeguard the social, economic, ecological, cultural, and spiritual needs of modern and future generations. Taiwan, the \"Island of Mountains,\" boasts 220 mountains exceeding 3,000 meters in altitude. Its rich geological and topographical landscapes have nurtured many precious and unique species, habitats, and ecosystems, attracting numerous people to explore the mountains and experience nature. With ecotourism, hiking, and nature education becoming increasingly popular, the Forestry Bureau has been developing forest recreation services since the 1960s, effectively leveraging the economic and social functions of the forest environment while protecting its ecological balance. However, with the increasing prevalence of information technology, the internet is considered a crucial interface for information transmission and communication in the future information technology society. The various electronic services that accompany the internet, with their speed, convenience, and immediacy, bring a new dimension to modern society, which values knowledge capital and the knowledge economy. Given the ubiquitous reach of the internet, the Forestry Bureau is expanding its forest ecotourism network to assist in the transformation of traditional forestry production into a tertiary industry. At the same time, it is building the \"Taiwan Forest Leisure Network\" (Figure 1), which transforms the Forestry Bureau's forest ecotourism sites, such as national forest recreation areas, nature education centers, and nature trails, into a system in the online world. This will enable the government to serve the public more quickly and effectively and assist in the development of forest ecotourism. To provide the public with convenient and comprehensive information and services that combine environmental education, leisure and recreation, and life experience, and to fully showcase the development achievements of the forest ecotourism network, effectively implementing the goal of sustainable and healthy forests, the Taiwan Forest Leisure Network is an integrated portal website encompassing guides to the Forestry Bureau's ecotourism sites. In addition to assisting the development of forest ecotourism, it aims to achieve functions such as education and promotion, enhanced interaction, increased international visibility, and forest ecotourism guidance. Based on this, it is planned with 11 functional modules: \"Homepage,\" \"National Forest Recreation Areas,\" \"National Trail System,\" \"Plain Forest Parks,\" \"Nature Education Centers,\" \"Leave No Trace\" activities, \"Home of National Forest Volunteers,\" \"Tourism E-Point,\" \"Digital Forest Chronicle,\" \"Interactive Corner,\" and \"Others.\" The overall architecture of the portal website is shown in Figure 2. Most experts and scholars emphasize that ecotourism is based on nature and culture, and is responsible and sustainable tourism. Simply put, the core value of ecotourism is natural and cultural resources, and the spirit of the \"Taiwan Forest Leisure Network\" website is to showcase the natural and cultural resources of forests. Typical recreation or tourism websites often use prominent or large headlines to tell their target audience how fun and attractive the recreational destinations offered by the website are, and how many people have already visited, in order to attract the attention of their target audience as soon as possible. The \"Taiwan Forest Leisure Network\" is different. Unlike typical travel websites, its two main modules, \"National Forest Recreation Areas\" (http://recreation.forest.gov.tw) and \"National Trail System\" (http://trail.forest.gov.tw), do not rely on aggressive marketing to attract visitors to their designated forest ecotourism areas. Instead, they aim to inform the public that these areas not only boast beautiful mountain scenery but also rich forest ecology and cultural resources. The website features abundant images of forests and provides detailed descriptions of the natural environment, ecological resources, and historical sites of each forest recreation area, nature trail system, and plain forest park. Each page unfolds like a captivating story or musical movement, guiding visitors to understand the beauty of these forest ecotourism areas and fostering the motivation and proper attitude to engage in ecotourism there. In this way, the Taiwan Forest Leisure Network attempts to bring the right visitors to the right places.",

        {
          "idx": 86,
          "title": "Issue 62, Farm-to-Table Green Travel, East Rift Valley: Growing Rice and Love for the Land — Chu He Ri Hao Bike De Koffie",
          "maxOccupiedPages": 2.7142857142857144,
          "text": "Bike De Koffie's owner, Hao Chaoyang, is a young man from the Puyuma tribe in the mountains of Taitung. Born in 1982, he has a refined appearance and exudes a scholarly air, though he jokingly admits that he doesn't actually enjoy studying. After studying international trade and culinary arts, he finally realized that the world of textbooks couldn't satisfy him; instead, he found the skills he learned at the Vocational Training Institute more practical. After completing courses at the Vocational Training Institute, Hao Chaoyang obtained Class C certifications in Chinese cuisine, baking, and bartending. Having previously worked in the coffee sales industry, Hao Chaoyang is not only familiar with the flavors of different types of coffee beans but also learned many marketing techniques. These experiences laid a solid foundation for his entrepreneurial journey. Hao Chaoyang's down-to-earth personality is similar to that of his sister and brother-in-law. Like Hao Chaoyang, his sister, Hao Suqing, and brother-in-law, Wei Wenxuan, also left their hometown to study and work. The couple originally ran an interior design studio in Taichung. After the 921 earthquake, they decided to return to their hometown to grow organic rice and established the bed and breakfast \"The Crops Are Ripe\" and the backpacker hostel \"Good Days with the Farmers,\" taking guests to the fields to experience farming activities such as rice planting, weeding, pest control, and scarecrow making, bridging the gap between urban dwellers and the land. At the end of 2013, at his sister's invitation, Ah-Yang quit his job in the coffee bean business and returned to Chishang to provide them with afternoon tea in the fields, coffee, and snacks. He also created his own coffee shop, Bike De Koffie, on the first floor of \"Good Days with the Farmers.\" The agricultural experience activities gave rise to Bike De Koffie's signature product, the rice bagel. Initially, the afternoon tea in the fields only included coffee and rice cheese, but later Ah-Yang developed the rice bagel using organic rice grown by his brother-in-law's family. The crispy exterior and soft interior of the bagel, after careful chewing, fills the mouth with the natural aroma of rice. Paired with pineapple and kiwi jam made from Guanshan pineapple, the sweet and sour flavor enhances the bagel's texture, making it more layered. In his second year back in his hometown, he won the \"One Person's Farmhouse Table - Most Promising Slow Food Development Award.\" Ah-Yang continues to unleash his innovative potential, further combining local agricultural products from Taitung, such as Chulu fresh milk, red oolong tea, and millet from Jinfeng Township, to develop many different flavors of rice bagels. In addition, Bike De Koffie also offers pure rice milk without peanuts, rice pudding, and other snacks that best represent Chishang, the rice-producing region.",

          "idx": 87,
          "title": "Cycling Tours Around Cottbus",
          "maxOccupiedPages": 1.7619047619047619,
          "text": "The grand Spreewald tour is a beautiful full-day excursion that explores a large part of the Upper Spreewald. You leave Cottbus heading northwest, passing through the villages of Briesen and Guhrow, and approach the Spree River near Schmogrow. Continue along the Spree dike until the cycle path branches off to the left towards Burg. Follow this path for a short distance and then continue on the Nordweg (Northern Path) and the Ringchaussee (Ring Road) to Buschmühle. Those wishing to take a break beforehand, or to enjoy the view of the surrounding area from the Bismarck Tower, should not turn onto the Nordweg immediately upon reaching the Spree, but continue straight ahead and take a detour of about one kilometer to the tower and the Bismarck Inn. Returning to Buschmühle, continue north to Straupitz. After a short break and a visit to the Schinkel Church and the Dutch windmill, the route continues across the meadows north of the Hochwald (High Forest) through the villages of Neu Zauche and Alt Zauche. The route takes a wide arc along scenic paths through the eastern end of the Upper Spreewald forest to Lübbenau. After exploring the old town center, the journey continues to the Spreewald village of Leipe. From there, the route leads past the Waldschlösschen (Little Forest Castle) to Burg. The final leg takes travelers back to the starting point in Cottbus via Werben and Briesen. Note: The route described here, which can be downloaded, leads directly from the Lübbenau Spreewald harbor to Leipe. Those wishing to visit Lübbenau Castle and the charming open-air museum village of Lehde should consider taking this slight detour; it's not a significant out-of-bounds, but visiting these sites will require some additional time.",

          "title": "Heldrastein",
          "maxOccupiedPages": 0.8571428571428571,
          "text": "The trail climbs steadily through mixed forest (partly via steps) to the Großenburschla - Schnellmannshausen road. Here, at the car park at an altitude of 340 meters, you've covered about half the elevation gain and distance. It's \"only\" 1.1 km to the summit. Incidentally, there are covered rest areas at the car park. From here, the really interesting part of the trail begins. A well-maintained path with steps leads steeply uphill through the beech forest. Those who want to take a breather can use the benches along the way. There are occasional beautiful views of the valley. You steadily approach the northern slopes of the Heldrastein, which the trail overcomes in a final effort. After more than 400 steps, you reach the summit plateau at an altitude of approximately 490 meters. From here, it's another 400-500 meters or so to the summit (503.8 meters) on a pleasant, wide track.",

          "idx": 89,
          "title": "Three Days in Nature's Embrace",
          "maxOccupiedPages": 0.9523809523809523,
          "text": "The next morning, we set out to visit the Wayanad Wildlife Sanctuary. Kerala's roads are excellent. Once, during a discussion in Parliament about roads, someone compared them to the cheeks of Om Puri and Hema Malini. Bihar's roads were described as being like Om Puri's cheeks; then, Kerala's roads are like Hema Malini's cheeks—absolutely smooth. Abdul, our taxi driver, could accelerate to the speed of an airplane in the blink of an eye. I had to tell him all the way, \"I love Allah Miya, but not so much that I want to go to meet him a few years in advance.\"\n\nOn the way, we passed Pookode Lake. It's a picnic spot: peaceful, clean, and beautiful. Such cleanliness is rarely seen in a picnic spot; it was a delight. It was a bit sunny, so instead of boating, we decided to explore it on foot. After a while, we noticed some children singing on the boat. The song was in tune and sounded good, but I couldn't understand it. After the round, we met with these children and their teachers. I talked to them about their school and the song.",

          "idx": 90,
          "title": "Lakhimpur Kheri's Historical Heritage: The Willoughby Memorial",
          "maxOccupiedPages": 1.4761904761904763,
          "text": "In the city of Lakhimpur Kheri, Uttar Pradesh, there is a nearly hundred-year-old historical monument called the \"Willoughby Memorial.\" It's natural for a history student to step into any historical building and wonder about what, why, how, and for what. These questions constantly clashed with each other in search of logical answers. In answering these questions, we found some evidence and some legends related to the Willoughby Memorial. Generally, the people of Lakhimpur aren't particularly aware of it, except for its location as a protest site, a playground, a wedding venue, and a political party meeting place. Architecturally, this red building doesn't make a significant impression at first glance, nor is it a remarkable example of architecture. However, built in 1924, it holds historical significance. Although the surrounding area is known as Willoughby, even in this era of the information revolution, searching for it yields very little information. As students of history, it is our responsibility to draw the attention of intellectuals to this issue, to explore how this historical monument and its library can be made more useful to the general public.\n\nTo gather information, we visited the site and gathered information from both young and old members of the city. We received important documents from the Willoughby Memorial Trust's current secretary, Dr. Ajay Kumar Aga, Associate Professor of Zoology. The Aga family has served as the trust's secretary for four generations.",

          "idx": 91,
          "title": "A Franciscan Itinerary in Assisi",
          "maxOccupiedPages": 2.142857142857143,
          "text": "This itinerary aims to follow the life of Saint Francis through visits to the Franciscan sites of Assisi (including easily accessible neighboring hamlets such as Rivotorto and Santa Maria degli Angeli). Many of these sites were the scene of numerous events, some at the beginning and end of the saint's life, so there will be many \"crossroads\" (you may witness the consequences of events that have yet to happen chronologically in Saint Francis's life). Furthermore, a fair balance has been sought between the chronological order of events and a \"practical\" order (for example, trying to place two nearby sites next to each other, even if they were not strictly chronologically consequential). The third day of the itinerary contains just a few stops, ideally filling only the morning and thus allowing for an easy return home if you are coming from far away. The ideal times to complete the itinerary are late spring or early autumn (even summer, if desired, as long as you don't choose excessively hot days). In practice, good weather is definitely recommended to enjoy the walk and the natural spaces, which are a crucial aspect of the journey. Furthermore, if you can choose the days of the week, it's best to go when there aren't too many people (for example, avoid religious holidays), to better enjoy the spiritual atmosphere without being overwhelmed by people (Assisi can be very crowded during the canonical holiday periods, especially religious ones). More than a simple tourist itinerary, it is also, and above all, a spiritual journey. Try to experience it as such, savoring the moments without rushing and trying to immerse yourself in what happened. If you are Christian, it will be natural to offer moments of prayer in the most important and meaningful places. During visits to the sacred sites (which will inevitably be the focus of the journey), it is mandatory to respect basic rules: maintain as much silence as possible and do not take photos or videos if prohibited. It is often possible to ask the friars who manage the churches or convents to accompany you on the visit to help you understand the history of the place. Although not mandatory, a donation is always appreciated (even more so if you are accompanied).",
          "occupiedPages": 1.7142857142857142,
          "originalEnglish": false
        },

          "idx": 92,
          "title": "Castel Goffredo",
          "maxOccupiedPages": 1.2857142857142858,
          "text": "Known worldwide for its production of women's hosiery—hence its nickname, \"Stocking City\"—Castel Goffredo is part of Textile District No. 6 in the provinces of Mantua and Brescia, home to over 250 industrial and artisanal businesses. The town was an independent fiefdom from 1444 to 1602 (Marquisate of Castel Goffredo) and one of the capitals of the Gonzaga States. In 1511, Marquis Aloisio Gonzaga founded the cadet branch of the Gonzaga family of Castel Goffredo, which died out in 1593. Under his rule, the town became an important fortress city, protected by seven towers and surrounded by a defensive moat; in the 18th century, the demolition of the walls began. In the 1840s, Castel Goffredo was the center of anti-Austrian conspiracies in the Upper Mantua area and attracted numerous patriots, led by the castellan Giovanni Acerbi, who later became the intendant of Garibaldi's Thousand. In 1859, it was the site of the Battle of Solferino. Since 1987, it has been one of the \"100 municipalities of little, great Italy.\" It acquired city status in 2002 and is the eighth most populous municipality in the province of Mantua. It is among the municipalities promoting the \"Ecomuseum between the Chiese, the Tartaro, and the Osone.\" Since 2017, Castel Goffredo has participated with its monuments in Wiki Loves Monuments, organized by Wikimedia Italia. In July 2020, it received the recognition of City that Reads 2020-2021.",

          "maxOccupiedPages": 2.1904761904761907,
          "text": "Founded in ancient times, Veliky Novgorod served for several centuries as the commercial, political, and cultural center of the entire Russian North. Conducting a lively trade with Western Europe, the city had very close ties with the Hanseatic League, although it was not formally a member. With the rise of first Kyiv, then Moscow, and later St. Petersburg, Novgorod gradually lost its former power and by the 18th century had become a quiet provincial town with a large number of monuments reminiscent of its former grandeur.\n\nWooden buildings predominated in ancient Novgorod, but the most significant religious buildings were constructed of stone. This, coupled with Novgorod's escape from the Mongol-Tatar raids, allows us to see the stages in the development of the Novgorod style, which evolved from its imitation of Byzantine churches, exemplified by the grandiose St. Sophia Cathedral, to the pinnacle of Novgorod architecture in the 14th and 15th centuries, represented by the churches of the Savior on Ilyin, Theodore Stratelates on the Ruchey, and Peter and Paul in Kozhevniki. After its annexation by Moscow, the city's distinctive architecture came under the influence of Moscow's canons, although local flavor is still evident in 16th-century monuments. Novgorod's subsequent development followed Russian traditions. Like other cities, it experienced redevelopment, leading to the absurd results of rebuilding old churches and new construction in all the prescribed styles.\n\nUnfortunately, most of the ancient monuments were destroyed during the Great Patriotic War, and in the first years of reconstruction, due to a shortage of building materials, many of the ruins of ancient buildings were dismantled for their bricks and ruins. Nevertheless, the city's restoration plan—designed by A.V. Shchusev, an expert in ancient Russian architecture—envisioned the creation of an urban environment in which ancient monuments and modern structures would harmoniously coexist. Although actual construction quickly exceeded the project's scope, overall, today's Novgorod has achieved the near-impossible: in the historic center, modern buildings modestly coexist with majestic churches standing proudly in open spaces, and the lack of residential buildings from the 18th and 19th centuries is more than compensated for by numerous cozy parks and urban alleys.",
