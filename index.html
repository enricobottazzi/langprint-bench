          "title": "Staraya Russa",
          "maxOccupiedPages": 3.142857142857143,
          "text": "Staraya Russa is located in the southern Ilmen region, 96 km from Novgorod by road and only 60 km as the crow flies. The city stands at the confluence of the Porus'ya River, also known as the Pererytitsa, with the Polist' River, which in turn is a tributary of the larger Lovat' River, which flows 15 km to the east. The city's inhabitants are called Rushans.\n\nThe origins of Staraya Russa are shrouded in legend. According to one, princes Sloven and Rus founded the cities of Slovensk (the future Novgorod) and Rusa near Lake Ilmen. Another legend holds that Sloven never existed, and that Lech and Czech, the founders of Poland and the Czech Republic, joined Rusa in his stead. Scholarly versions of the legends associate the name \"Staraya Russa\" (until the 16th century, simply \"Rusa\") with the Rus tribe, which either lived in the Ilmen region before the arrival of the Varangians, or were themselves Varangians—Rurik's retinue—who arrived in the then-nonexistent and nameless \"Rus.\" However, neither buildings nor even archaeological sites from the 9th century have been discovered in the territory of Staraya Russa, so the official date of the city's founding is considered to be 1167—the first mention in the chronicles, although the oldest finds date back to the mid-10th century, i.e., the semi-legendary pre-Christian period of Ancient Rus' history. Later, Staraya Russa became one of the most significant northwestern cities and a center of salt production, and the Lovat River served as a trade route \"from the Varangians to the Greeks.\"\n\nFrom its founding, Staraya Russa was under the influence of Novgorod, as evidenced by the birch bark letters, of which more than forty have been discovered here. From the late 15th century, the city fell under Moscow's control, without losing its importance as a trade and salt producer. At the turn of the 16th and 17th centuries, Staraya Russa suffered greatly during the Livonian War, and then during the Time of Troubles, when the Swedes held sway for ten years. A fire in 1763 destroyed all the wooden buildings, after which Staraya Russa was rebuilt with stone houses on a regular rectangular plan. Salt mining gradually declined, but the salt itself remained in demand in the form of mineral waters and the accompanying mud, which began to be used for therapeutic purposes. In 1828, what was arguably Russia's first balneological mud resort opened in Staraya Russa. Over the next 90 years, it was visited by Dobrolyubov, Gorky, the sons of Alexander II, and, of course, F.M. Dostoevsky, who wasn't actually recovering here, but rather seeking refuge from gambling addiction and St. Petersburg creditors. Staraya Russa suited him: there was some cultural life around the resort, but there wasn't much room for carousing. In Staraya Russa, the writer completed \"Demons\" and wrote the entirety of \"The Adolescent\" and \"The Brothers Karamazov.\" But don't look for rapturous descriptions of Staraya Russa (or anything else, for that matter) in Dostoevsky's books, for the name of Skotoprigonyevsk, where the novel's action unfolds, conceals Staraya Russa itself. Cattle were indeed driven here, but otherwise there was no trace of Dostoevsky: St. Petersburg society gathered in the summer, a railway had already been built through the city in 1878, and after the Revolution, a tramway was even launched, though it disappeared with the onset of the Great Patriotic War and was never restored.",

al for enjoying the scenery. Another way to get there independently is to take a minibus from the India Catalina Monument to Pasacaballos (1,300 pesos), then take the ferry across the Magdalena River (1,000 pesos), and finally a motorcycle taxi (10,000 pesos) to Playa Blanca on Isla Barú. The next morning, as we walked through the curtains, we were surprised to see painters hanging from a simple trapeze in front of us, like a circus act, without any safety equipment and at the considerable height of the 18th floor. We had breakfast at the all-you-can-eat buffet restaurant by the pool, which was full of excellent natural fruit juices, and then set off to visit the city.",

          "title": "The Relationship between Sports Culture and Mental Health among Wheelchair Basketball Players",
          "maxOccupiedPages": 4.190476190476191,
          "text": "Wheelchair basketball is a complex activity with numerous effects on the player's body and involves many relationships, such as those with teammates and coaches. Therefore, it is essential to understand the psychological characteristics and details of each player, as this provides them with many psychological and social benefits (Drinkwater et al., 2008).\n\nWheelchair basketball is considered one of the most appealing sports, regardless of the cause of the disability. It is linked to cognitive abilities, which are crucial for achieving positive results. It contributes to improving communication skills and interpersonal relationships, as well as enhancing the psychological and social characteristics of these players (Paunic, 2007).\n\nTherefore, engaging in sports activities of all kinds has a positive impact on physical and social well-being, in addition to the psychological and social benefits. It contributes to increasing the ability of these players to cope with various life pressures and reduces levels of depression and anxiety (Miyahara et al., 2008). The results of a study by Martin (2008) indicate that wheelchair basketball players are able to overcome painful thoughts resulting from their disability.\n\nWith the multifaceted nature of sports culture, encompassing the cognitive domain (which includes knowledge of rules, regulations, and game plans), the social domain (which aims to nurture and educate individuals in sports and cultivate socially and athletically acceptable behavior), the educational domain (which aims to prepare and guide individuals physically, psychologically, and morally), and finally, the health domain (which aims to develop an individual's ability to care for their body and meet its various needs) (Shehadeh, 2009), we can see that sports culture includes many physical, psychological, ethical, and social aspects. It strives to cultivate the individual physically, psychologically, and behaviorally, and influences the formation of both individual and group character (Aweys & Al-Hilali, 2005).\n\nFurthermore, sports culture includes many elements such as healthy behaviors, sports habits and values, and information and knowledge related to sports activities (Al-Zyod, 2013). Shafei (2001) points out that sports culture contributes to increasing an athlete's sports knowledge base, including rules and regulations, which in turn contributes to a better understanding and appreciation of players. It is part of the general culture and is considered an indicator of a society's progress; therefore, athletes must be sufficiently familiar with sports culture due to its effective role in disseminating and instilling the principles of sportsmanship.\n\nFrom the foregoing, we find that mental health is linked to sports culture so that athletes can achieve harmony with their environment, face various challenges, and adapt to life's demands. Hassan (2001) indicates that manifestations of mental health include an individual's ability to balance their desires and goals, establish ideal and acceptable relationships, cope with frustration, and experience tranquility. This leads to self-harmony through balancing desires, motives, and goals, as well as social harmony through the ability to establish acceptable social relationships. Studies indicate that these individuals have a lower level of health than normal individuals and suffer from conditions that hinder their participation in sports activities compared to others (Altman & Bernstein, 2008). These studies support the need for these individuals to understand their motivations and interests to help them integrate into society (Deci & Ryan, 2002).\n\nResearchers believe that sports culture influences the formation of an athlete’s personality, helps improve their social interaction, and contributes to increasing their experience and shaping their acceptable social behavior. All of this contributes to improving their mental health by developing their ability to establish acceptable social relationships and improving their ability to deal with various life pressures.",

          "title": "The Contribution of Mental Toughness to Competitive Behavior among Swimmers",
          "maxOccupiedPages": 5.666666666666667,
          "text": "Sports training relies on a set of interconnected elements. Understanding and implementing these interconnected elements is fundamental to achieving optimal results. Success in any sport requires a combination of essential elements, including physical and technical skills, tactical strategies, and psychological preparedness. Therefore, comprehensive training necessitates considering all these elements. A successful athlete possesses a well-integrated combination of effective strategies, advanced skills, psychological readiness, and physical capabilities.\n\nCrust and Clough (2005) indicated that sports psychology is a crucial field that has contributed to athletes reaching their full potential. Psychological preparation helps athletes enhance their abilities and overcome challenges encountered during competition.\n\nChristiane and Sophie (2014) argue that psychological skills represent a crucial dimension in athlete preparation, playing a fundamental role in performance development. They are now considered one of the variables that must be addressed alongside physical, technical, and tactical requirements. High-level athletes tend to be remarkably similar in terms of physical, technical, and tactical abilities.\n\nKishore (2017) emphasizes that maintaining optimal performance under intense competitive pressure requires both skill and mental agility. Inconsistent performance during competitions is primarily attributed to psychological factors, foremost among them being mental toughness.\n\nShamo'on (2001) argues that mental toughness plays a crucial role in maintaining optimal performance and aims to build mental and emotional strength. Training in mental toughness is both an art and a science, enhancing an athlete's ability to cope with and manage all types of physical, mental, and emotional pressures, leading to greater competitiveness. This, in turn, improves athletic skill development and reduces the risk of injuries and emotional withdrawal.\n\nAdas and Qtame (2000) point out that competition represents the highest stage in the development of athletic activity. It allows everyone to observe the strengths and weaknesses of athletes in terms of physical, technical, and psychological aspects, and it cultivates and refines the athlete's physical attributes.\n\nOmran (2016) argues that competitive behavior is purposeful and achievement-oriented, with motivations differing in type and intensity from those of training. The state of readiness in competition, the presence of the opponent, the judges, the audience, and other variables of the competitive situation stimulate an athlete's motivation to achieve in a way that differs from the motivations induced in training.\n\nAlhmdani (2016) points out that many factors influence swimmers during performance, which can be considered competitive behavior. These factors, therefore, cause individual differences in swimmer behavior in competitive situations. A large number of swimmers can be observed striving to win during races. Cowden (2017) believes that athletic excellence depends on the extent to which athletes utilize their psychological capabilities as much as their physical ones. Psychological capabilities help individuals channel their physical energy to achieve maximum and optimal athletic performance, and these capabilities can be developed through specialized training programs, namely psychological skills training programs.\n\nJones, Hanton, and Connaughton (2002) argue that mental toughness is the highest psychological level attainable, granting athletes greater endurance compared to their competitors during competitions. This is achieved by developing focus, confidence, and resilience under pressure, which influences athletic behavior. Saleh and Hassan (2012) point out that competitive behavior is an activity in which athletes strive to win. This is based not only on the athlete's intrinsic motivation but also on external influences. Therefore, competitive behavior, especially in individual sports, is distinguished from other human activities by the clear and direct impact of winning and losing, or success and failure, and the behavioral aspects associated with each. Competitive behavior requires athletes to mobilize their maximum physical and mental capabilities to achieve the best possible performance, which contributes to the development and enhancement of psychological traits, particularly moral and volitional traits.\n\nThrough his work in the field of teaching and training swimming, and through his monitoring of swimmers' levels, the researcher observed that some swimmers experience a decline in their performance in certain competitions despite their adherence to their training programs. Studies by Omran (2016), Kamal (2015), Alfartosse (2014), and Saleh & Hassan (2012) indicate that competitive behavior plays a role in influencing athletic achievement. Furthermore, the mental toughness possessed by the athlete plays a role in determining psychological aspects and the ability to withstand the pressures that accompany competition, as noted in studies by Cowden (2017), Kishore (2017), Ibrahim (2015), Mehrparvar & Soltani (2013), Hassan (2010), and Crust & Clough. (2005) Does the level of mental toughness possessed by Jordanian swimmers play a role in their competitive behavior during competitions and championships?",

          "text": "The \"2006 Chang Hwa Bank Taipei 101 International Mountain Climbing Race,\" hosted by Taipei 101 and sponsored by Chang Hwa Bank, officially kicked off at 8:00 AM today. Following the positive reception of last year's event, in addition to the standard elite and self-challenge categories, the organizers have officially included the \"Corporate Team Category,\" which was piloted last year, as a formal competition category to encourage corporate participation and enhance employee cohesion.\n\nAs is customary, this year's competition is limited to 101 elite athletes, 1001 individual participants, and 10 corporate teams. However, due to overwhelming participation from corporate teams, additional slots were added, resulting in 11 corporate teams and 26 participating teams. Chang Hwa Bank, the title sponsor, submitted 16 teams to celebrate its 101st anniversary, making them the most favored team in the competition.\n\nLast year's champions, Paul Crake and Andrea Mayr, lived up to expectations, retaining their titles in the men's and women's elite competitions with times of 10:31.57 and 13:28.70 respectively.\n\nMeanwhile, last year's Taiwan champion, Chen Chung-jen, who was also fifth overall in the men's division, had a slightly off year, narrowly missing the podium. He finished eighth with a time of 12:46.76, likely due to his poor performance, and left before the awards ceremony. His teammate, Chen Fu-tsai, improved significantly, finishing sixth in the men's elite competition with a time of 12:24.81, making him the best-performing athlete from Taiwan this year.\n\nThe competition in the women's elite competition was even fiercer. This year, Taiwan's home team athletes made significant strides, demonstrating their strength and maintaining their home advantage with excellent performances. Li Xiaoyu finished second overall with a time of 14 minutes and 51.96 seconds, making her the best-performing female runner from Taiwan. Lin Fangzhen, Zhang Meilian, and Yun Chunping finished fifth, sixth, and eighth respectively. Taiwanese female runners comprised half of the top eight, making them the best performing group in the elite competition.\n\nIn the self-challenge category, besides Xue Qingguang (who ran backwards), Zhan Junzhi (a Taiwanese Olympic volunteer), Peng Hongnian (the oldest runner), and Zhang Wenyan (a visually impaired runner), the Wrigley's chewing gum group also participated. Former and current Taipei City Deputy Mayors Ye Jinchuan and Jin Pucong also participated in the elite category, serving as a warm-up for the Taipei International Marathon half marathon at the end of the year.\n\nMany elite runners and challenge group participants commented that the ventilation at Taipei 101 still has room for improvement, and the ventilation in the rest and adjustment areas could theoretically be further enhanced. In addition, Extraordinary Television also stated that the Taipei 101 International Climbing Race, which has reached international competitions, should also conduct doping tests on all elite athletes (regardless of whether they have won awards) in order to maintain the principle of fairness.",

          "text": "Marburg (Germany), June 9, 2008 – The match between the German national blind football team and the first German Blind Football Bundesliga champions from Marburg ended 0-0 after a high-class game. SSG Marburg managed to snatch a draw from the overwhelming favorites with a cohesive team performance, proving themselves at least their equals. The spectators in the arena and those listening to the live stream were treated to a high-level match with numerous scoring opportunities for both sides.\n\nAt 11:00 a.m., the refereeing duo of Mankel and Lürding kicked off the game between the German national blind football team and the hosts, SSG Marburg. National coach Pfisterer had instructed his team to play offensively from the outset: As a result, the national team frequently came dangerously close to the Marburg goal, guarded by Markus Moj, in the opening minutes. Franzka, Fangmann, and Schwarze applied considerable pressure, initially causing problems for the Marburg defense led by Beck and Warzecha. After about five minutes, Fangmann had a good scoring opportunity for the visitors, but Moj made the save. This seemed to awaken Marburg's attack, and Hoß and especially Pektas began putting pressure on the national team's defense, though without creating any clear-cut chances. With the introduction of Koparan for Marburg, the game became an open, back-and-forth affair with some attractive attacking moves from both sides. However, both defenses remained solid, preventing any further clear scoring opportunities.\n\nIn the second half, it was Marburg's new attacking substitute, Felix Johnson, who came into his own. He generated a lot of pressure on his side of the attack, and the national team's defense could hardly contain him. Fueled by this, Marburg's forwards put a lot of pressure on national goalkeeper Müller's goal. A shot from Johnson was only parried by Markus Moj with a lightning-fast reaction. The national team only occasionally threatened the Marburg goal, but the hosts' defense stood firm, preventing any truly dangerous situations for Moj. Marburg's strong attacking play drew several fouls from the national team. Johnson had three opportunities to put his team ahead with a penalty kick, but apart from hitting the post, nothing came of it. The national team was also awarded a penalty kick, but they too failed to convert it.",

          "text": "The start is still in Bruges, West Flanders, while the finish is not in Meerbeke, where it was from 1973 to 2011, but in Oudenaarde, East Flanders, after 256.9 kilometers of racing. The final section of the route has been modified: the main change is the absence of the famous—and now traditional, having been climbed continuously since 1969—Grammont Wall.\n\nTo make the race more spectacular, the organizers have decided to transform the final 80 kilometers into a sort of circuit, with Oude Kwaremont (2,200 meters at an average gradient of 4.2%) and Paterberg (400 meters at an average gradient of 12.5%) to be tackled three times. There are a total of sixteen walls in this edition of the Ronde van Vlaanderen, 10 cobblestones and six asphalt. The Taaienberg opens the race after 109.3 kilometers (average gradients of 6.6% and maximum gradients of 10%), while the final climb is the third Paterbeg, 13.3 kilometers from the finish. Also tackling the Molenberg (7% average gradient) are the 131.3-kilometer-long (131.3-kilometer-long) and, with 70 kilometers to go, the extremely tough Koppenberg, 600 meters at 11.6% with peaks of 22%. There are eight flat cobblestone sections, all in the central section of the race.\n\nThe race, the eighth event on the 2012 UCI World Tour calendar and the second Monument Classic of the season, features 199 professional cyclists representing twenty-five teams. All eighteen UCI World Tour teams are competing, as well as seven UCI Professional Continental teams invited by the organizers via wildcards: Accent.jobs-Willems Veranda's, Argos-Shimano, Farnese Vini-Selle Italia, Landbouwkrediet-Euphony, Team Europcar, Team NetApp, and Topsport Vlaanderen-Mercator.\n\nThe 2011 winner, Nick Nuyens, is not competing due to a hip fracture sustained at Paris-Nice; interestingly, the number 1 bib number is worn by Matteo Tosatto. Among the big names present at the start are the Belgians Tom Boonen, Björn Leukemans, Sep Vanmarcke and Philippe Gilbert, the Norwegian Edvald Boasson Hagen, the Swiss Fabian Cancellara, the Italians Alessandro Ballan (winner of the 2007 Tour of Flanders) and Filippo Pozzato, the Slovakian Peter Sagan, the Spaniards Óscar Freire and Juan Antonio Flecha, the Frenchman Sylvain Chavanel and the Dane Matti Breschel.",

          "maxOccupiedPages": 3.0952380952380953,
          "text": "The first two hours of the race were very fast, averaging 45 km/h; some initial breakaway attempts were unsuccessful. There were several crashes, one of which forced Russian Vladimir Gusev (Katusha) to retire. Just before the first cobbled sector, between Troisvilles and Inchy at kilometer 98, eight riders finally managed to break away: Frenchmen David Boucher (Omega Pharma-Lotto), Jimmy Engoulvent (Saur-Sojasun), and David Veilleux (Team Europcar), Swiss national champion Martin Elmiger (AG2R), Dutchman Maarten Tjallingii (Rabobank), Australian Mitchell Docker (Skil-Shimano), Portuguese Nelson Oliveira (Team Radioshack), and German Timon Seubert (Team Netapp), all second-place riders.\n\nThe escapees built up a maximum lead of 1:25, then, around the 140th kilometer of the race, they were caught by three other cyclists: German André Greipel (Omega Pharma-Lotto), Dutchman Koen de Kort (Skil-Shimano), and Slovenian Gorazd Štangelj (Astana). Meanwhile, Oliveira broke away: ten riders remained in front – reaching a lead of 2:40 – while another small group of four riders chased behind (they were absorbed by the peloton during the passage through the Arenberg Forest). As they approached the famous cobbled section, the group's speed increased, causing several crashes, involving Roger Hammond and Heinrich Haussler (Garmin-Cervélo).\n\nThe first dramatic turns of events came right at the 2,400-meter mark of the Trouée d'Arenberg (86 meters to go): Britain's Geraint Thomas (Sky) punctured, then one of the top favorites, Belgian Tom Boonen (Quickstep), winner of the 2005, 2008, and 2009 editions, suffered mechanical problems and was forced to wait for the team car; he lost more than a minute, as well as a good part of his hopes of matching Roger De Vlaeminck's record with a fourth Roubaix victory. Outside Arenberg, seven more riders set out in pursuit of the ten escapees: Dutchman Lars Boom (Rabobank), Belgians Johan Vansummeren (Garmin-Cervélo) and Jürgen Roelandts (Omega Pharma-Lotto), Australians Baden Cooke (Saxo Bank-Sungard) and Mathew Hayman (Sky), Danish rider Lars Bak (HTC-Highroad), Italian Manuel Quinziato (BMC), and Frenchman Fréderic Guesdon (FDJ). Meanwhile, some potential frontrunners remain behind, including Belgian Björn Leukemans (Vacansoleil-DCM), who crashed, and Frenchman Sylvain Chavanel (Quickstep), second in this year's Tour of Flanders, who suffered a puncture.\n\nMore bad luck for Quickstep: Boonen, who was riding a minute behind the peloton, crashed in the Sars-et-Rosières sector, 72 minutes to go. Then Chavanel, who had managed to rejoin the peloton, crashed and was dropped. It should be noted that in the following minutes, Peter Sagan, Filippo Pozzato, and Leukemans again also suffered crashes. With 60 minutes to go, 21 riders are in the lead: Germans John Degenkolb (HTC-Highroad) and Gabriel Rasch (Garmin-Cervélo), Swiss Grégory Rast (Radioshack), and Dutchman Tom Leezer (Rabobank) also managed to rejoin. Behind them, the top riders, including Fabian Cancellara (Leopard-Trek), Thor Hushovd (Garmin-Cervélo), Juan Antonio Flecha (Sky), and Alessandro Ballan (BMC), are trailing at 1:10.",

          "title": "Special Feature 1: Building a Sporting Nation — Ministry of Education, Culture, Sports, Science and Technology",
          "maxOccupiedPages": 4.0,
          "text": "Comprehensive community sports clubs are community-based sports centers operated independently and proactively by local residents, conducting daily activities at nearby schools and public facilities. They contribute to the realization of a lifelong sports society and are expected to have various benefits, including providing sports opportunities for local children, fostering family interaction, promoting healthy youth development through intergenerational exchange, and maintaining and improving the health of local residents. The Ministry of Education, Culture, Sports, Science and Technology has supported the establishment of comprehensive community sports clubs through on-site guidance by club development advisors and the provision of information on successful establishment cases, promoting their nationwide expansion. As a result of these efforts, the number of comprehensive community sports clubs increased 5.8 times over the eight years from FY2002 to FY2010, and the number of municipalities with comprehensive community sports clubs increased 2.9 times. Furthermore, the club establishment rate (the ratio of municipalities with comprehensive community sports clubs to the total number of municipalities) reached 71.4 percent in FY2010 (Figure 1-1-20).\n\nOn the other hand, according to the \"FY2010 Survey Results on the Actual Situation of Comprehensive Community Sports Clubs,\" the primary challenge for comprehensive community sports clubs is \"securing members\" (Figure 1-1-21). To secure and retain members, it is considered key for comprehensive community sports clubs to provide attractive programs that reflect the needs of local residents. Therefore, the Ministry of Education, Culture, Sports, Science and Technology plans to establish a system for providing attractive sports services at comprehensive community sports clubs, starting in FY2011. This includes assigning excellent instructors, such as retired top athletes, to core clubs and conducting itinerant instruction for multiple surrounding comprehensive community sports clubs (see Section 3(1)1.(a)).\n\nFurthermore, looking at the self-financing rates of comprehensive community sports clubs, approximately half of the clubs have a self-financing rate of 50 percent or less (Figure 1-1-22). As the \"FY2010 Survey Results on the Actual Situation of Comprehensive Community Sports Clubs\" also lists \"securing funding\" as a major challenge, securing funding commensurate with activities is necessary for comprehensive community sports clubs to operate sustainably. To achieve this, it is crucial not only to expand membership fee revenue through securing members, but also to accept donations from local businesses and shops. Therefore, the Ministry of Education, Culture, Sports, Science and Technology (MEXT) will promote initiatives to enable many comprehensive community sports clubs to effectively utilize the donation tax system (certified non-profit organization system) and accept a wide range of donations.\n\nThrough these initiatives, MEXT aims to support the independence of comprehensive community sports clubs facing challenges such as securing members, instructors, and financial resources. As stated in the \"New Public\" Declaration (June 4, 2010, \"New Public\" Roundtable Conference), MEXT supports these clubs in proactively shaping the local sports environment as \"NPO-type community sports clubs independently operated through membership fees and donations contributed by local residents,\" while also considering the resolution of local issues (such as school-community cooperation and childcare support).",

          "title": "Basic Plan for Sport: The Current State and Challenges of School Physical Education",
          "maxOccupiedPages": 2.5714285714285716,
          "text": "Physical education activities in schools form the foundation for a fulfilling lifelong sports life. The revised curriculum guidelines of 2008 and 2009 aimed to systematize and clarify instructional content, taking into account developmental stages from elementary to high school. However, in elementary schools, with the aging of teachers, most teachers teach all subjects, leading to concerns among teachers about physical education classes and insufficient implementation of specialized instruction. In junior high schools, with the mandatory inclusion of martial arts, efforts are needed to enhance safe and smooth instruction. In high schools, there is a need to improve instruction that enables students to engage in a continuous sports life throughout their lives. Furthermore, junior and senior high schools are required to help students understand the significance of sports, such as the important role of international sports competitions like the Olympics in international goodwill and world peace. While promoting the placement of specialist teachers and local sports instructors with expertise is effective in improving the instructional system, overall, their utilization is not sufficient. Regarding school sports clubs, for example, the participation rate in junior high schools has remained relatively stable. However, the declining birthrate has led to a decrease in the number of students participating in sports clubs, particularly in team sports, which is causing difficulties in these activities. There are also challenges in securing sports instructors to reduce the burden on supervising teachers, and further ingenuity is needed in their format and operation. Furthermore, some sports are difficult for girls to participate in, and there is a need to improve opportunities for participation. In addition, serious accidents are reported every year in school physical education activities, such as physical education classes and sports club activities, and further consideration and ingenuity in safety are needed. Regarding physical education activities for children and students with disabilities, while measures have been taken to meet the educational needs of the children and students, the Basic Sports Act also requires consideration according to the type and degree of disability. Regarding school physical education facilities (*1), the seismic resistance rate has not yet reached 100%, and although the rate of grassing of grounds is increasing, it remains at a low level, and improving these facilities is a challenge. Furthermore, with the mandatory inclusion of martial arts in the curriculum following the revision of the national curriculum guidelines, promoting the development of martial arts training facilities has become a challenge.",

          "title": "Grassroots Sport and Its Role in the Socialization of Young People in Contemporary Russia",
          "maxOccupiedPages": 3.9047619047619047,
          "text": "The experience of developed capitalist countries around the world demonstrates the importance of mass sports or sports for all (the terms \"mass sports\" and \"sport for all\" are currently used synonymously in many countries). However, the organization, management, and financing of mass sports vary widely in these countries. While the United States, for example, is characterized by a lack of direct support for sports from the state budget, and the physical education and sports movement there is largely financed by the private sector, stimulated by a large number of tax breaks and incentives, Western European countries, by contrast, have a mixed funding system for mass sports, with the state budget predominating. In developed capitalist countries, the involvement of citizens of various age groups, including young people, is achieved primarily through a system of sports clubs, operating both independently and within physical education and sports organizations, which presupposes the development of a commercial sector in physical education and mass sports. It should be noted that the European system of organizing mass sports, despite all its undeniable advantages, also has certain shortcomings. Thus, modern Western researchers B. Vanroysel and M. Tax, having analyzed the results of the development of \"sport for all\" in the countries of the European Union over the past several decades, came to the following conclusions: on the one hand, according to the data of these researchers, thanks to sport for all, the number of people involved in sports has increased, however, on the other hand, the proportion of young people and the elderly among those involved is relatively small. Despite the support of mass sports from sports organizations, including clubs and federations, in the opinion of B. Vanroysel and M. Tax, this support is generally quite weak. Along with the aforementioned shortcomings, the system of organizing mass sports in European countries is characterized by other negative features: despite the democratization of sport, opportunities for participation in the sports movement for representatives of various socio-demographic groups, ethnic and other minorities remain uneven, local traditional sports and folk games feel quite disadvantaged. In addition, mass sports and its legislative base are becoming increasingly dependent on the economy of the countries in question [3, p. 283]. Clearly, these specific features must be taken into account when organizing a mass sports system in modern Russia. Currently, as shown by the results of specialized studies, the number of citizens in the Russian Federation who regularly engage in physical education and sports constitutes 22.5% of the country's total population (it should be noted that over the past few years, the number of people involved in mass sports has been growing: from 2008 to 2012, for example, it increased by 9.7 million people and currently stands at 32.2 million). Statistics also indicate that the most physically active groups of the Russian population are children and young people under 30: in the group of people aged 15 to 29, in particular, the share of young people involved in physical education and sports is 13.3 million people, or 43.4% of the total population in this age group. At the same time, it's important to consider that the youth's activity in question is largely due to the fact that a significant portion of them are students at educational institutions where physical education is a mandatory subject within existing curricula. The number of individuals systematically engaged in physical education and sports declines sharply as they age: after completing school and university, motivation to engage in physical education and sports declines (among employed individuals, the overwhelming majority, up to 90%, no longer participate systematically in physical education and sports) [4].",

          "title": "The State of Grassroots Sport in the Regions of the Central Federal District",
          "maxOccupiedPages": 2.3333333333333335,
          "text": "In the context of socio-economic transformations in Russia, issues of strengthening the physical and spiritual health of people, the formation of a healthy lifestyle are of particular importance, therefore the development of physical culture and sports is a relevant area of social policy of the state. Despite this, in the regions of the Central Federal District, there is an uneven trend in attracting the population to sports and physical education. The development of this industry in the Kursk region is due to the promotion of a healthy lifestyle and the improvement of sports infrastructure. At the same time, the main problem in attracting young people to physical education and health activities is the lack of material and information resources, the deficit of which arises from insufficient financial support from the regional budget. According to A.A. Sakharova [1], physical culture and sports are an indicator that ensures the physical and moral health of the population, supporting the ability to work and competitiveness of an individual in the labor market. P.V. Vavilov [2] agrees with this position, arguing that the physical and social well-being of the population as a whole depends on an understanding of the importance of a healthy lifestyle, as well as on the development of mass sports in the regions. Therefore, the importance of promoting a healthy lifestyle is growing, which, according to O.P. Golovchenko [3], is a catalyst for increasing the number of people involved in physical education and sports. The problem of popularization, according to E.V. Kuznetsova [4], is associated with the lack of social advertising aimed at involving young people in physical education and sports, as well as with insignificant attention in the regions to the development of mass and street sports, and a minimal number of city holidays attracting a large number of young people. At the same time, P.A. Ganin [5] mentions that many sports stars take part in various advertising campaigns that are a negative example of healthy eating and a healthy lifestyle (\"Lay's\", \"Pepsi\"), which has a detrimental effect on the perception of young people about sports culture. Therefore, there is a need to raise the prestige of sports, since thanks to it, as V.V. notes, Popova [6], many socially significant problems are being solved: reproduction of the labor force, deepening intra-group and inter-group integration, socialization, as well as raising a healthy and physically strong generation.",

          "title": "Deportivo Cali Celebrates Its First Hundred Years",

          "text": "November 23, 2012, Santiago de Cali, Colombia — Deportivo Cali, founded on November 23, 1912, celebrated its centennial, becoming the first team in Colombia to reach this milestone. Various activities were held in the capital of Valle del Cauca to commemorate the occasion.\n\nA commemorative caravan had been announced several days prior, scheduled to depart from the Plazoleta de San Francisco, where a religious ceremony would take place before proceeding to the team's administrative headquarters, Alex Gorayeb, on Avenida Vásquez Cobo, where the remaining activities would be held.\n\nHowever, due to the announcement of Vice President Angelino Garzón's arrival in the city, the centennial celebrations had to be rescheduled. On the 23rd, news arrived that DAGMA (the Administrative Department of Environmental Management) had denied permission to use the park, seemingly canceling the entire nighttime itinerary. However, at the last minute, the event was reorganized to take place at the Orquideorama.\n\nStarting at 4:00 pm, fans gathered at the Monument to Solidarity, from where they marched towards the team's headquarters. At 6:00 pm, the scheduled march began, ultimately heading to the Orquideorama, where various musical and culinary activities took place. During the gathering and march, fireworks were set off, supporters chanted, and banners alluding to the celebration were displayed. Attendance at the Orquideorama is estimated at 11,000 people, while the march attendance is estimated to be higher due to the fact that many Verdiblanco fans were unable to enter the venue because of space limitations.\n\nAt the team's headquarters, a commemorative prayer was held, attended by directors, players, former stars, members, and fans. Following the prayer, a toast was offered, and a slideshow highlighting the team's key achievements over the past one hundred years was shown. Afterward, the sky lit up with fireworks launched from San Antonio and Santa Mónica Hill. Following the formalities, the commemorative birthday cake was cut, and musical performances were given by the salsa group Azul Profundo and Julio Martínez, singer of the official centennial song, a version of the traditional \"Pachito E'che.\" The evening then proceeded as usual.",

          "maxOccupiedPages": 3.5714285714285716,
          "text": "The ongoing UMISSETA championship in Mtwara has reached the semi-finals for the boys' soccer category, where in the games that ended this evening, boys' soccer teams from Lindi, Ruvuma, Mwanza and Songwe regions have successfully entered the semi-finals after defeating their opponents including defending champion Tanga, which was played by Lindi.\n\nWith these results, the boys' soccer team from Lindi region will meet Ruvuma in the first semi-final, which is expected to be played tomorrow at 8 pm, followed by the second semi-final that will bring together the Mwanza giants who will compete with the tough Songwe team.\n\nThe first team to enter the semi-finals was the team from Lindi region, which eliminated the Tanga region team on penalties 3 to 1 after a scoreless draw after ninety minutes of play.\n\nAnother quarter-final clash involved teams from Ruvuma and Kilimanjaro regions where the Ruvuma regional football team, which is made up of 8 players from the Ruhuwiko secondary school sports center located on the outskirts of Songea Municipality, defeated the Kilimanjaro team by two goals to zero.\n\nIn the matches that ended this evening, the Songwe and Manyara teams and the Mbeya and Mwanza teams fought hard in other quarter-final matches where Songwe defeated Manyara by one goal to zero and Mwanza defeated Mbeya by 5 goals to 3 on penalties after the teams ended in a goalless draw within 90 minutes of the game.\n\nHowever, Mwanza had every reason to win the game as in the 72nd minute they missed an open goal after their penalty was saved by Mbeya goalkeeper Gerald Hatson and saved by the team's defenders.\n\nImmediately after the game, Mwanza Coach Mwalimu Tito Mkami said that his boys fought hard but praised the Mbeya team for the way it bothered them and admitted that the team was tough because it gave his players a hard time throughout the game.\n\nIn addition, Mwalimu Mkami called on the Football Association in Tanzania (TFF) not to include other competitions when the championship organized by the UMISSETA and UMITASHUMTA governments is held so as not to cause this championship to lack important players for their teams.\n\nAnd the captain of the Mwanza football team Kimwaga Kalunga who is the only student playing for the team from the Alliance special football school who said that they are not afraid of the Songwe team but respect it because all the teams that entered that stage are tough.\n\nEarly tomorrow morning the semi-final games for the girls' football will be played at the Mtwara Teachers' College grounds where the first game will bring together the Dar es Salaam giants who will sweat and the team from Iringa region, and the other game will bring together the Mwanza giants who will compete with Ruvuma.\n\nIn the handball quarter-final results of the game played this evening show that the Geita and Unguja boys teams have successfully qualified for the semi-finals and are scheduled to play tomorrow, while the other semi-final will bring together Tanga and Morogoro.\n\nIn the girls' handball, the qualified teams are Unguja who will play tomorrow with Morogoro and Songwe who will play with Mbeya.\n\nAnother game in which the qualified teams have been announced is netball where the teams of Morogoro, Tanga, Dar es Salaam and Mwanza have qualified for the stage where the games will be played tomorrow with Tanga meeting with Mwanza and Morogoro playing with Dar es Salaam.\n\nIn the boys' basketball game, the teams that qualified for the semi-finals are Pwani, Unguja, Tanga and Shinyanga where according to the schedule released Pwani will play with Unguja and Tanga will compete with Shinyanga.\n\nIn the girls' basketball, Kilimanjaro will face Mwanza and Morogoro will play with their neighbors Dar es Salaam.",

          "text": "On Friday, we found out that the economy created another 173,000 jobs in August. Over the past five and a half years, our businesses have created 13.1 million new jobs in total – the longest streak of job creation on record. The unemployment rate dropped to 5.1%, the lowest it’s been in seven years. The American auto industry is on track to sell more cars and trucks this year than it has in more than a decade. Sixteen million Americans have gained the security of health insurance. Seventeen states and about 30 cities and counties have raised the minimum wage. And we’ve proposed extending overtime protections to as many as five million Americans. All of that is progress. This month, Congress has an opportunity to continue that progress. As always, the deadline for Congress to pass a budget is the end of September.",

          "idx": 122,
          "title": "Remarks by the President on Raising the Minimum Wage",
          "maxOccupiedPages": 1.7619047619047619,
          "text": "We know these Americans. We depend on them. The workers who’d benefit from a minimum wage increase often work full-time, often in physically demanding jobs. They average 35 years of age. Most low-paying jobs are held by women. But because Republicans in Congress said “no” to even allowing a vote on the floor of the Senate, these folks are going to have to wait for the raise they deserve.\n\nNow the good news is outside of Washington folks aren’t waiting. While Republicans have been deciding whether to even allow a minimum wage bill to even come up for a vote, you’ve seen 10 states and the District of Columbia go ahead and raise theirs. (Applause.) Yesterday, the Hawaii legislature voted to raise their minimum wage to $10.10 an hour. Maryland did the same thing earlier this month -– and I know we’ve got some Maryland state legislators here today. Thanks for the good work. (Applause.)\n\nSo the actions that have been taken in just four states -- Maryland, Connecticut, Minnesota, and Hawaii -– means that over a million workers will see a raise. What’s more, we’ve seen big companies like The Gap, and small businesses -- from a pizza joint in St. Louis to an ice cream parlor in Florida -- increasingly choosing to raise wages for their employees because they know it’s good business. They know that it means employees are more likely to stay on the job, less turnover. It means that they’re going to be more productive, and customers see the difference. That’s one of the reasons I issued an executive order requiring employees on new federal contracts to be paid a fair wage of at least $10.10 an hour. (Applause.)",

          "idx": 123,
          "title": "Three Reasons to Celebrate the Minimum Wage — and the Need to Extend Its Coverage to Private-Sector Workers",
          "maxOccupiedPages": 1.7619047619047619,
          "text": "A minimum wage is the most suitable tool in Egypt for eradicating poverty, and it also helps to improve the significant income inequality among Egyptians. The share of wages in national income has declined over the past quarter-century. Conversely, the share of profits (the income of business owners and companies) has increased, as has the share of rent-seekers (landowners, property owners, and holders of government debt). These distortions in the distribution of the benefits of growth create a constraint on opportunities to raise growth rates. The inability of large segments of the poor to access quality education, adequate food, and healthcare means a lack of social mobility and a shortage of a skilled and healthy workforce capable of developing the economy.\n\nWhat are the risks of this measure and other social measures on the budget deficit?\n\nThere is no negative impact on the budget deficit. Egypt intends to reduce the budget deficit to less than 8% during the coming year, in which this package is implemented—a level that can be described as a benign deficit. The planned package is designed to compensate for the damage and address income inequality between different segments of society. In return, the government is expected to increase its revenue from the wealthier and more consuming income brackets through taxation. In public finance theory, this is called the distributive role of the budget. This is instead of increasing the budget deficit to support the wealthy, which is the malignant deficit that Egypt has suffered from for many years, through unfair regressive taxes and generous subsidies that go to inefficient government institutions as well as private companies, and without merit.",
          "occupiedPages": 1.4285714285714286,
          "originalEnglish": false

          "idx": 124,
          "title": "Respond with What Is Better: The Minimum Wage Returns",
          "maxOccupiedPages": 2.761904761904762,
          "text": "The share of wage earners has been steadily declining globally in recent decades, while the share of profit reapers has increased. In Egypt, the absence of collective bargaining, trade union freedom, and necessary studies, coupled with the lack of a national minimum wage, has become a source of concern for international financial institutions that lend to us, such as the World Bank. The Bank notes that for every ten Egyptian pounds generated by the Egyptian economy, 7.5% goes to a small minority of wealthy individuals and capital owners, while only 2.5% goes to the majority of wage earners. Furthermore, senior public and private sector employees receive the lion's share of that meager portion.\n\nIn Egypt, the wealthiest 1% are estimated to hold 18% of total income. This means that 900,000 individuals alone possess a share of the national income equivalent to the combined income of 45 million citizens, according to a study conducted by Thomas Piketty and his research team on Egypt and several other Middle Eastern countries.\n\nAs in South Africa, the phenomenon of the working poor is widespread in Egypt—those who toil and work, but whose wages do not allow them to escape the poverty line. The World Bank estimated in 2009 that the working poor comprised half of Egypt's workforce. This percentage appears to have increased after the January Revolution, according to data published on the website of the Central Agency for Public Mobilization and Statistics. This situation can be explained by the absence of a national minimum wage. In 2011, a minimum wage was established, but it benefited only a small minority of government employees (only 200,000 government employees benefited from the minimum wage introduced as a result of the January Revolution).\n\nEgypt is one of the few countries in the world that does not have a national minimum wage. Most of the working poor are concentrated in the informal sector, followed by the private sector (together, they constitute more than 85% of the working poor), according to official data from 2012–2013. The public sector is not immune to poverty; those who did not qualify for the minimum wage established by President Adly Mansour in 2013 remain below the poverty line.\n\nTherefore, given the prevalence of this phenomenon, perhaps the most effective approach to eradicating poverty in Egypt, as in South Africa, is to establish a unified minimum wage across all sectors, enforced by national law and periodically adjusted according to a socially acceptable mechanism.",

          "idx": 125,
          "title": "The 2007 Taiwan Brand Trends Forum: Branding Experts Urge Government and Business to Heed the Smiling Curve Theory",
          "maxOccupiedPages": 3.1904761904761907,
          "text": "Concurrently with the formal merger of the Republic of China Self-Created Brands Association and the Taiwan Excellence Manufacturers Association into the \"Taiwan Excellence Brands Association,\" the \"Taiwan Brand Trends Forum\" held today (20th) at the Leofoo Palace in Taipei invited brand experts from the Ministry of Economic Affairs and the business community to share Taiwan's brand marketing experience under the theme of \"Winning the Global Economy with Taiwanese Brands,\" encouraging Taiwanese brands to market internationally through innovation.\n\nAt the opening ceremony, Hsieh Tzu-jen, the newly appointed chairman of the Taiwan Excellence Brands Association, stated clearly: \"Made in Taiwan does not represent 'cheap,' but rather symbolizes the 'value' of excellent quality.\" Minister of Economic Affairs Chen Jui-lung echoed Chairman Hsieh's remarks, stating: \"With the innovation, research, and development of brands, many self-created brands have embarked on a path of refinement, and excellent brands have even become world-renowned. However, brand management is not guaranteed to be successful, because with the continuous emergence of small and medium-sized enterprises, cultivating a good brand image requires long-term management.\"\n\nThe forum's focus... The highlight was the opening speech by Stan Shih, founder of Acer Group. Besides explaining global and Taiwanese brand development trends using the \"flat world\" theory, he further utilized his most acclaimed \"smile curve\" theory to demonstrate the trend of global corporate integration. He stated, \"The quality of a brand is not determined by its size, but by its essence and brand awareness.\" He even emphasized, \"Taiwanese manufacturers cannot forever remain OEMs! Because some people confuse the concepts of 'brand Taiwan' with 'Taiwanese brands.' A good brand requires not only good creativity but also effective management.\" \"Strategy is key to marketing Taiwanese brands internationally.\"\n\nIn her subsequent keynote speech, Deputy Director-General Hsu Chun-fang of the Bureau of Foreign Trade, Ministry of Economic Affairs, stated: \"Taiwanese brands have evolved from ODM to the more common OEM, and even, with the emergence of products manufactured under Taiwanese brands, have officially entered the important OBM era. This has enabled many brands to gain international recognition, with BenQ, Giant, Maxxis, and Acer serving as prime examples. If Taiwan can maintain its OBM strategy, it can significantly enhance a brand's competitiveness in the market.\" Increased influence and exposure can further promote the industry's commitment to remaining rooted in Taiwan.\n\nBenQ Vice Chairman Wang Wen-tsan, in his speech, used the definition from Wikipedia to clarify the difference between \"value\" and \"value system.\" He stated, \"Value includes both value system and customer value. A consumer's motivation for purchasing a product can vary due to emotional factors or personal needs. Furthermore, the attributes of a product or brand can be understood through differences in consumer groups. Of course, this applies not only to Taiwan, but also to products and private label brands in different countries, each with its own characteristics and style.\"",

        {
          "idx": 126,
          "title": "The 2008 Tour de Taiwan to Create Four-in-One Benefits with the Bicycle Show, Sporting Goods Show, and Taipei World Trade Center Nangang Exhibition Hall",
          "maxOccupiedPages": 3.6666666666666665,
          "text": "The 2008 Tour of Taiwan International Cycling Race is about to begin on March 9th. The Taipei International Cycling Show and the Taipei International Sporting Goods Show will be held simultaneously at the Taipei World Trade Center and its Nangang Exhibition Hall for four days starting on the 13th. Furthermore, the opening of the Nangang Exhibition Hall on the opening day, along with the addition of a \"Nangang Exhibition Hall stage\" to the Tour of Taiwan, will bring multiple benefits to the sporting goods, cycling, competitive sports, and exhibition industries.\n\nThis year's Tour of Taiwan will not only eliminate cross-county/city competition, but with the Nangang Exhibition Hall opening simultaneously with the Taipei International Cycling Show, Taipei City will see its first-ever dual-stage event for a single county/city. Moreover, the \"Citizen Elite Circuit Race,\" promoting local cycling, will be significantly expanded in scale. Even disregarding international competition, this circuit race alone is a powerful tool for promoting grassroots cycling.\n\nBeyond grassroots promotion, this year's Tour of Taiwan will be even more significant, as this international race, designated a 2.2 level by the International Cycling Federation (UCI), will determine riders' qualifications for the 2008 Beijing Olympics this summer. The long-distance road race, which tests riders' stamina and endurance, is particularly crucial, especially the two-day road race between Hsinchu City and Taipei County.\n\nSince the separation of bicycle exhibitions and sporting goods exhibitions in 1988, both industry exhibitions have developed their own unique characteristics.\n\nTaiwan has long been known as the \"Kingdom of Bicycle Exports,\" a reputation stemming from the decline of the American bicycle industry. The rise of brands like Merida and Giant, increased productivity in Asian countries, the fact that the vast majority of bicycles in the US are imported from Taiwan, and Taiwan's industrial development—from OEM manufacturing to the \"Three New Movements\" promoting high added value and new materials, functions, and uses in cycling—have led to the rise of local brands and Taiwan's place in the global bicycle industry. Currently, Giant and Merida are the 7th and 19th largest bicycle brands globally, respectively. In contrast, the sporting goods exhibition, after undergoing relocation, disputes over management rights among trade associations, and the completion of the Taipei World Trade Center, has not only witnessed part of the export history of the Taiwan External Trade Development Council (TAITRA), but also, due to technological advancements, innovative concepts, and market changes, has become not only a long-standing exhibition but also a benchmark for business opportunities in Asia.\n\nAlthough the development of the sporting goods industry has also been driven by changes in modern lifestyles, leading to the rise of the fitness and leisure industries, this year's simultaneous exhibition with the bicycle show will undoubtedly bring shared benefits to the bicycle, sporting goods, and leisure sports industries.\n\nSince the Nangang Pavilion was completed in late December last year, many year-end parties have held preliminary events before its official opening, garnering praise from numerous large enterprises. In fact, the Nangang Pavilion's popularity stems not only from its size being twice that of the existing Taipei World Trade Center but also from its unique double-story exhibition hall, with the upper hall featuring a column-free design, further attracting the attention of the exhibition industry.",

          "title": "Former Conradty Employees Celebrate the Takeover",
          "maxOccupiedPages": 1.1428571428571428,
          "text": "Nuremberg (Germany), February 27, 2005 – A rather inglorious chapter of history recently reached a somewhat positive conclusion. 240 employees of the former companies Conradty Carbon and Conradty COVA, based in Röthenbach an der Pegnitz, celebrated the takeover by an Indian investor, which had been agreed upon in December 2004. Prominent figures and politicians from the region and Munich attended the celebration. Fortunately, 240 jobs were saved instead of the expected 200.\n\nThe company is now called \"Graphite Cova GmbH,\" and Adrian Bojilov is the new managing director. The investor, \"Graphite India,\" is headquartered in Kolkata. With this acquisition, the company is attempting to gain a foothold in the European Union.\n\nNot only the employees and banks contributed to the smooth handling of the takeover; the local municipality, the district, the Franconian regional government, as well as members of parliament and three ministries in Munich, all worked diligently to preserve the jobs. The insolvency administrator found an investor in India who was willing to keep the company in Germany. Relocating the production facilities to Asia was never mentioned during the entire negotiations.",

          "title": "Nobel Peace Prize Laureate Muhammad Yunus at the University of Karlsruhe",
          "maxOccupiedPages": 1.619047619047619,
          "text": "Karlsruhe (Germany), June 6, 2007 – As part of a special event in the lecture series \"Shaping Globalization,\" organized by AIESEC, the Global Marshall Plan University Group Karlsruhe, and the Interfaculty Institute for Entrepreneurship, Muhammad Yunus and Eduardo Suplicy gave presentations today in the auditorium of the University of Karlsruhe. Heidemarie Wieczorek-Zeul, Federal Minister for Economic Cooperation and Development, is the patron of the lecture series.\n\nMuhammad Yunus was awarded the Nobel Peace Prize in 2006. Eduardo Suplicy (Workers' Party) represents the state of São Paulo in the Brazilian Senate and, as an advocate of the idea of a universal basic income, has succeeded in enshrining elements of this idea in the Brazilian Constitution. Götz Werner, founder of the drugstore chain dm, moderated the event. All three speakers are professors of economics. In his opening statement, Götz Werner said that Muhammad Yunus also deserved the Nobel Prize in Economics.\n\nMuhammad Yunus delivered a freely spoken address in English to the packed auditorium, peppered with many amusing anecdotes that illustrated the history of the Grameen Bank. His approximately one-hour lecture was frequently interrupted by laughter and applause. The Nobel Peace Prize laureate began his speech by saying that he always enjoyed speaking to students, as the idea for the microcredit institution had originated on the campus of a university in Bangladesh. Yunus admitted to feeling guilty about teaching economics at a time when his homeland was experiencing a severe famine, especially since the textbooks offered no solution to the crisis and seemed \"pointless\" to him.",

          "maxOccupiedPages": 0.8095238095238095,
          "text": "I heard something similar in Kerala. Fishermen there, upon catching fish, check the price on their mobile phones and take their boats to the place where they get the best price.\n\nThe story is similar with open source. People often think that it's impossible to have ownership of open source; that it can't be paid for – and therefore, it can't be monetized. This thinking is wrong. Distributing open source software for free doesn't mean it can't be monetized. This is a similar tactic to that used by financial institutions in Africa.\n\nThe method of earning money in open source is different from proprietary software. Perhaps, this is a better approach. That's why open source is being promoted in Extremadura.",

          "idx": 131,
          "title": "Francesco Cirillo: Agile Programmers, a New Philosophy of Software Development",
          "maxOccupiedPages": 1.380952380952381,
          "text": "FC: Agile methods seek a winning solution where developers have better working conditions and content, and companies can make more money. How? In an agile team, every member has the opportunity to contribute to improving the process. Each team member takes responsibility for developing entire features (and doesn't have them assigned to them by someone else). They know they can propose new, even highly creative, ideas. Their ideas will be harshly criticized but objectively and always with respect. They develop production software in collaboration with another developer to improve the quality of their work, learn from those who know more than them, or discover new things through discussion. They can communicate their development problems without fear, knowing the team will help them. They are committed to writing high-quality software that everyone can understand. And above all, they build software that grows evolutionarily, driven by testing.\n\nAll this leads to fewer defects, greater overall flexibility, and a resulting lower cost of change. Managers reduce monitoring activities—the team is interested in its own improvement—and, above all, they stop motivating people. The team is motivated by the content of the work and the process they've chosen to follow. They experience greater satisfaction at work, increasing the company's productivity and profits.",

          "idx": 132,
          "title": "The Moon and Robots",
          "maxOccupiedPages": 1.9523809523809523,
          "text": "The century we have begun represents a true crossroads in human history. Not only is the need for raw materials, energy, and water severely testing the planet's stability, its environmental cycles, and the balance between living species, but the forms of commodity production, the distribution of resources, and the progressive concentration of power in a few hands are severely testing contemporary societies.\n\nThese processes are the result of the major transformations that technologies are injecting into the heart of our societies. The strategic innovation of recent years has been the introduction of digital technologies. Their ubiquity, flexibility, and pervasiveness have transformed the entire human environment. But these transformations are only in the first phase of their development. Indeed, the acceleration we are destined for predicts an exponential increase in changes in all areas of daily life, starting with working conditions.\n\nGiven the exponential increase in the potential for automation of production processes, what kind of work will still exist in 50 years? Will work still be the means of distributing the income necessary for people's livelihoods? What will tomorrow's work look like? Can new modes of production, increasingly interconnected and intertwined with personal relationships, coexist with a nineteenth-century work-life model that divided the day into 8 hours of work, 8 hours of life, and 8 hours of sleep? Could the decline in equipment prices, their miniaturization, the development of 3D printers, and the prevalence of immaterial goods herald a reduction in the scale of global production and counterbalance the push toward gigantism by large corporations?\n\nThe potential of digital technology is now being harnessed by old forms of ownership, control, and commodification, and bent to the needs of old forms of capitalist production. What can we do to strengthen the logics that counter this trend and are already building other forms of production, work, and sociality?",
          "occupiedPages": 1.6666666666666667,
          "originalEnglish": false
        },

          "idx": 133,
          "title": "Special Feature 2: Education and Work — Ministry of Education, Culture, Sports, Science and Technology",
          "maxOccupiedPages": 4.571428571428571,
          "text": "A major characteristic of employment practices in Japan is the in-house education and training based on the premise of long-term employment. Until now, it was common practice to acquire basic knowledge at school, and then develop the specialized knowledge and skills necessary for a job mainly through in-house education and training while working. However, as shown in Figure 1-2-9, approximately 70% of companies report having challenges in human resource development. The reasons cited include a shortage of personnel to provide instruction (approximately 50 percent) and a shortage of time (approximately 47 percent), indicating that companies are losing the capacity to provide human resource development (*4). In addition, the increase in non-regular employees, as seen in section 1, is also creating problems in the development of professional skills. Non-regular employees have fewer opportunities to receive in-house education and training compared to regular employees, making it difficult for them to improve their skills through work. Furthermore, as shown in Figure 1-2-10, companies tend to prioritize specialized knowledge and skills when hiring mid-career employees. This poses a challenge for non-regular employees in building their careers (see Section 2, 1(1) for the definition of \"career\").\n\nMoreover, with the advancement of science and technology and rapid technological innovation, the specialized knowledge and skills required for occupations are becoming more sophisticated and diverse. Therefore, it is believed that there is a growing need for workers to further their education at universities and other institutions to enhance their expertise or acquire the knowledge and skills necessary to adapt to new occupations. For example, as shown in Figure 1-2-11, approximately 80% of workers cite acquiring the knowledge and skills necessary for their current jobs as the reason for engaging in self-development. However, regarding adult education at universities and other institutions, as shown in Figure 1-2-12, the proportion of university entrants aged 25 or older is approximately 21 percent on average in OECD countries, but remains at only about 2 percent in Japan.\n\nThe underlying issues include securing the necessary funds and study time to balance work and learning, the content of available educational programs, and gaining the understanding of employers and other organizations. Educational institutions are also required to implement measures to allow working adults to take classes flexibly, such as offering classes on weekends. For example, as shown in Figure 1-2-13, regarding recurrent education for working adults, the most common challenges cited were \"busy work schedule\" (approximately 72 percent) and \"high cost\" (approximately 71 percent). However, a significant number of respondents also cited \"difficulty gaining company understanding or disclosing it\" (approximately 21 percent) and \"lack of comprehensive curricula for working adults\" (approximately 16 percent). Furthermore, the most important factor in choosing an educational institution was \"attractive curriculum\" (approximately 74 percent), followed by \"convenient location\" (approximately 62 percent), \"low tuition fees\" (approximately 55 percent), \"flexible scheduling\" (approximately 52 percent), and \"weekend and holiday classes\" (50 percent).\n\nRegarding the relationship between the level of education attained and post-graduation employment and income, as shown in Figure 1-2-14, the percentage of people who remain in regular employment is highest for both men and women in the following order: \"university/graduate school graduates,\" \"junior college/technical college graduates,\" \"vocational school graduates,\" and \"high school graduates.\" On the other hand, those who are \"junior high school graduates/high school dropouts\" or \"higher education dropouts\" are more likely to be in non-regular employment for both men and women.\n\nFurthermore, as shown in Figures 1-2-15 and 1-2-16, internationally, those who have completed higher education tend to have lower unemployment rates compared to those who have completed upper secondary education (general education), and those who have completed higher education tend to have higher incomes by level of education attainment compared to those who have completed upper secondary education or less. From the above, it is considered important to ensure diverse learning opportunities throughout one's life so that individuals can develop their abilities according to their aspirations and life stages, from the perspective of achieving stable employment and household finances.",

          "maxOccupiedPages": 3.1904761904761907,
          "text": "The number of non-regular workers has been increasing in recent years, reaching 17.55 million in 2010, accounting for approximately 30% of the total workforce. Compared to regular workers, non-regular workers face several problems, including: (1) being more susceptible to employment adjustments such as layoffs and termination of contracts, especially during economic downturns; (2) having lower wages and a lower marriage rate; and (3) having fewer opportunities to receive vocational training within companies to improve their skills. To address these issues, and to reduce the number of non-regular workers who are unable to become regular employees despite their desire, and to improve the treatment of non-regular workers, the government is working to support their employment as regular employees, facilitate their conversion to regular employment, and promote equal and balanced treatment through the measures listed below. In addition, the government is promoting comprehensive measures for non-regular workers by utilizing the Job Card system to support career development (see Chapter 2, Section 3, Item 2) and by expanding the safety net through job seeker support systems, etc. (see Chapter 2, Section 1). Amidst the still severe employment and unemployment situation, securing job openings remains a crucial issue, and in particular, there is a need to actively work towards securing more stable permanent positions (employment contracts without a fixed term). Therefore, Hello Work (public employment service) is actively working to secure permanent positions, including conversions from non-regular employment, and promoting permanent employment. Socially problematic forms of dispatch work, such as daily dispatch, and the so-called \"dispatch worker layoffs\" that became a social issue after the Lehman Shock in the fall of 2008, have highlighted the instability of employment in registered dispatch and manufacturing dispatch work. Furthermore, it has been pointed out that dispatch workers are not receiving treatment commensurate with their work, such as having their wages fixed at low levels. Therefore, the revised Worker Dispatch Act, currently submitted to the Diet, includes provisions to improve the stability of employment and treatment of dispatch workers, such as the principle of prohibiting registered dispatch and manufacturing dispatch, and the obligation to consider equal treatment. If the revised Worker Dispatch Act is enacted, in addition to disseminating information and providing guidance on the legal system, including the obligation to consider equal treatment, the \"Special Incentive for Stabilizing Employment of Dispatched Workers\" (1 million yen per person (500,000 yen for fixed-term employment) (half price for large companies)) will be utilized to promote the direct employment of dispatched workers at client companies, and guidance and supervision will be thoroughly implemented to correct illegal dispatching practices.",

          "title": "Outsourcing Fundraising: When Is It Time to Consult a Specialist?",
          "maxOccupiedPages": 1.5714285714285714,
          "text": "Evgeny Zubov believes it's very difficult for NGOs to hire full-time employees these days. Everyone needs fundraisers, marketing, and PR specialists, but no one is applying for these positions. Because there are almost no people with successful experience in the third sector, NGO employees turn to consultants.\n\n\"People try to find a solution themselves. For example, they want to increase fundraising through a VKontakte group. The employee sees that we're working on this issue, that we have a ready-made solution because we've already tackled this task. We also communicate when we'll see results and provide guarantees. Not every full-time employee can do this.\" Evgeny Zubov\n\nHiring a specialist from a commercial company isn't always the best solution either. They'll still need additional training, and some organizations need results right away. Furthermore, in a large company, a person might only be responsible for one narrow area, such as SMM. At an NGO, their range of responsibilities will likely expand significantly, and they'll have to do more than just write engaging texts for social media.\n\n\"In a non-profit organization, it's usually rare for just one thing to be poorly functioning. For example, a foundation has an active and well-functioning Facebook group. But the staff posts a link that leads to a donation page that's not mobile-friendly. A person clicks through to the group, ready to donate to the foundation, but it doesn't work. And an SMM specialist likely won't be able to fix the site.\"",

          "maxOccupiedPages": 1.4761904761904763,
          "text": "Numbers, arrows, and ornate diagrams—in the office of the Arithmetic of Goodness charitable foundation, the fundraising department hangs on huge sheets of paper covered in colorful markers. This is the foundation's fundraising strategy for working with individuals. Department head Anastasia Lozhkina believes that fundraising shouldn't be a spontaneous endeavor. She spoke to Teplitsa journalist Ekaterina Ulyanova about how to effectively manage fundraising in a nonprofit.\n\nImagine that this month, the manager asked a fundraiser to raise 100,000 rubles for the foundation. They expended effort, talked to donors, and brought in the required amount. And then they're told that expenses have increased and they urgently need to raise another 100,000 rubles. This isn't fundraising management, but ad hoc collections that don't lead to the financial stability of the nonprofit, says Anastasia Lozhkina.\n\nFundraising shouldn't be seen as supporting the organization's core activities. This is a common mistake managers make, the expert emphasizes. They consider working with beneficiaries to be their primary focus, while fundraising is relegated to administrative duties.\n\n\"This is the wrong approach. Fundraising is also a programmatic activity of the organization. It's the fundraisers who are the first people donors see. They're the people who talk about the foundation, the social problem, and how the NGO is solving it. Fundraisers are the face of any organization.\"",
