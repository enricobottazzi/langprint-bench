    :root {
      color-scheme: light;
      --paper: #fbf5e7;
      --paper-edge: #d9ceba;
      --ink: #302b25;
      --soft-ink: #675e53;
      font-family: "Noto Serif", Georgia, serif;
      font-synthesis: none;
      font-optical-sizing: none;
      font-size: 12px;
      line-height: 1.85;
      background: #e9e7e1;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    .book-nav { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 2px; background: #e9e7e1; border-radius: 4px; }
    .book-nav a { display: grid; place-items: center; width: 44px; height: 44px; color: var(--soft-ink); text-decoration: none; }
    .book-nav a:hover { color: var(--ink); }
    .book-nav a:focus-visible { outline: 1px solid currentColor; outline-offset: -5px; border-radius: 4px; }
    .book-nav svg { width: 18px; height: 18px; }
    .reader { min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 48px 56px; }
    .book-shell { position: relative; min-width: 0; width: min(930px, 100%); }
    .paperback {
      position: relative; isolation: isolate; width: 930px; perspective: 2200px; zoom: var(--book-scale, 1);
      border-radius: 1px 3px 4px 1px;
      box-shadow: 0 9px 18px #00000012, 0 1px 2px #00000010;
      touch-action: pan-y;
    }
    .paperback::before {
      content: ""; position: absolute; inset: 2px -3px -5px -2px; z-index: -1;
      border-radius: 1px 5px 5px 1px; background: var(--paper-edge); box-shadow: 0 3px 5px #00000010;
    }
    .paperback::after {
      content: ""; position: absolute; left: 1px; right: -2px; bottom: -4px; height: 5px; z-index: 1;
      background: repeating-linear-gradient(to bottom, var(--paper), var(--paper) 1px, var(--paper-edge) 2px, var(--paper) 3px);
    }
    .spread, .turn-stage {
      position: relative; display: grid; grid-template-columns: 1fr 1fr;
      background: var(--paper); border-radius: inherit;
    }
    .spread + .spread { margin-top: 28px; }
    .book-ready .spread + .spread { margin-top: 0; }
    .spread::after, .turn-stage::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: calc(50% - 1px); width: 2px;
      pointer-events: none; z-index: 2;
      background: linear-gradient(to right, #69533426 0, #69533426 1px, #fffaf0b3 1px, #fffaf0b3 2px);
    }
    .page { position: relative; min-width: 0; height: 624px; padding: 40px 50px 52px; background: var(--paper); }
    .spread > .page:first-child { border-radius: 1px 0 0 3px; }
    .spread > .page:last-child { border-radius: 0 3px 4px 0; }
    .spread > .page:first-child::before, .spread > .page:last-child::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 8px; opacity: .35; pointer-events: none;
    }
    .spread > .page:first-child::before { left: 0; background: linear-gradient(to right, var(--paper-edge), transparent); }
    .spread > .page:last-child::after { right: 0; background: linear-gradient(to left, var(--paper-edge), transparent); }
    .running {
      height: 47px; margin: 0; text-align: center; font-size: 12px; font-weight: 400;
      line-height: 1.85; letter-spacing: .09em; color: var(--soft-ink);
    }
    /* Optical correction for the visible title and subtitle glyphs. */
    .title-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 50px; transform: translateY(-2px); }
    h1 { margin: 0; font-size: 42px; font-weight: 400; line-height: 1.2; letter-spacing: -.035em; }
    .subtitle { max-width: 270px; margin: 28px 0 0; font-size: 12px; line-height: 1.85; }
    .folio { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; color: var(--soft-ink); line-height: 1.5; }
    .heatmap-content { position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; }
    /* Centre the labelled chart itself, without compensating blank space. */
    .heatmap-frame { width: max-content; max-width: calc(100% - 40px); }
    .heatmap { width: auto; table-layout: auto; border-collapse: collapse; font-size: 12px; line-height: 1; }
    .heatmap col:first-child { width: auto; }
    .heatmap col:not(:first-child) { width: 23.7px; }
    .heatmap thead th { padding: 0 0 9px; text-align: center; vertical-align: bottom; font-weight: 400; }
    .column-label { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; line-height: 1; }
    .heatmap tbody th { padding: 0 7px 0 0; text-align: end; white-space: nowrap; font-weight: 400; }
    .heatmap td { height: 23.7px; padding: 0; border: 1px solid var(--paper); }
    .index-discipline { margin: 22.2px 0 0; font-size: 12px; font-weight: 400; font-style: normal; line-height: 1.85; }
    .index-discipline:first-child { margin-top: 0; }
    .index-entry { display: grid; grid-template-columns: minmax(0, 1fr) 4ch; column-gap: 12px; align-items: end; padding-inline-start: 2em; }
    .index-range { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .index-entry { color: inherit; text-decoration: none; }
    .page--passage .running { display: flex; align-items: flex-start; justify-content: center; gap: 3px; overflow: hidden; }
    .page--passage .running-title { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
    .page--passage .original-marker { flex: none; }
    .page-arrow {
      display: none; position: absolute; top: 50%; transform: translateY(-50%);
      align-items: center; justify-content: center; width: 44px; height: 76px;
      padding: 0; border: 0; border-radius: 0; background: transparent; color: #aaa69e;
      font: 400 50px/1 Arial, sans-serif; cursor: pointer; touch-action: manipulation;
    }
    .book-ready .page-arrow { display: flex; }
    .page-previous { left: -48px; }
    .page-next { right: -48px; }
    .page-arrow:disabled { opacity: 0; pointer-events: none; }
    .turn-stage { position: absolute; inset: 0; height: 624px; pointer-events: none; z-index: 4; perspective: 2200px; }
    .turn-leaf { position: absolute; top: 0; width: 50%; height: 624px; transform-style: preserve-3d; z-index: 3; }
    .turn-leaf.forward { left: 50%; transform-origin: left center; }
    .turn-leaf.backward { left: 0; transform-origin: right center; }
    .turn-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .turn-back { transform: rotateY(180deg); }
    .turn-face .page { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 850px) {
      :root { scroll-padding-top: 68px; }
      .reader { padding: 68px 16px 24px; }
      .book-shell { width: min(465px, 100%); }
      .paperback { width: 465px; box-shadow: none; }
        .paperback::before, .paperback::after, .spread::after { display: none; }
      .spread { grid-template-columns: 1fr; gap: 28px; background: transparent; }
      .book-ready .spread + .spread { margin-top: 28px; }
      .book-ready .page-arrow { display: none; }
      .page--blank { display: none; }
      .spread > .page:first-child, .spread > .page:last-child { border-radius: 2px 4px 5px 2px; box-shadow: 0 9px 18px #00000012, 0 1px 2px #00000010, 1px 4px 0 var(--paper-edge); }
      .page-previous { left: -44px; }
      .page-next { right: -44px; }
    }
    @media (max-width: 480px) {
      .reader { padding: 68px 12px 16px; }
      }
    @media print {
      @page { size: A4 landscape; margin: 14mm; }
      :root { background: white; }
      .reader { display: block; min-height: 0; padding: 0; }
      .book-shell { width: 930px; }
      .paperback { box-shadow: none; zoom: 1; }
      .paperback::before, .paperback::after, .page-arrow, .book-nav { display: none !important; }
      .spread, .spread[hidden] { display: grid !important; grid-template-columns: 1fr 1fr; gap: 0; break-after: page; margin: 0; }
      .spread::after { display: block; }
      .spread > .page { height: 624px; padding: 40px 50px 52px; box-shadow: none !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>

          "idx": 1,
          "title": "Printcrime",
          "maxOccupiedPages": 2.1904761904761907,
          "text": "The coppers smashed my father’s printer when I was eight. I remember the hot, cling-film-in-a-microwave smell of it, and Da’s look of ferocious concentration as he filled it with fresh goop, and the warm, fresh-baked feel of the objects that came out of it.\n\nThe coppers came through the door with truncheons swinging, one of them reciting the terms of the warrant through a bullhorn. One of Da’s customers had shopped him. The ipolice paid in high-grade pharmaceuticals—performance enhancers, memory supplements, metabolic boosters. The kind of thing that cost a fortune over the counter; the kind of thing you could print at home, if you didn’t mind the risk of having your kitchen filled with a sudden crush of big, beefy bodies, hard truncheons whistling through the air, smashing anyone and anything that got in the way.\n\nThey destroyed grandma’s trunk, the one she’d brought from the old country. They smashed our little refrigerator and the purifier unit over the window. My tweetybird escaped death by hiding in a corner of his cage as a big, booted foot crushed most of it into a sad tangle of printer-wire.\n\nDa. What they did to him. When he was done, he looked like he’d been brawling with an entire rugby side. They brought him out the door and let the newsies get a good look at him as they tossed him in the car, while a spokesman told the world that my Da’s organized-crime bootlegging operation had been responsible for at least twenty million in contraband, and that my Da, the desperate villain, had resisted arrest.\n\nI saw it all from my phone, in the remains of the sitting room, watching it on the screen and wondering how, just how anyone could look at our little flat and our terrible, manky estate and mistake it for the home of an organized crime kingpin. They took the printer away, of course, and displayed it like a trophy for the newsies. Its little shrine in the kitchenette seemed horribly empty. When I roused myself and picked up the flat and rescued my peeping poor tweetybird, I put a blender there. It was made out of printed parts, so it would only last a month before I’d need to print new bearings and other moving parts. Back then, I could take apart and reassemble anything that could be printed.",

        },

          "text": "The dress was finished and ready for delivery. Widad stretched out on the floor, allowing her back and neck to rest against a hard surface, hoping to ease the aches in her spine and muscles. No one was home. Her three children were at school, her husband was at work, and her sister-in-law and her husband, with whom she shared the rented apartment, had gone on a family visit. Widad gazed at the dress; it was beautiful, elegant, and distinctive. She felt immense pride and a strong desire to wear it, even though her thin frame would be hidden within the dress, which was tailored to the size of a plump woman in her sixties. She glanced at the clock; there was still some time before someone returned home. She stood before the fitting mirror, removed her clothes, and pulled the dress over her body through the neckline. She inserted a fabric insert in place of her surgically removed breasts. She looked at herself. Her complexion was pale, her body thin, her cheeks sunken, and wrinkles were beginning to etch themselves across her forty-year-old face. She let down her auburn hair and puffed out her cheeks. Then she grasped the hem of her long skirt and began to dance alone in the house without music. She twirled and twirled as if in a mystical trance, and with each spin she remembered a fragment of the past.",

          "idx": 4,
          "title": "The Search for Happiness",
          "maxOccupiedPages": 3.1904761904761907,
          "text": "In 2013, Umm Alaa began cooking at home and selling her meals on a small scale to cover her rent and her own needs, as well as those of her son, a soldier who was still alive at the time. She continued working alone until 2015, when her landlord decided to raise the rent, completely disregarding the immense grief she was experiencing after the deaths of her two sons. Amidst all this hardship, her neighbor, a first lieutenant in the Political Security Directorate from Jroud, was living a silent love affair with her as its protagonist.\n\nAbu Mudhar, also in his fifties, was divorced and lived alone in a house in Damar al-Balad. His house happened to be directly opposite Umm Alaa's. He would wait for her every morning as she left her house to buy groceries, watching her quietly. It took him a long time before he offered to help her carry her purchases on her way home. Umm Alaa was in her fifties, with a full figure. Despite all she had endured, her face was barely wrinkled. Her kind, shy smile and her well wishes for his success would lift his spirits for days, especially for the single man who had no one to keep him company in his loneliness.\n\nUmm Alaa, for her part, was preoccupied with her own life and absorbed in dealing with loss and pain, so she didn't notice his attention. In truth, she felt a mix of emotions towards him, her gratitude tinged with caution and fear, given that he was, after all, a security officer, even though he seemed a kind and honorable man. This didn't stop her from occasionally bringing him a meal she had cooked.\n\nBut their relationship deepened when she faced the problem of a rent increase. Umm Alaa was at her lowest point, and it was then that the man intervened, using persuasion and a touch of intimidation, to reach an acceptable settlement with the landlord, who raised the rent only nominally and allowed Umm Alaa to remain as his tenant.\n\nUmm Alaa hosted her neighbor, Al-Rida, for lunch, defying all her previous convictions about bringing a strange man into her home, and challenging her neighbors, whose disapproval she sensed in their glances. According to custom and law, she was still married, and as a grieving mother, she had no reason to put herself in a position that would make her the subject of gossip.\n\nUmm Alaa laughed as she instructed one of the women rolling grape leaves: \"Don't make them too thick, they don't like them that way... Anyway... God is great, it's all destiny. Neither Abu Mudhar nor I cared. We were comfortable and happy. He was a good, simple, and solitary man. We would sit and eat and talk, and we wouldn't even notice the time. Then one day he asked me, 'Will you marry me, Umm Alaa?' And I said yes. Honestly, I didn't marry my husband for love. May God grant him ease if he's alive, and have mercy on him if he's passed away. But I'm alive, and I have the right to relax and enjoy the rest of my life.\"\n\nSince the personal status law in Syria allows a wife to be divorced and marry another man if her husband is absent for more than a year without her knowing anything about him, the couple had the option to get married. They got married in 2016 and live together in Umm Alaa’s house, after Abu Mudhar moved out and changed the lease to his name and handed over his house.",

          "text": "CN-100-1 is a high-energy substance, possibly a three-dimensional projection from a higher-dimensional space. Observations with the naked eye and ordinary optical sensors show that condensed CN-100-1 is a pure black spherical substance, resembling drinking water in a weightless state. Individual humans carry varying amounts of non-condensed CN-100-1, but it is generally inseparable from the body. Specific behaviors of individual humans can cause varying numbers of channels to appear at the quark level, inputting or outputting a certain amount of non-condensed CN-100-1 into or out of the body. Research on the location of these channels is ongoing.\n\nThe human body absorbs and carries CN-100-1 without significant negative effects, but collecting condensed CN-100-1 through the human body is not recommended. It is best to use the strong energy field generated by the Symmetra device to collect and move condensed CN-100-1.\n\nWhen condensed CN-100-1 is \"ignited\" by the project, the project emits extremely weak gravitational waves, and the gravitational distortion of the surrounding space by the project is slightly enhanced. Although all optical measurements indicate that the project's volume has not increased, its mass will still increase slightly.\n\nUnlike ordinary flames that tend to move towards areas rich in oxidizer, CN-100 will spontaneously move towards areas rich in non-condensed CN-100-1 within a certain range. If a qualified Class D person is placed within 60 meters of the project, the project will slowly move towards that person (at a minimum speed of micrometers), and no obstruction will hinder this movement. If a qualified Class D person is placed in the opposite direction, the project will remain in its original position. If the number of ordinary humans gathered within the [data redacted] range of the project reaches ███ or more, it will have the same effect on the project. It is speculated that when the gathering reaches this scale, the amount of non-condensed CN-100-1 carried by the crowd is equivalent to that of a qualified Class D person.\n\nAny human individual who comes into physical contact with CN-100 will lose complex cognitive abilities, retaining only basic physiological functions. According to information provided by the Kuiyang faction, any biological individual's contact with CN-100 carries an extremely high risk.",

          "title": "SCP-CN-173",
          "maxOccupiedPages": 2.380952380952381,
          "text": "SCP-CN-173 is a humanoid entity composed of pure black lines. The object is 2 meters tall, with lines 2 centimeters wide. Its head is a circle composed of lines, approximately 20 centimeters in diameter. Two appendages, functioning as arms, connect to the head at the junction of the head and body, with a joint dividing each appendage into two equal-length segments. Similarly, two appendages, functioning as legs, connect to the tail, also with a joint dividing them into two equal-length segments. The body is 80 centimeters long, and the appendages are 100 centimeters long.\n\nRegardless of the viewing direction, SCP-CN-173 always faces the observer in a flat plane. The object exhibits no apparent thickness and does not possess the ability to interfere with conventional physical phenomena. This means that the object cannot physically affect any object and cannot resist any form of force. Nevertheless, no injuries or pain have been observed. Visual analysis of the object's movement indicates that it is still subject to gravity, and its mass is 100 kg.\n\nSCP-CN-173 exhibits certain deductive characteristics and possesses intelligence equivalent to that of a normal human. The object has the ability to speak and is fluent in Chinese, locating the source of sound as below its head. The object is aware of its anomalous nature and is willing to cooperate with containment and experimental procedures; most of its behavior is positive and proactive, but SCP-CN-173 is eager to retrieve SCP-CN-173-1. The object possesses sensory abilities, but the mechanism of these abilities is unknown.\n\nSCP-CN-173-1, as described by SCP-CN-173, is a canvas of unidentified material produced by Dr. Wondertainment. SCP-CN-173-1 possesses the ability to manipulate SCP-CN-173's current form, to which SCP-CN-173 responds that both text and images are effective, suggesting it possesses entirely metaphysical characteristics and a clear deductive nature. After the Foundation expressed a clear commitment to searching for SCP-CN-173-1, SCP-CN-173 expressed a willingness to trust the Foundation, and its attitude improved. If SCP-CN-173-1 is found, it should be handed over to the Foundation's Theory Department for analysis and to develop containment procedures. Due to the possibility of compressing the theory subject and guidance into the same metaspace or creating an illegal loop, SCP-CN-173 should not be allowed to come into contact with SCP-CN-173-1.",

          "text": "Magione emerged first to the ring, accompanied by the handler wearing the blue and gold colors of the stable. He began to circle, shaking his neck, as if to release the tension. A four-year-old fawn thoroughbred, with a thin, sharp muzzle, he had had a good season in 1953, numerous placings and two victories. Behind him, the handlers introduced the other horses, proud, six feet at the withers, their breath fading in the crisp afternoon air. Giuseppe Marano stroked the neck of his Ninfa, the clear favorite, even though he knew he was the more nervous of the two. He cast a questioning glance at the spectators, then completed the lap, checking the trim for the umpteenth time. The mare snorted a few steps from Lario: she didn't like males. Then Verdi, Augusta, and Redipuglia, also very good, but names good at most for a placing, except that Augusta, on heavy ground, could do well. Until the previous day, before the clear skies of that wintry Sunday, it had rained in Naples and the track was still loose. Monte Allegro, the most nervous of the group, arrived huffing and puffing, ignoring the trainer's voice, who seemed to be whispering something to calm him. Nothing new: Monte Allegro was one of those beasts that were difficult to control, that devour the first thousand meters and collapse at the finish.\n\nIn the stands, Salvatore Lucania lit a cigarette and watched the wind carry away the first puff of smoke. He had had to take off his gloves and now almost regretted it: the cold was intense. He turned to Cavalier De Dominicis and said: \"But wasn't this the city of the sun? Damn, it's so cold it feels like New York!\"",

          "title": "The Sparkling Fish and Me",
          "maxOccupiedPages": 1.6666666666666667,
          "text": "For some reason, many people can't resist throwing coins into any water source within a sacred area, and it's common to find large piles of one-yen and five-yen coins covering the bottom of ponds within the grounds of temples and shrines.\n\nThe three small ponds in a corner of the shrine I frequently visit were no exception; a dull shimmer of gold, silver, and copper flickered beneath the surface.\n\nEven if they see divinity in the water, surely sinking so much metal will worsen the water quality. I think it would be much easier for the shrine if they just threw them into the offering box, but deeply ingrained customs rarely change, so there's nothing that can be done.\n\nI often think about these things as I stroll around the shrine grounds, but one day I encountered an unexpected anomaly.\n\nThe pile of coins that had been submerged in one of the ponds had vanished. I had stopped by the shrine yesterday as well, and as usual, I peered into the pond as I passed by. At that time, nothing had changed from before. In other words, the bottom of the pond had become clean overnight.\n\nI considered whether it was simply a cleaning, but the coins in the two neighboring ponds were still glittering in the sunlight. Each pond was quite small, small enough to be cleaned all at once in a day. It seemed a little unnatural to dredge the bottom of only this one while leaving the others untouched.\n\nAlthough it seemed unnatural, it wasn't impossible. But I was drawn to the strange feeling and peered into the pond where the coins had vanished.\n\nSuddenly, I saw something glittering move in the shadow of a rock sticking out in the middle of the pond.",

          "maxOccupiedPages": 1.9523809523809523,
          "text": "Even late at night, the bustling downtown area was filled with people and lights, and the woman walked with long strides, her face a frown that seemed out of place amidst the slightly frivolous hustle and bustle.\n\nShe glanced around discreetly, occasionally checking her company-issued smartphone. The date and time displayed on the screen was December 31st, 11:06 PM. The seconds continued to tick even as she watched.\n\n\"Ah, ah, the new year's almost here,\"\n\nShe muttered bitterly to herself, slowing her pace.\n\nEven if she could find her target at this very moment, calling for backup from other agents, continuing to tail the target without being noticed until they arrived, and then cornering them in a location where concealment and other post-operative procedures would be less troublesome—it seemed highly unlikely that it could be done within an hour.\n\n(I can't exactly tell you that the New Year won't come for you.)\n\nPutting her device in her coat pocket, the female agent finally stopped beside a street tree.\n\n(Anyway, it's all wishful thinking. I haven't even gotten a single clue.)\n\nMuttering self-deprecatingly, she took off her felt hat and fanned herself. Since the end of the year had arrived, she had been pushing herself too hard, driven by impatience. The fact that she hadn't been able to capture that \"doctor\" this year, and that she was letting the anomalous objects continue to be produced, was incredibly frustrating and infuriating.\n\nShe clicked her tongue and put her hat back on. Should she persevere for another hour, even after the New Year? Or, with her tired legs and eyes, would she even be able to spot anything abnormal? As she hesitated, a yawn welled up inside her. She stifled it, covering her mouth, but wondered if today was a bust.\n\nAs she remained undecided, she heard a familiar voice calling out to her from nearby.",

          "text": "It was around seven in the evening when I parked the car in front of her house and got out to open the door for her. Nuria gave me a smile mixed with a kiss, smoothed down her patterned dress, and got out. After opening the gate, she tossed her hair and narrowed her eyes. I inhaled a wave of Eternity.\n\n\"Would you like to come in?\" she said, somewhere between inviting and challenging.\n\nI felt a few tiny electric shocks in my forearms; then, a remote and fleeting dizziness struck me. I admired her apple-like face, which didn't even betray her mid-twenties, and I felt more married than ever.\n\n\"Are your parents home?\" I asked.\n\n\"No, silly! Nobody's home!\" she replied, and burst out laughing.\n\nWe entered a small, open patio. On the other side, I could see some windows. We walked arm in arm and went into the living room. It was too big for the furniture; it only had four blue armchairs and a wooden table in front of them.",

          "text": "On my study desk, the page remains blank. The pipe has infused each book with maple, the Martell is almost empty, and I still don't know if I should write you this letter. It's not your new relationship that stops me, but your emotional fragility.\n\nThirty years into our life together, your illness began, and now this. You'll understand it's too much. Even for me, a fisherman in the river of personal stories.\n\nA few months before you turned sixty, you started forgetting trivial things, like my cell phone number, or the number of suits sent to the dry cleaners.\n\nNow my skin crawls when I think about how we laughed at those lapses… until you omitted some notes while giving your concert at the Japanese embassy. Your tears flowed all night. Morning found you lying on the white sofa, in your purple dress, your eyes blurred with mascara. When you woke up, my hand was caressing yours.\n\nYou gave me a look full of melancholy and, smiling, you said as you have so many times: \"Life is a novel, you have to live it with passion.\"",

          "maxOccupiedPages": 2.1904761904761907,
          "text": "NASA’s New Horizons spacecraft is at Pluto.\n\nAfter a decade-long journey through our solar system, New Horizons made its closest approach to Pluto Tuesday, about 7,750 miles above the surface — roughly the same distance from New York to Mumbai, India – making it the first-ever space mission to explore a world so far from Earth.\n\n“I’m delighted at this latest accomplishment by NASA, another first that demonstrates once again how the United States leads the world in space,” said John Holdren, assistant to the President for Science and Technology and director of the White House Office of Science and Technology Policy. “New Horizons is the latest in a long line of scientific accomplishments at NASA, including multiple missions orbiting and exploring the surface of Mars in advance of human visits still to come; the remarkable Kepler mission to identify Earth-like planets around stars other than our own; and the DSCOVR satellite that soon will be beaming back images of the whole Earth in near real-time from a vantage point a million miles away. As New Horizons completes its flyby of Pluto and continues deeper into the Kuiper Belt, NASA’s multifaceted journey of discovery continues.”\n\n“The exploration of Pluto and its moons by New Horizons represents the capstone event to 50 years of planetary exploration by NASA and the United States,” said NASA Administrator Charles Bolden. “Once again we have achieved a historic first. The United States is the first nation to reach Pluto, and with this mission has completed the initial survey of our solar system, a remarkable accomplishment that no other nation can match.”\n\nPer the plan, the spacecraft currently is in data-gathering mode and not in contact with flight controllers at the Johns Hopkins University Applied Physics Laboratory (APL) in Laurel, Maryland. Scientists are waiting to find out whether New Horizons “phones home,” transmitting to Earth a series of status updates that indicate the spacecraft survived the flyby and is in good health. The “call” is expected shortly after 9 p.m. EDT tonight.",

          "title": "NASA Confirms Evidence That Liquid Water Flows on Today's Mars",
          "maxOccupiedPages": 1.6666666666666667,
          "text": "New findings from NASA’s Mars Reconnaissance Orbiter (MRO) provide the strongest evidence yet that liquid water flows intermittently on present-day Mars.\n\nUsing an imaging spectrometer on MRO, researchers detected signatures of hydrated minerals on slopes where mysterious streaks are seen on the Red Planet. These darkish streaks appear to ebb and flow over time. They darken and appear to flow down steep slopes during warm seasons, and then fade in cooler seasons. They appear in several locations on Mars when temperatures are above minus 10 degrees Fahrenheit (minus 23 Celsius), and disappear at colder times.\n\n“Our quest on Mars has been to ‘follow the water,’ in our search for life in the universe, and now we have convincing science that validates what we’ve long suspected,” said John Grunsfeld, astronaut and associate administrator of NASA’s Science Mission Directorate in Washington. “This is a significant development, as it appears to confirm that water — albeit briny — is flowing today on the surface of Mars.”\n\nThese downhill flows, known as recurring slope lineae (RSL), often have been described as possibly related to liquid water. The new findings of hydrated salts on the slopes point to what that relationship may be to these dark features. The hydrated salts would lower the freezing point of a liquid brine, just as salt on roads here on Earth causes ice and snow to melt more rapidly. Scientists say it’s likely a shallow subsurface flow, with enough water wicking to the surface to explain the darkening.",

          "title": "Despite the Revolution, No Political Life in Idlib",
          "maxOccupiedPages": 3.619047619047619,
          "text": "The question remains: Where are the other leftist and nationalist movements in Syria today? And what about the supporters of the Ba'ath Party? Where have they disappeared to? Or did the end of tyranny also expose the falsehood and hypocrisy of Ba'athist affiliation?\n\nThese are questions answered by journalist and political activist Manhal Barish (37 years old), a former member of the opposition People's Democratic Party (formerly the Communist Party - Political Bureau). He tells the story of \"What Hasn't Been Told\": \"Basically, there weren't any movements in the true political sense. They were simply individuals and small groups who couldn't create a broad base of support in Syria. We're talking about political opponents, not an opposition. It was the situation of hundreds and thousands of people who couldn't find a unified front, with the exception of the Damascus Declaration Front (which included nationalists and leftists), which the regime also eliminated by arresting and disposing of its members, thus paralyzing the coalition.\"\n\nIn short, amidst an armed conflict combining sectarian strife, a regime's war against its own people, and regional and international conflicts, Barish believes there is no chance for a leftist movement to be effective, at least in the foreseeable future. Political activity, even within the confines of a democratic system, suffers repression and persecution in areas liberated from the regime to the same degree as in regime-held areas.\n\nAs for the Ba'ath Party supporters of today, who once held sway over every aspect of the country, they have either disappeared from public view or retreated into seclusion. \"Joining the Ba'ath Party used to provide members with preferential treatment in all kinds of government positions, both civilian and military. They had considerable influence within state institutions,\" says Muhammad al-Bayoush (50 years old), a former police officer and active Ba'ath Party member who now resides in Kafranbel after his retirement. He has withdrawn from society, trying to distance himself from current events and declaring no support for either the revolution or Assad and his regime.\n\nManhal Barish points out that a segment of the party's members turned against it, describing it as essentially \"a party of self-interest and opportunism. Most of the beneficiaries and mercenaries transformed into regime thugs, reflecting that it wasn't a party in the political sense, but rather that joining was motivated by fear of the authorities.\" Therefore, Barish argues, it's natural that the revolution exposed the falsity of Ba'ath Party membership, and that the claim of three or four million members is laughable.\n\nThis is echoed by revolutionary activist and member of the Union of Revolutionary Offices in Kafranbel, Ahmad Jalal (38 years old), who tells the story of \"What Hasn't Been Told\": \"There are no true Ba'athists, meaning no believers in the Ba'ath Party. They have all disavowed Ba'athism, even those who supported the regime, whose loyalty has now shifted to Bashar al-Assad, not the Ba'ath Party. With the outbreak of the revolution, the Ba'ath Party ceased to exist.\"\n\nGiven the absence of political parties in Idlib, despite the absence of Assad's forces there today, Al-Jalal explains that political parties emerge as a result of the rotation of power, and power in the liberated areas is managed by fighting factions in a manner similar to the emergency system due to the ongoing war in the region. It is an environment that is \"unsuitable for the emergence of any political parties, not to mention the factional polarization that has affected most segments. Between supporters and opponents of the faction, a kind of political current is formed that are in conflict over power, sometimes with weapons.\"",

          "title": "Rising Crime on the Syrian Coast",
          "maxOccupiedPages": 2.9523809523809526,
          "text": "(Latakia) “I was on my balcony at noon making a phone call when I saw a young man I knew on a neighbor’s balcony pull out a Russian rifle and shoot his fiancée and her sister. They fell to the ground instantly. Without stopping, the young man pointed the rifle at his own head and fired, falling dead himself in a pool of blood. When I arrived at their house, the fiancée (whose name was Rana) and the young man who killed her were already dead, while her sister, Hana, was fighting for her life. I carried her and rushed her to the National Hospital. Thank God, she miraculously survived, but the bullet had torn through her internal organs and severed an artery in her leg. She is still in the hospital today.”\n\nThis is what engineer Ayman (47 years old), a neighbor of the victim Rana (23 years old), told the story of. Rana never imagined that June 8th, the day the daytime curfew was lifted in Syria due to the coronavirus, would be the last day of her life, and that she would die at the hands of her fiancé.\n\nThe reason for the crime was Rana's refusal to return her gold jewelry to her fiancé, with the support of her sister, after she decided to break off their engagement. According to information from the victim's neighbors, he came to the house and asked her sister to leave the kitchen. Then, angrily, he addressed Rana with a single sentence: \"Is this your final word?\" When Rana replied in a frightened voice, \"Yes,\" the young man responded, \"Then return the rings and bracelet to me.\" The young woman took a breath and told him, \"This is my right, and I will not return anything to you.\" This marked the sixth officially recorded murder on the Syrian coast in a single month.\n\nA few days earlier, a fifteen-year-old boy living in the Saqoubin neighborhood (northern Latakia) shot and killed his father. Another crime occurred in the village of Bdeira (Tartous countryside), where a father, an engineer working at the port, slaughtered his wife and children before attempting suicide. The country was also rocked by a murder and rape in Dreikish (Tartous countryside) committed by two minors. This was followed by a murder in Tartous, where the perpetrator then committed suicide. Meanwhile, the murder of university professor Ahmed Subh, from Tartous and a teacher at Aleppo University, was revealed at the end of May to have been perpetrated by his two sons.\n\nDuring July, August, and September, three more murders occurred, and there may be other unreported or covered-up murders for various reasons. This is no longer unlikely given the widespread security and social breakdown plaguing the country today.\n\nThese incidents have been occurring with increasing frequency for years, with reports circulating of murders on the Syrian coast outside the context of the country's bloody conflict. While this might not seem surprising given the wartime circumstances, a closer examination of the frequency, numbers, spread, and nature of these crimes indicates a significant rise in the rate of murders committed in ways that are gruesome and unusual for these communities. This investigation aims to uncover the types of crimes, their prevalence, and their underlying and immediate causes.",

          "title": "Introducing the 2009 Nobel Prize in Physics: Optical Fibres and CCD Image Sensors",
          "maxOccupiedPages": 3.4285714285714284,
          "text": "Thanks to modern technological civilization, our lifestyles are constantly transforming, moving towards a new era of considerable convenience and comfort. This year, the 2009 Nobel Prize in Physics was awarded to three masters in the field of optoelectronic science who spearheaded this new lifestyle movement: American scientist of Chinese descent, Charles K. Kao; American scientist Willard S. Boyle; and Canadian scientist George E. Smith. They all converted light into electronic signals, thus profoundly transforming industry and human life.\n\nCharles K. Kao (born in Shanghai, China in 1933, the father of fiber optics, and former president of the Chinese University of Hong Kong) spearheaded the use of glass optical fibers as the medium for light wave transmission, significantly extending the transmission distance of optical signals. The achievements of fiber optic communication have enabled the ubiquitous reach of the internet today; fiber optics have shrunk the world into a village. Without fiber optic communication, there would be no internet age. Nobel laureate in Physics Charles K. Kao: \"The Father of Fiber Optics\" has brought the world closer together. The internal structure of fiber optics can be divided into a core of high-refractive-index glass and a surface layer coated with a low-refractive-index material. The principle is that light propagates in the core, utilizing the fact that the refractive index of the glass is greater than that of the surface layer, allowing light to propagate through total internal reflection. Normally, light attenuates within the glass due to absorption and scattering by impurities. However, in 1966, Kao Kuen confirmed the correlation between impurity concentration and light attenuation. Scientists then continuously produced high-purity glass, improving signal attenuation and successfully reducing signal transmission attenuation to 0.15 decibels per kilometer, enabling light signals to travel over 100 kilometers. Besides its applications in communications, optical fibers are also used in medical endoscopes and as signal lines for instruments.\n\nIn 1969, Willard S. Boyle and George E. Smith jointly invented the Charge-Coupled Device (CCD), an integrated circuit that can convert optical images into electronic digital signals in a short time, facilitating modern photography and telemetry technologies. The development of CCDs replaced the function of traditional film, storing optical images as digital information, leading to the development of modern digital cameras. Charge-coupled devices (CCDs) utilize photoelectric coupling technology, where light is converted into electronic signals through the photoelectric effect. Originally invented as memory devices, they utilize the photoelectrons generated by semiconductors exposed to light to charge CCDs, thus creating digital images. These images are stored using CCDs, captured electronically, replacing the function of traditional film and storing images as digital signals. CCDs have led to the widespread use of digital cameras today, changing people's lifestyles. CCDs have revolutionized photography, making digital image processing and transmission more convenient. These photosensitive elements are used in optical scanners and cameras, and are also widely used in medical and astronomical instruments.",

          "maxOccupiedPages": 2.238095238095238,
          "text": "Yesterday (September 10th) was the final day of the 2008 Taipei International Deaflympics Invitational Tournament. Besides table tennis and martial arts (judo, karate, and taekwondo), football was the last event to determine the rankings.\n\nIn the martial arts events, which concluded earlier on the third day (September 8th), European and Asian powerhouses demonstrated their strength. Even in judo, a knockout in six seconds caught the attention of spectators. Ultimately, the Chinese Taipei team performed best in taekwondo and karate; South Korea, in judo, repeatedly used technical points and knockouts to outmaneuver European and Japanese powerhouses.\n\nIn the final football match, Thailand and Japan faced off in a high-level championship game. In the 20th minute, Shifang Hengxian capitalized on a positioning error by the opposing goalkeeper, Theerawat Hansamer, taking a free kick from behind the halfway line and scoring to give Japan a 1-0 lead. However, before halftime, Somsak Thongdee capitalized on a lapse in defense to equalize at 1-1.\n\nIn the second half, Thailand's captain, Anothai Sathiyamat, transferred the lead to Thailand in the 60th minute, putting them ahead 2-1. Although Japan intensified their counter-attacks, it was too late, and Thailand secured the gold medal in football.\n\nIn the bronze medal match, Iran, leveraging their superior overall strength, easily won 8-0 thanks to goals from Mostafa Heydaribondarabadi, Hosseinali Mohammadi Firouzjaei, Mazaher Shirzad Sibani, and Hamid Reza Khazaei.\n\nAt the closing ceremony, the event's president and Taipei Mayor Hau Lung-bin stated, \"This competition has showcased the results of the Deaflympics' preparations, including the performance of participating countries and the administrative efforts of the organizing committee. Although some countries participated as a training exercise, we hope that all countries will deliver their best performance in next year's official Deaflympics.\"\           "text": "Augsburg (Germany), November 30, 2011 – A press conference regarding the murder of two police officers in Augsburg's Siebentischwald forest was held on Friday at the Swabia North Police Headquarters. Police and prosecutors believe the two brothers, aged 56 and 58, were planning a robbery when they were stopped by the two police officers for questioning. The 56-year-old brother had previously murdered an Augsburg police officer in 1975. To avoid prosecution, they allegedly opened fire on the 30-year-old female police officer and the 41-year-old male police officer with two weapons.\n\nThe press conference began with speeches by Bavarian Justice Minister Beate Merk (CSU), followed by Bavarian Interior Minister Joachim Herrmann (CSU). Merk stated that the state must take a stand, which is why she and Minister Herrmann were present: \"The government will not abandon the police.\" She added that she had long campaigned for an increase in the maximum penalty for resisting arrest, which had ultimately been achieved, but that some issues still needed to be addressed. She thanked the investigators and said, \"There is strong evidence that the two cowardly murderers have been caught.\"\n\nMinister Herrmann praised the work of the special task force \"Soko Spickel,\" noting that up to 53 officers had been working on the case simultaneously at times. He expressed his hope that if the suspicion against the 56-year-old perpetrator is confirmed, he will remain behind bars for life. The suspect has already served an 18-year sentence for the murder of a police officer, a crime committed in 1975.",

          "maxOccupiedPages": 1.0952380952380953,
          "text": "Berlin (Germany), February 11, 2012 – Internet users are taking to the streets today in many cities across Germany and Europe. In Germany, protests against the ACTA agreement are taking place in 60 cities.\n\nThe Anti-Counterfeiting Trade Agreement (ACTA) is an international trade agreement. The participating nations aim to establish international standards in the fight against product piracy and copyright infringement through ACTA.\n\nGermany has announced that it will not sign the agreement for the time being, joining the ranks of countries that have expressed concerns. However, no final decision has yet been made. The Green Party, the Left Party, and the Pirate Party see the postponement as a victory. These parties are staunch opponents of the agreement and fear significant restrictions on civil liberties. In France, a monitoring authority has already been established. It is called the High Authority for the Diffusion of Works and the Protection of Rights on the Internet (Hadopi). It can block people from using the internet for up to a year. Providers and rights holders cooperate directly with each other there. The United Kingdom is planning something similar.",

          "text": "Other political figures, such as Walter Veltroni, mayor of Rome, have openly supported the initiative. Grillo also conducted a survey of 209 MPs, finding 122 politicians in favor of reinstating direct preference (abolished with the electoral law reform promoted by the center-right during the previous legislature), 109 in favor of ineligibility for convicted candidates, and 82 in favor of limiting them to two terms in office.\n\nThe center of the demonstration was Bologna, where Beppe Grillo was present, along with other figures who criticize or mock the political world, such as Alessandro Bergonzoni, Sabina Guzzanti, Peter Gomez, and Marco Travaglio, as well as singers such as Gianna Nannini, Luciano Ligabue, who submitted a video testimony, and Biagio Antonacci. Musicians, comedians, and witnesses, such as the Calabrian youth of the \"Ammazzateci Tutti\" movement and the parents of Federico Aldrovandi, took turns on the stage. By early afternoon, despite the heat, twenty thousand people had gathered in Piazza Maggiore, completely occupying it and clogging many surrounding streets. Long lines could be seen at the signature collection points. The stage was set up with its back to the city hall, and the absence of any political symbols was noticeable, testifying to the demonstration's total apolitical nature. Only three banners were present in the square: one read \"Fuck you\" in marker, while the second read \"Class action.\" The third read \"Clementina Forleo, we are with you.\" Forleo is the Milan judge who submitted a request to Parliament to use the wiretaps that sparked the Bancopoli scandal in investigations into the summer 2005 takeovers. Indeed, the use of wiretaps of MPs requires Parliamentary authorization.\n\nThree stands were set up in Milan: in Piazza Cordusio near Sottovia Mercanti, in Piazza San Babila, and on Viale Papiniano. Also in Milan, Infrastructure Minister Antonio Di Pietro signed the bill, stating that \"those convicted with a final criminal sentence cannot be candidates. Criminals should be sent home, not to Parliament.\" The minister also said that similar bills have been proposed in the past, but Parliament \"doesn't want to listen.\"\n\nItalian Prime Minister Romano Prodi, present today in Bari for the inauguration of the Fiera del Levante, took a different view. When asked by volunteers to sign the bill as they exited, the prime minister refused to respond and instead drove to the airport.\n\nThe Green Party Federation also provided concrete support for Grillo's initiative: a stand was set up at the Festa dei Verdi in Rome to collect signatures, while the party's television station was made available to promote the initiative.",

          "maxOccupiedPages": 2.9047619047619047,
          "text": "Residents of the Susa Valley demonstrated today against the surveys for the construction of the high-speed railway. The deployment of law enforcement to protect the geologists was incredible: around 11 a.m., approximately 1,200 police officers, Carabinieri, and Guardia di Finanza (Italian Fire Brigade) were deployed. All this was to allow access to the three sites in the Mompantero mountains above Susa (Piedmont) and begin the surveys, which effectively represent the beginning of the project.\n\nThey were stopped by the valley residents, led by administrators, always at the forefront, wearing tricolor sashes, to avoid the most violent charges. The entire mountain was patrolled by more or less large groups, able to move according to the reports of police sightings, communicated via cell phones. Already during the night, many protesters had settled on the mountain, blocking the road at several points, erecting barricades, and knocking down rocks and trees to stop the armored vehicles. The key point of the day was a small bridge at the beginning of the road, where protesters and police officers jostled all day, with mayors at the forefront. The risk of falling from the five-meter-wide, ten-meter-high, and, most importantly, unguarded bridge, and the interposition of the mayors, courageously squeezed between the two opposing crowds, prevented the widespread use of smoke bombs and truncheons.\n\nThe confrontation then moved to the survey sites, which many protesters reached by bypassing the police roadblocks and skillfully exploiting the ancient mule tracks that were the scene of partisan battles 60 years ago. 500 protesters managed to push back the Carabinieri from the valley, just 20 meters from their destination. After several futile attempts to charge, the Carabinieri defused the tension by partially removing their helmets and accepting sweets and candy from the protesters.\n\nOther police officers were blocked on an access road to the site by a large barricade of logs and brambles, manned by a handful of mayors wearing tricolor sashes. Meanwhile, the entire municipal area of Mompantero was blocked to prevent other Val di Susa residents from accessing and assisting. All factories in the valley were blocked in solidarity, and the railway line was interrupted by other protesters for several hours, while the municipalities of Carrara and Ferrara were occupied in solidarity with the Val di Susa residents.\n\nAround 5:00 PM, police officers on both sides withdrew, followed by protesters about an hour later. The day's toll included several injuries and four arrests.\n\nFor today, the protesters have won a battle that has been going on for about a decade, to defend the territory from a project considered unnecessary by residents, as well as dangerous and damaging to the image and economy of the valley's towns. However, it is reported that experts managed to take possession of the sites overnight and begin surveys.",

          "maxOccupiedPages": 2.619047619047619,
          "text": "In Indonesia, the use of smartphones by government and other public institution employees at work has been prohibited due to security and confidentiality concerns. Furthermore, the manager of Manchester United FC (England) has instructed players to refrain from using smartphones for 48 hours before matches.\n\nFollowing incidents and accidents in the United States and other countries, Japan's National Cyber Security Center also issued warnings before the release of its content, urging people to \"avoid using smartphones while walking,\" \"avoid playing in dangerous places,\" \"pay attention to the weather,\" and \"be careful of heatstroke.\" Chief Cabinet Secretary Yoshihide Suga stated that \"it is gratifying that Japanese content is widely enjoyed around the world,\" but added that \"we hope people will follow the precautions for safe smartphone use.\" Additionally, JR West President Tatsuo Kijima stated at a press conference that \"we need to consider how to raise awareness to prevent accidents on trains and platforms,\" indicating that they will consider measures to prevent accidents. Osaka Mayor Hirofumi Yoshimura has also indicated his intention to strengthen warnings against using smartphones while walking on subways and buses. Following the incident in the United States where a boy trespassed onto the grounds of a nuclear power plant, the Nuclear Regulation Authority has also called on Japanese power companies to strengthen security. Izumo Taisha Shrine (Izumo City, Shimane Prefecture) and Kotohira-gu Shrine (Kotohira Town, Kagawa Prefecture) have posted notices on their websites and elsewhere advising people not to play on their grounds, while Tomioka Silk Mill (Tomioka City, Gunma Prefecture) has installed signs that read, \"Please be careful of restricted areas and accidents, and be considerate of your surroundings.\" Keta Taisha Shrine (Hakui City, Ishikawa Prefecture) has also prohibited the use of the game on its grounds and has asked the operating company to remove it from its list of points of interest. Deputy Chief Priest Mitsui Takahide said, \"There are stairs at the shrine, and I think it is dangerous to play 'Pokémon GO' there,\" adding, \"We will continue to take care to prevent injuries.\" The operating company has also issued a warning that accounts are being bought and sold on internet auctions. In an interview with NHK, the operating company stated, \"The buying and selling of accounts, which is prohibited by the terms of service, is illegal, and if discovered, we may delete the accounts or take legal action. We want people to enjoy the game while following the rules.\"",

          "text": "The Russian Ministry of Defense has issued a written demand for immediate measures to close the Aleksinskaya landfill in the city of Klin in the Moscow Region. The closure is attributed to swarms of birds attracted by the 30-hectare waste pile, which is paralyzing operations at the strategic Klin-5 airfield of the Russian Aerospace Forces (military unit 45095-A), located 3 km away. Until the landfill is closed and reclaimed, the birds could cause aviation tragedies, which would compromise flight safety and the safety of the city's residents. Current legislation prohibits the placement of landfills and waste disposal sites within the 15-kilometer approach zone of airfields. There have already been incidents of aircraft crashing into high-rise buildings and private residential buildings in Klin.\n\nInstead of closing the landfill, municipal authorities have allowed direct transit of road trains carrying waste across an unfinished highway, which is expected to be completed in 2020. The volume of waste disposed of ranges from 300 to 800 20-ton garbage trucks per day. Currently, this \"road\" is a clearing in the forest with slabs laid down. More than 30 hectares of protective forest were cleared in 2018 to construct it, which leads solely to the landfill.\n\nThe authorities are thus making it clear that they have no intention of closing the illegal landfill. Instead, they plan to expand it and construct a waste processing plant in a densely populated area, in violation of environmental regulations. Furthermore, there is no valid state environmental assessment, and the federal register of waste disposal facilities (GRORO) and the regional Territorial Waste Management Scheme contain false information about the landfill's area, capacity, and actual load. This, coupled with the proximity of an active airfield, clearly indicates that the continued operation of the landfill, much less its expansion, is illegal. Due to multiple exceedances of limits, violations of disposal technology, lack of waste refilling, and other deviations from design specifications, the recorded airborne concentration of harmful substances in Klin exceeds the maximum permissible concentration by 80 times with an easterly wind; with other wind directions, residents of nearby villages and towns suffer. Residential buildings are located 400 meters from the landfill, and the Yedunov Secondary School and the Oduvanchik Kindergarten are less than a kilometer away.",

          "maxOccupiedPages": 3.4285714285714284,
          "text": "Thousands of citizens participated in the National March for Justice and Peace, also known as the March of Silence, in Mexico City, led by poet Javier Sicilia. The group departed last Thursday from Cuernavaca, located 90 kilometers from the Mexican capital, and arrived Sunday afternoon at the country's main square, the Zócalo. The protesters demanded justice and peace in the face of the insecurity plaguing many parts of Mexico and the \"war\" declared by President Felipe Calderón against criminal organizations, which has left an estimated 40,000 victims and 10,000 missing persons. Sicilia concluded the event, after three days of walking, by calling for justice from the authorities and the resignation of Genaro García Luna, Mexico's Secretary of Public Security.\n\nWikinews consulted police and civil protection authorities, who confirmed that some 150,000 people arrived at the Zócalo, the site where Javier Sicilia delivered a speech demanding decisive action from the political class and proposing an electoral boycott in 2012, since, he accused, political parties of having members who negotiate with criminals.\n\n\"If we have walked and arrived like this, in silence, it is because our pain is so great and so deep, and the horror from which it stems so immense, that we no longer have words to express it. It is also because through this silence we tell ourselves, and we tell those responsible for the security of this country, that we do not want one more death because of this growing confusion that only seeks to suffocate us, as it suffocated the breath and life of my son Juan Francisco, of Luis Antonio, of Julio César, of Gabo, of María del Socorro, of Commander Jaime, and of so many thousands of men, women, children, and elderly people murdered with a contempt and vileness that belong to worlds that are not and never will be ours,\" the poet said in his message.\n\nBefore concluding and asking for five minutes of silence for all the victims, Sicilia announced the upcoming signing in Ciudad Juárez of the pact \"For a Peaceful, Just, and Secure Mexico,\" which contains six points. Among these points is a demand that authorities resolve, within three months, six of the most emblematic cases of Felipe Calderón's presidency: the execution of Juan Francisco's son, Sicilia's own son; the execution of 14 young people and two adults in Villas de Salvárcar, who were later determined to have been mistaken for drug cartel members; the murder of Rubí Fraire and her mother, Marisela Escobedo, which occurred in front of the Chihuahua State Government Palace; the murder of Benjamín LeBarón for denouncing kidnapping activities; and the 49 children who died in the ABC Daycare fire.\n\n“If we have marched and arrived like this, in silence, it is because our pain is so great and so deep, and the horror from which it stems so immense, that we no longer have words to express it.”\n\n“The pact we are calling for, after gathering many proposals from civil society, and which Olga Reyes, who has suffered the murder of six family members, will read in a few moments, is a pact that contains six fundamental points that will allow civil society to closely monitor its implementation and, in the event of any betrayal, to hold those responsible accountable,” the poet said.\n\nThe President of the Republic expressed respect for the march and its participants on Saturday, to which the opposition parties to Felipe Calderón responded with criticism. Sicilia accused the political class itself of creating “the mess,” urging them to listen to the citizens’ demands in silence.",

          "maxOccupiedPages": 1.2857142857142858,
          "text": "Several types of bacteria can also cause food poisoning. Some foods you buy—such as raw meat or fruits and vegetables—may already contain bacteria that you need to wash off or cook to destroy. Bacteria can also thrive in certain foods if not stored properly.\n\nBacteria like Staph and Bacillus cereus can make you sick quickly, within 1 to 7 hours. These bacteria produce fast-acting toxins in foods (such as meat or dairy for Staph, and starchy foods like rice for B. cereus). Keeping such foods refrigerated at 40 °F or colder helps slow or stop the growth of these bacteria.\n\nOther bacteria, such as Salmonella and Campylobacter, don’t make you sick until they get in your body and multiply. With these microbes, it can take 12 hours or a few days for you to feel ill. “Symptoms can include fever, cramps, and sometimes bloody diarrhea,” says O’Brien.\n\nWhen you have a foodborne illness, you usually need to drink plenty of fluids. “But see a doctor if you have blood in your stool,” O’Brien advises. “And if a child seems to have food poisoning, you should have the child seen by a doctor.”",

          "maxOccupiedPages": 2.857142857142857,
          "text": "Making Eid cakes is one of the most important and enduring traditions of the Eid holidays in Idlib city and its surrounding countryside. It sees a surge in popularity with the arrival of the holidays, as almost every home has these sweets, which are considered a staple in the hospitality offered to those celebrating.\n\nYellow cakes and cakes made with oil are the most popular in large areas of northern Syria. Over the years, they have remained a staple, although some of their ingredients have changed due to economic circumstances. However, they have maintained their quality and taste.\n\nMrs. Fatima Al-Naeem (37 years old) tells the story of how these sweets are prepared: \"Making cakes at home requires special skill and experience in preparing the dough. The type and quantity of spices added to the flour are the key to the deliciousness of the cakes.\"\n\nShe adds, \"The dough for these cookies is made with flour, ghee, and oil, along with a wide variety of spices, including mahlab, sesame seeds, fennel, nigella seeds, and nutmeg, as well as ginger, cinnamon, and anise. The dough is then shaped into long ropes, rolled into a circular shape, and baked in the oven. We can't imagine Eid without these ingredients because they remind us so much of our childhood and the family gatherings of the past. We also make these cookies to bring joy to our children, whose lives have been worn down by the harshness of war.\"\n\nIdlib and its surrounding countryside are famous for their long list of ready-made sweets and pastries, prepared for the holidays. Some shops specialize in these treats, known for their delicious taste and rich variety of nuts, such as baklava, barazek, warbat, and qatayef. However, these shops are closed to the poor, who cannot afford them due to their high prices, and sales are limited to those who are well-off.\n\n\"It pains me to see my children eagerly awaiting Eid, and I am unable to bring them happiness and joy.\" This is what Umm Mohsen (39 years old), displaced from the northern Hama countryside, told us, tears welling in her eyes. She explained that after her husband's death, they could no longer afford to buy Eid sweets because there was no one to provide for them.\n\nKhaled al-Mansour (44 years old), owner of a shop in Kafranbel, noted that business was slow this year for several reasons, most notably the systematic bombing of markets and crowded areas. He added that a large number of people had been displaced due to the intense shelling of their towns and villages, and some families lacked the money to buy sweets and new clothes for Eid. He pointed out that last year, around this time, the markets were bustling with people buying sweets and other necessities, even though prices this year were similar to last year.\n\nDespite the bombing, displacement, and forced migration, the people of Idlib and its surrounding countryside still celebrated Eid. The aroma of sweets wafted from their windows, overpowering the smell of fire and gunpowder.",

          "title": "Bananas, More Precious Than Gold",
          "maxOccupiedPages": 3.380952380952381,
          "text": "Most Syrian homes at that time were quite similar: the same blankets, cups and mugs, spoons and plates, matchboxes, tissue boxes, baby wipes, and tea biscuits if available. The source was also the same: government-subsidized consumer cooperatives, established to address the severe shortages of food and essential goods.\n\nThe missing items were also the same: tomatoes sometimes, lemons sometimes, but bananas were an unattainable dream for all Syrians, from the middle class to the poor. Only the lucky ones could afford bananas once or twice a year, as they were only available through smuggling and were prohibitively expensive for government employees. Government salaries at the time did not exceed 2,000 Syrian pounds (approximately $400), while a kilogram of bananas could cost up to 150 Syrian pounds (approximately $15), depending on their scarcity and origin. However, Ammar's father, a government employee at the General Organization for Social Insurance and Pensions, always tried to find a way to get a kilo of bananas for his children, Ammar, Hania, and Hassan. Sometimes Ammar would even share his portion with his siblings, as he wasn't particularly fond of bananas. He couldn't understand why they were harder to obtain than potatoes, which he loved in all their forms—fried, boiled, or roasted—and why eating them was so expensive. Even cucumbers were more refreshing and enjoyable for him than bananas. The family had to eat bananas secretly on rare occasions so as not to tempt the neighbors and their children and surprise them with an unexpected visit, as had happened once when Hassan was peeling a banana on the windowsill. A neighbor spotted him, and his wife and four children went to Ammar's mother's house for a cup of coffee. The children disappeared, only to be discovered on the kitchen floor having devoured all the bananas. That day, Ammar saw his father looking dejected, tears frozen in his eyes, as if he had lost a mountain of gold. Perhaps Ammar's relationship with bananas was fraught because he couldn't distinguish between the fruit itself and the humiliating and stressful circumstances surrounding the rituals of buying and eating it, which were enough to kill any sense of enjoyment or satisfaction.\n\nFurthermore, due to his lack of experience with eating bananas, the family often ate unripe, hard bananas. The taste of the unripe banana in the mouth made the experience even more disappointing and unpleasant. However, his mother always extolled the high nutritional value of bananas, emphasizing that eating them was beneficial in many ways, not just for satisfying cravings.\n\nAmmar also remembers his mother talking to her neighbors about bananas being a fruit of Paradise, and the heated debate that ensued because there was no religious evidence for this. His mother insisted that if there were no bananas in Paradise, it would be lacking. One of the neighbors then offered an explanation, asserting that bananas were available in Paradise because believers craved them, and Paradise contains whatever believers desire!\n\nThe days passed, the children grew up, and Ammar's father retired. The country's economic situation changed, and bananas became readily available to everyone, in various types—Lebanese, Somali, and with labels bearing unusual names—suiting all budgets. They could be bought for as little as 25 or even 30 Syrian pounds. Syrians, including Ammar's family, rushed to buy bananas, to the point that banana peels littered the streets, bags, and garbage bins. But Ammar still found them difficult to eat, except perhaps with the smoothies and milkshakes he drank before going to the gym.",

          "title": "A Guide to Buying Domestically Grown Rice",
          "maxOccupiedPages": 2.238095238095238,
          "text": "With hundreds of domestically produced packaged rice brands on the market, how should one choose? Rice can be categorized by its milling process into brown rice (husk removed), germ rice (brown rice with some bran removed), and white rice (germinated rice with the germ removed and fully whitened). Brown rice has the highest nutritional value, while white rice offers the best taste. If you prioritize nutritional value, it's recommended to choose brown rice or germ rice that retains the bran or germ nutrients. If you value taste, choose white rice. Consumers can choose different milling levels based on their personal preferences and needs. The quality of white rice can be discerned from the appearance of the grains inside the bag. Old rice grains will be yellowed, powdery, less transparent, and lack luster, often with an off-odor. As a result, cooked rice will be harder, less sticky, less elastic, and less fragrant. Furthermore, if the rice grains contain too many green rice grains, signs of insect infestation, or broken grains, the quality is poor, affecting the appearance and taste of the cooked rice. If consumers find self-inspection too complicated and time-consuming, it is recommended to choose rice marked with \"CAS\" (Certified Excellent Agricultural Product). This means the rice is grown in suitable areas according to government-recommended varieties and produced in well-managed processing plants. Its quality meets or exceeds the Republic of China National Standard (CNS) Grade 1 standard and is subject to regular safety inspections, ensuring quality. You can also refer to brands from factories with government guidance and good quality control. Remember, \"you get what you pay for,\" and don't be tempted by unreasonably low prices. Furthermore, rice deteriorates gradually after being exposed to air after milling. It's best to buy a month's worth at a time, store it in a dry, cool place after opening, and refrigerate it if it cannot be consumed in a short period. Those who have eaten Thai rice often remember it as lacking stickiness and having a loose texture, while domestically produced rice is sweet, soft, and chewy, clearly demonstrating that variety and origin determine the quality of rice.",

          "title": "Camellia Oil: A First Choice for Healthy Cooking",
          "maxOccupiedPages": 2.8095238095238093,
          "text": "In recent years, food safety issues have caused public anxiety about food safety. Cooking oil is one of the seven necessities of life (firewood, rice, oil, salt, soy sauce, vinegar, and tea), making the selection of healthy, safe, and high-quality cooking oil a major concern for housewives. However, the perfect cooking oil to maintain the health of the whole family is right at hand – camellia oil. Camellia oil, along with oil palm, olive, and coconut, is known as one of the world's four major woody oilseed plants. As early as 2300 years ago, our ancestors regarded it as a \"miracle oil,\" and the Food and Agriculture Organization of the United Nations has listed it as a key healthy cooking oil for promotion. However, consumers are generally unfamiliar with camellia oil and even less aware of how to choose the right one to ensure their families' peace of mind. This article provides a brief introduction to camellia oil to help consumers choose the right oil and consume healthy oil. Currently, there are three main types of camellia oil on the Taiwanese market, divided into two categories based on tree height and tree species. All three belong to the order Theales, family Theaceae, and genus Camellia. The first type of camellia tree, with a relatively tall stature, is commonly known as \"true camellia oil.\" There are two types. One is the short-column camellia, scientifically known as *Camellia brevistyla* (Hayata) Coh.-Stuart or *Camellia tenuifolia*, which produces white flowers or flowers with golden-yellow buds. Its fruits are relatively small, commonly called \"small-fruited camellia,\" \"golden-flowered small fruit,\" or \"tall tree with small fruit,\" and it has a low yield and high price. The other type is the camellia tree, scientifically known as *Camellia oleifera* Abel, which produces white flowers or bright red flowers with buds. Its fruits are large seeds, commonly called \"large-fruited camellia,\" or \"red-flowered large fruit,\" and it has a higher yield and is therefore cheaper. The camellia oil produced from these two types of trees is generally called \"bitter camellia oil\" or \"camellia seed oil.\" In mainland China, it is called (wild) camellia oil; in Japan, it is called camellia oil; and in Europe and America, it is called camellia seed oil. The second type of camellia tree, with a shorter stature, is scientifically named *Camellia sinensis* (L.) O. Kuntze. Its leaves are generally used to produce various types of tea (oolong tea, black tea, green tea, etc.) for drinking. The oil made from the seeds of this tree is called \"tea oil\" or \"tea seed oil,\" commonly known as tea seed oil. The three types of tea oil have different flavors. Comparing their edible texture and aroma intensity, tea seed oil is more mellow and smooth, superior to the two bitter tea oils.",

          "text": "IMPORTANT: The pot must be made of stainless steel (either 18/10 or AMC), as this method only works with stainless steel. All other pots are unsuitable and cannot be used. A set of stainless steel pots is available from around €20, and you'll save water, electricity or gas, and salt. You'll need 300 ml of water for every 100 g of pasta. For four people, you'll need approximately 500 g of pasta, which equates to 1.5 liters of water. The pot should be large enough to hold everything, and the water shouldn't boil over when stirring.\n\nPlace the pot filled with water on the stovetop (you can set it to the highest setting) and wait until the water boils vigorously. It's essential to add the salt now (10-15 g per liter of water). Adding it at the end will irreversibly leach the salt from the pasta. Therefore, adding salt afterward is pointless. Now add the pasta to the salted water and stir to prevent it from sticking to the bottom. Stir a few more times to ensure all the pasta is cooked. (If you want to do something else at the same time, it's recommended to use the traditional method of 1 liter of water per 100g of pasta in any pot; this eliminates the need for stirring.) The cooking time is indicated on the packaging, and after cooking, the pasta should be approximately al dente, meaning it should have a slightly firm, perceptible center when biting into it. The center may be just barely visible (lighter than the rest of the pasta) or not at all – depending on your definition of \"al dente.\" In Italy, you can sometimes find pasta that is very, very firm. In any case, when the pasta is approximately al dente, all the water should have been absorbed. If not, it's better to drain off the excess water than to let the pasta become too soft.",

          "title": "Cookbook / Cooking Techniques / Cooking Pasta",

          "text": "Boiling water involves raising the temperature of a certain volume of water from room temperature (assuming it's 25°C) to boiling point (100°C).\n\nThe water used for this process must meet the \"potable\" water specifications. It can be drawn from the mains, a water supply, or purchased bottled. If the water is drawn from the mains, special care must be taken to ensure that its potability is not compromised by deterioration (e.g., corrosion) or fouling of the household pipes.\n\nTo contain the boiling water, a steel pot (which is an excellent heat conductor) is used, the bottom of which is typically heated by a burner fueled by a combustible gas (methane or a propane-butane mixture). An alternative to a gas cooktop is an induction cooktop, which is safer because it does not contain open flames (which can cause burns) or combustible gases (which, if used incorrectly or if the connection pipe is damaged, can lead to unconsciousness and a fire or explosion).\n\nThe amount of water to use for cooking depends on the desired amount of pasta (generally, no less than 1 liter is needed for every 100 grams of pasta). Once the amount of pasta has been determined, it is possible to estimate the amount of water needed and therefore the diameter of the pot used for this purpose. This should be determined by considering that the water should not completely fill the pot, but should be a few centimeters below the rim (or about 2/3 full), so as to limit foaming, which intensifies during the actual cooking phase (i.e., after mixing the pasta and table salt into the cooking water).\n\nThe arrival of boiling point is indicated by the formation of bubbles within the liquid mass, which occurs at the bottom of the pan (where the temperature is highest). After the formation of the first (smaller) bubbles, bubbles with gradually increasing diameters form.",
